# docker/detection-lab.compose.yml
# The detection lab: a single-node OpenSearch + Dashboards stack — the blue
# team's log store and query console. Brought up/down with the defense.zsh
# helpers (they auto-load docker/.env if present):
#
#   siemup        # up -d        siemlogs   # follow        siemdown   # tear down
#
# FIRST RUN (once):
#   1. cp docker/detection-lab.env.example docker/.env   # gitignored
#   2. edit docker/.env — set a STRONG OPENSEARCH_INITIAL_ADMIN_PASSWORD
#   3. host kernel setting OpenSearch needs (see docker/README.md):
#        sudo sysctl -w vm.max_map_count=262144
#   4. siemup   →   Dashboards at http://127.0.0.1:5601  (login: admin / your pw)
#
# Discipline (docker/README.md): data volumes are gitignored (docker/**/data/),
# image tags are pinned (Renovate's docker:pinDigests maintains the @sha256
# digest pin), and every port is bound to 127.0.0.1 — the lab is never LAN-exposed.

services:
  # ── OpenSearch: the search/analytics engine (the log store) ────────────────
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: detection-lab-opensearch
    environment:
      - cluster.name=detection-lab
      - node.name=opensearch
      - discovery.type=single-node # lab: one node, no bootstrap checks
      - bootstrap.memory_lock=true # disable swapping (paired with the memlock ulimit)
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g" # heap; raise for larger corpora
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set it in docker/.env}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ./detection-lab/data/opensearch:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200" # REST API — localhost only
    healthcheck:
      # -k: the demo config ships a self-signed cert; auth with the admin creds.
      # $$ (not $) so Compose does NOT interpolate the password at render time — it
      # stays out of `docker compose config`/`inspect`; the container shell expands
      # $OPENSEARCH_INITIAL_ADMIN_PASSWORD (set in this service's environment) at runtime.
      test: ["CMD-SHELL", "curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Dashboards: the query console / visualization UI ───────────────────────
  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: detection-lab-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set it in docker/.env}
      # OpenSearch's demo TLS is a self-signed cert; skip verification for this local
      # lab so Dashboards can connect (it would otherwise fail TLS validation).
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "127.0.0.1:5601:5601" # web UI — localhost only
    # Long-form depends_on gates Dashboards on OpenSearch being *healthy*. This needs
    # Compose v2 (`docker compose`); legacy docker-compose v1 (EOL) ignores the
    # condition — the detection lab requires Compose v2 (see docker/README.md).
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
