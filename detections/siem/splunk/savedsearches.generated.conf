client_id or app_name, broad/sensitive scopes (mail.google.com, drive, gmail.readonly), \
or a burst of authorize events across users (a campaign). \
Validate (purple): authorize a scoped OAuth app from dotfiles-Offense (htpx pair \
gws-oauth-grant).
