### snowflake (--without-pipeline)

[Snowflake data unload (COPY INTO external stage — exfil triage)]
description = Detects Snowflake data unloads to a non-internal destination in \
ACCOUNT_USAGE.QUERY_HISTORY (QUERY_TYPE=UNLOAD, a COPY INTO <location>) - the \
2024-campaign move of copying whole tables to an attacker-controlled external stage / \
cloud bucket at warehouse speed (T1567.002). Internal-stage unloads (table stage `@%`, \
user stage `@~`) are routine ETL and are filtered out, so the rule fires on unloads to \
a cloud URL (s3/azure/gcs) or a named stage - the external-exfil shape - rather than on \
every unload (the earlier bare form matched all ETL and was a mute-me alert). \
Scope note: a COPY INTO a *named* external stage carries the stage name, not a URL, and \
Snowflake doesn't mark internal-vs-external in the query text - so allowlist your known \
named stages via filter_known_stages below (a named INTERNAL stage would otherwise \
alert). Still worth the volume/role triage the backend adds (large ROWS_UNLOADED, an \
unusual role/warehouse, a first-time destination). \
Validate (purple): COPY INTO an external stage from dotfiles-Offense (htpx pair \
snowflake-exfil-stage).
search = query_type="UNLOAD" NOT (query_text IN ("*@%*", "*@~*") OR query_text="*MY_SANCTIONED_STAGE*")

[Snowflake network policy changed (IP allowlist tamper)]
description = Detects Snowflake network-policy changes in ACCOUNT_USAGE.QUERY_HISTORY (query text \
containing NETWORK POLICY - a CREATE/ALTER/DROP network policy or ALTER ACCOUNT/USER SET \
NETWORK_POLICY). A network policy is Snowflake's IP allowlist; opening it (a wide \
ALLOWED_IP_LIST like 0.0.0.0/0) or dropping the enforced one lets stolen credentials work \
from anywhere - the control gap behind the 2024 credential-stuffing (T1562.007). These are \
rare and high-impact, so any change warrants review; read-only SHOW is excluded. \
Validate (purple): open/drop a network policy from dotfiles-Offense (htpx pair \
snowflake-network-policy).
search = query_text IN ("*NETWORK POLICY*", "*NETWORK_POLICY*") NOT query_text="SHOW*"

[Snowflake user created or ACCOUNTADMIN granted (tenant persistence)]
description = Detects Snowflake user creation or a high-power role grant in ACCOUNT_USAGE.QUERY_HISTORY: \
QUERY_TYPE=CREATE_USER, or a GRANT whose text carries ACCOUNTADMIN/SECURITYADMIN. After an \
admin compromise an attacker creates their own user and grants it ACCOUNTADMIN - a durable, \
full-tenant login that survives the victim's password reset (T1136.003). Both are rare, \
admin-level changes, so one by an unexpected actor - especially a create immediately \
followed by an ACCOUNTADMIN grant - warrants review. \
Validate (purple): create a user + grant ACCOUNTADMIN from dotfiles-Offense (htpx pair \
snowflake-rogue-user).
search = query_type="CREATE_USER" OR (query_type="GRANT" query_text IN ("*ACCOUNTADMIN*", "*SECURITYADMIN*"))

### google_workspace (--without-pipeline)

[Google Workspace admin/super-admin role granted (tenant persistence)]
