# savedsearches.generated.conf — GENERATED by detections/siem/gen-siem.sh. DO NOT EDIT.
#
# Reproducible compile of every Sigma rule in detections/sigma/ to its Splunk
# savedsearches deploy form. Regenerate with detections/siem/gen-siem.sh; CI drift-gates
# it with `gen-siem.sh --check`. Windows dirs use the splunk_windows TA pipeline; the
# non-Windows platform dirs compile with raw logical field names (normalize to your CIM
# before deploying). The hand-authored savedsearches.conf / correlation_searches.conf /
# sentinel/ forms alongside this file cover the enriched, absence/join, and Sentinel
# detections a bare compile can't emit.

[default]
dispatch.earliest_time = -60m
dispatch.latest_time = now

### credential_access (splunk_windows)

[AS-REP roast - TGT issued without pre-authentication (4768 type 0)]
description = Detects the AS-REP roast invariant itself: a Kerberos TGT (4768) issued for a \
non-machine account with Pre-Authentication Type 0 - i.e. the account has "do not \
require Kerberos pre-authentication" set, so the KDC returns an AS-REP encrypted with \
the account's key that an attacker (GetNPUsers / Rubeus asreproast) cracks offline. \
The companion 4771 0x18 rule only catches the *enumeration* tell (wrong-password \
pre-auth failures); an operator roasting accounts already flagged no-preauth harvests \
AS-REPs via 4768 type 0 and generates zero 4771 failures, sailing past that rule. This \
is the primary vector and is near-zero-FP - almost no modern account legitimately runs \
without pre-auth, so a honey no-preauth account makes it a pure tripwire. \
Validate (purple): run GetNPUsers / Rubeus asreproast from dotfiles-Offense (hacktheplanet \
"Microsoft Windows Kerberos" fold; htpx pair asreproast-getnpusers).
search = source="WinEventLog:Security" EventCode=4768 PreAuthType=0 NOT TargetUserName="*$"

[AS-REP / Kerbrute username enumeration (4771 0x18)]
description = Detects one client address generating Kerberos pre-auth failures (0x18) across \
many distinct accounts - the AS-REP / username-enumeration tell (Kerbrute userenum, \
GetNPUsers probing). A real user fat-fingers their own name, not five-plus others. \
This catches the enumeration sweep; the successful roast itself (4768 pre-auth type \
0) is detected by asrep_roast_4768.yml. \
Validate (purple): run "kerbrute userenum" / GetNPUsers from dotfiles-Offense \
(hacktheplanet "Microsoft Windows Kerberos" fold; htpx pair asreproast-getnpusers).
search = source="WinEventLog:Security" EventCode=4771 Status="0x18" \
 \
| bin _time span=10m \
| stats dc(TargetUserName) as value_count by _time IpAddress \
 \
| search value_count >= 5

[Authentication coercion - named-pipe access over IPC$ (5145)]
description = Detects the on-wire moment of an authentication-coercion trigger: a 5145 detailed \
file-share access to one of the coercion named pipes - spoolss (PrinterBug), \
efsrpc (PetitPotam), lsarpc/netlogon (DFSCoerce/others), or lsass - over the IPC$ \
share. Every coercion vector converges on this small set of RPC endpoints, so the \
detection keys on the pipe set rather than the tool: the target endpoint can't \
change even as the coercion technique does. This is the trigger half of the \
coercion -> relay chain; the relayed logon is caught separately (see the 4624 \
fan-out rule). \
Detection posture: broad triage surface even after filtering. netlogon and lsarpc carry \
legitimate domain traffic, so this still fires on benign access by real users - scope by \
threshold, source, or pipe subset per environment, and pair with a coercion tripwire host. \
Prefer efsrpc/spoolss as the higher-signal subset if the full set is too noisy; those two \
are genuinely rare over IPC$, where netlogon and lsarpc are not. Splitting them into an \
alerting subset plus a distinct-target fan-out correlation for the noisy pair (the shape \
host_enum_srvsvc_wkssvc_5145 already uses) is the next step if the machine-account filter \
alone does not bring the volume down. \
Validate (purple): run PetitPotam / coercer / printerbug from dotfiles-Offense \
(hacktheplanet "Poisoning & relay" fold; htpx pair coerce-petitpotam). Requires \
detailed file-share auditing (5145) on DCs and servers.
search = source="WinEventLog:Security" EventCode=5145 ShareName="*IPC$*" RelativeTargetName IN ("*spoolss*", "*efsrpc*", "*lsarpc*", "*netlogon*", "*lsass*") NOT SubjectUserName="*$"

[DCSync - directory replication right requested by a non-DC]
description = Detects DCSync: a 4662 directory-access event requesting the \
DS-Replication-Get-Changes-All extended right. Legitimate replication comes from \
DC machine accounts, so a user/admin principal requesting it is the anomaly - \
the replication right is the invariant the technique cannot avoid. \
Validate (purple): run impacket-secretsdump -just-dc from dotfiles-Offense \
(hacktheplanet "DCSync / NTDS dump" fold; htpx pair dcsync-secretsdump). \
Requires the Directory Service Access audit subcategory + a SACL on the domain \
head granting auditing of the replication right.
search = source="WinEventLog:Security" EventCode=4662 Properties IN ("*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*", "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*", "*89e95b76-444d-4c62-991a-0facbeda640c*") NOT (SubjectUserName="*$" OR SubjectUserSid="S-1-5-18")

[DPAPI domain backup-key theft - protected_storage pipe (5145)]
description = Detects retrieval of the DPAPI domain backup key: a 5145 detailed file-share \
access whose relative target is the protected_storage named pipe over IPC$ on a \
domain controller. The backup key rides MS-BKRP over that pipe, and almost nothing \
but a genuine domain backup operation touches it - so a non-backup principal \
accessing protected_storage on a DC is the tell. With the backup key an attacker \
decrypts every user's DPAPI master keys (browser/credential-manager secrets) \
domain-wide; that decryption is offline, so this RPC is the only on-wire moment. \
Detection posture: narrow but real - near-zero-FP on DCs, which is why it stays a \
single-selection alert rather than a volume correlation. \
Validate (purple): run SharpDPAPI backupkey or mimikatz lsadump::backupkeys from \
dotfiles-Offense (hacktheplanet "Credential access" fold; htpx pair dpapi-backupkey). \
Requires detailed file-share auditing (5145) on domain controllers.
search = source="WinEventLog:Security" EventCode=5145 ShareName="*IPC$*" RelativeTargetName="*protected_storage*" NOT SubjectUserName="*$"

[GPP cpassword hunt - SYSVOL preferences XML read by a user]
description = Detects the on-wire moment of a GPP cpassword hunt: a 5145 detailed file-share \
access on the SYSVOL share whose relative target is a credential-bearing Group \
Policy Preferences XML. The decrypt is offline (Microsoft published the AES key), \
so the read is the only telemetry. Scope to interactive accounts - Group Policy \
clients (machine accounts) read these legitimately. \
Validate (purple): run "nxc -M gpp_password" from dotfiles-Offense (hacktheplanet \
SMB fold; htpx pair gpp-cpassword). Honey-policy a fake Groups.xml for a \
near-zero-FP tripwire. Requires detailed file-share auditing on DCs.
search = source="WinEventLog:Security" EventCode=5145 ShareName="*SYSVOL*" RelativeTargetName IN ("*Groups.xml", "*Services.xml", "*ScheduledTasks.xml", "*Printers.xml", "*DataSources.xml") NOT SubjectUserName="*$"

[Kerberoasting - RC4 service ticket for a user SPN]
description = Detects the Kerberoasting invariant: an RC4 (0x17) TGS-REQ for a non-machine, \
non-krbtgt SPN. The encryption downgrade is the tell even when ticket flags look \
normal - roasting tools force RC4 to keep the hash crackable. Detect on the \
downgrade, not the tool name or count. \
Validate (purple): run the "Microsoft Windows Kerberos" Kerberoast fold in \
dotfiles-Offense/offensive/hacktheplanet (htpx pair: kerberoast-getuserspns <-> this); \
confirm the 4769 fires with Ticket_Encryption_Type 0x17.
search = source="WinEventLog:Security" EventCode=4769 TicketEncryptionType="0x17" NOT (ServiceName IN ("*$", "krbtgt"))

[LSASS process access with dump-shaped rights]
description = Detects credential theft from memory: a handle to lsass.exe with read/dump \
access rights, from a process that is not a known security/AV engine. Sysmon 10 \
(ProcessAccess) sees this far better than the Security log; the GrantedAccess \
masks below are the classic dump-capable combinations (0x1010, 0x1410, 0x1438, \
0x143a, 0x1fffff). 0x1fffff is PROCESS_ALL_ACCESS - the broadest of the set and the one \
most likely to be a legitimate agent opening LSASS with a full-rights handle, so if this \
rule stays noisy after the allowlist below is populated, that mask is where the noise is. \
Validate (purple): run "nxc -M lsassy" / a remote LSASS dump from dotfiles-Offense \
(hacktheplanet "Lateral movement" fold; htpx pair lsass-dump-lsassy). Tune the \
SourceImage allowlist to your EDR/AV.
search = TargetImage="*\\lsass.exe" GrantedAccess IN ("0x1010", "0x1410", "0x1438", "0x143a", "0x1fffff") NOT (SourceImage IN ("*\\MsMpEng.exe*", "*\\MsSense.exe*", "*\\wininit.exe*", "*\\csrss.exe*", "*\\CSFalconService.exe*", "*\\SentinelAgent.exe*", "*\\RepMgr.exe*"))

[NTDS.dit theft via ntdsutil / VSS on a domain controller]
description = Detects local NTDS.dit extraction on a DC, which sidesteps the DCSync 4662 \
replication detection entirely: ntdsutil with an ifm/create-full argument, or \
vssadmin/diskshadow/wbadmin creating a shadow copy to copy NTDS.dit + the SYSTEM \
hive out. Almost nothing legitimately runs "ntdsutil ... ifm" outside a planned \
DC backup/migration. Corroborate with event 8222 (shadow copy created). \
Validate (purple): run the ntdsutil/VSS dump from dotfiles-Offense (hacktheplanet \
"DCSync / NTDS dump" fold; htpx pair ntds-ntdsutil). Scope to DC hosts.
search = (Image="*\\ntdsutil.exe" CommandLine IN ("*ifm*", "*create full*")) OR (CommandLine IN ("*vssadmin create shadow*", "*wbadmin start backup*") Image IN ("*\\vssadmin.exe", "*\\wbadmin.exe")) OR Image="*\\diskshadow.exe"

[Password spray - one source, many accounts (4625)]
description = Detects one source address failing against many distinct accounts in a short \
window - the spray shape, the inverse of one user fat-fingering their own \
password. Counting distinct accounts per source beats a raw failure-rate \
threshold because the spray is deliberately slow. \
Validate (purple): run kerbrute/nxc password spray from dotfiles-Offense \
(hacktheplanet "Microsoft Windows Kerberos" / "Poisoning & relay" folds).
search = source="WinEventLog:Security" EventCode=4625 NOT (IpAddress IN ("-", "127.0.0.1", "::1")) \
 \
| bin _time span=15m \
| stats dc(TargetUserName) as value_count by _time IpAddress \
 \
| search value_count >= 10

### privilege_escalation (splunk_windows)

[AD CS certificate request (ESC1 triage surface)]
description = Surfaces certificate-request activity (4886/4887) for ESC1 / relay-to-ADCS \
triage. The ESC1 invariant is a request whose subjectAltName names a *different* \
principal than the requester - but that is a field-to-field comparison Sigma \
cannot express, so this rule deliberately selects the request events and leaves \
the SAN-vs-Requester comparison to the analyst / a correlation in the backend \
(pull the requested UPN from the 4886 and compare to Requester). It is therefore \
a broad triage surface, not a high-fidelity alert on its own - pair it with a \
baseline of enrollment agents and watch 5136 writes to userCertificate. \
Validate (purple): run "certipy-ad req ... -upn administrator" from dotfiles-Offense \
(hacktheplanet "AD CS abuse" fold; htpx pair adcs-esc1-certipy). Requires CA \
request auditing (auditpol / CA "Issued requests" logging) to populate 4886/4887.
search = source="WinEventLog:Security" EventCode IN (4886, 4887)

[Potato privesc - service identity spawning an interactive shell (Security 4688)]
description = Detection posture: moderate. SeImpersonate abuse (PrintSpoofer/GodPotato/Juicy) \
uses a legitimate impersonation API, and 4688 alone cannot show the run-as-SYSTEM \
result. This flags the shape it can see - a service identity (app-pool / machine \
account / NETWORK|LOCAL SERVICE) spawning cmd/powershell. Confirm the SYSTEM \
outcome with Sysmon 17/18 on the spoolss/DCOM named pipe and Sysmon 1 linking the \
service parent to a SYSTEM child. \
Channel: native Security-4688 carries the account in SubjectUserName. This is the \
4688 half of a per-channel pair - its Sysmon-1 twin (field User) is \
potato_seimpersonate_sysmon_1.yml (id 03e878f6-bbdc-41e1-afa6-68b2979938fe). The \
two are split on purpose: a single rule naming both User and SubjectUserName nulls \
under any single pysigma pipeline (the pipeline that can't resolve one field drops \
the whole rule), so it silently never fires. Deploy both; whichever channel your \
hosts forward will match. \
Validate (purple): run PrintSpoofer/GodPotato from dotfiles-Offense (hacktheplanet \
"Windows privilege escalation" fold; htpx pair potato-seimpersonate).
search = Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe") SubjectUserName IN ("*APPPOOL*", "*NETWORK SERVICE*", "*LOCAL SERVICE*")

[Potato privesc - service identity spawning an interactive shell (Sysmon 1)]
description = Detection posture: moderate. SeImpersonate abuse (PrintSpoofer/GodPotato/Juicy) \
uses a legitimate impersonation API, and process-creation alone cannot show the \
run-as-SYSTEM result. This flags the shape it can see - a service identity \
(app-pool / machine account / NETWORK|LOCAL SERVICE) spawning cmd/powershell. \
Confirm the SYSTEM outcome with Sysmon 17/18 on the spoolss/DCOM named pipe and \
Sysmon 1 linking the service parent to a SYSTEM child. \
Channel: Sysmon EventID 1 carries the account in User. This is the Sysmon half of a \
per-channel pair - its Security-4688 twin (field SubjectUserName) is \
potato_seimpersonate_4688.yml (id 9486ed6c-4c38-457f-a475-188a978eaa4a). The two are \
split on purpose: a single rule naming both User and SubjectUserName nulls under any \
single pysigma pipeline (the pipeline that can't resolve one field drops the whole \
rule), so it silently never fires. Deploy both; whichever channel your hosts forward \
will match. \
Validate (purple): run PrintSpoofer/GodPotato from dotfiles-Offense (hacktheplanet \
"Windows privilege escalation" fold; htpx pair potato-seimpersonate).
search = Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe") User IN ("*APPPOOL*", "*NETWORK SERVICE*", "*LOCAL SERVICE*")

[RBCD abuse - msDS-AllowedToActOnBehalfOfOtherIdentity write]
description = Detects resource-based constrained delegation abuse: a 5136 event writing \
msDS-AllowedToActOnBehalfOfOtherIdentity on a computer object. Configuring RBCD \
requires this write, so it is the invariant. Legitimately an admin delegating a \
service sets it; a write sourced from a normal user onto a computer object is the \
anomaly. Pair with the 4741 computer-account-creation burst (the attacker's machine \
account) - see machine_account_creation_burst_4741 - for higher fidelity without \
relying on the delegation-admin allowlist alone. \
Validate (purple): run the impacket addcomputer/rbcd/getST chain from dotfiles-Offense \
(hacktheplanet "Active Directory - attack paths" fold; htpx pair rbcd-impacket). \
Requires the Directory Service Changes audit subcategory + a SACL.
search = source="WinEventLog:Security" EventCode=5136 AttributeLDAPDisplayName="msDS-AllowedToActOnBehalfOfOtherIdentity" NOT SubjectUserName="svc_delegation"

[Shadow Credentials - msDS-KeyCredentialLink write]
description = Detects Shadow Credentials: a 5136 directory-object-modified event writing the \
msDS-KeyCredentialLink attribute. The attack must write this attribute to add an \
attacker-controlled key for PKINIT, so the write is the invariant. Almost nothing \
legitimately writes it except Windows Hello for Business enrollment - allowlist \
those sources and alert on the rest. \
Validate (purple): run "certipy-ad shadow auto" from dotfiles-Offense (hacktheplanet \
"Active Directory - attack paths" fold; htpx pair shadow-credentials-certipy). \
Requires the Directory Service Changes audit subcategory + a SACL on the objects.
search = source="WinEventLog:Security" EventCode=5136 AttributeLDAPDisplayName="msDS-KeyCredentialLink"

### lateral_movement (splunk_windows)

[Pass-the-hash / credential reuse - one source, many hosts (4624)]
description = Detects one source address successfully authenticating (4624 type 3) to many \
distinct hosts in a short window - the lateral-movement fan-out. Pass-the-hash, \
sprayed-then-reused credentials, and NTLM relay all fan out the same way, and the \
auth *succeeds*, so the signal is breadth (distinct destination hosts), not a \
failure count - none of the 4688 process-exec lateral rules can see a logon that \
never spawns a shell. Counting distinct hosts per source beats a raw 4624-rate \
threshold because a busy admin hits a few known jump hosts, not a broad sweep. \
Tune the threshold to your environment; scanners, vuln assessors, and admin \
tooling legitimately fan out and should be allowlisted by source address. \
Validate (purple): run nxc/crackmapexec with -H (pass-the-hash) across a subnet \
from dotfiles-Offense (hacktheplanet "Lateral movement & remote execution" fold; \
htpx pair pth-lateral-nxc). Requires Logon auditing (success) on the targets.
search = source="WinEventLog:Security" EventCode=4624 LogonType=3 NOT (IpAddress IN ("-", "127.0.0.1", "::1")) \
 \
| bin _time span=10m \
| stats dc(Computer) as value_count by _time IpAddress \
 \
| search value_count >= 5

[RDP session hijack - tscon redirect to an RDP endpoint]
description = Detects RDP session hijacking: a process creation carrying a \
"tscon ... /dest:rdp-tcp#" command line. The hijack cannot happen without it, so \
this is a near-zero-false-positive tell - admins almost never tscon to another \
session's RDP endpoint by hand, and the SYSTEM-via-service variant \
(sc create ... tscon) is even louder. \
Validate (purple): run the tscon/sc-create hijack from dotfiles-Offense (hacktheplanet \
"Lateral movement & remote execution" fold; htpx pair rdp-hijack-tscon).
search = CommandLine="*/dest:rdp-tcp#*"

[Suspicious service installed (psexec-style remote exec)]
description = Detects a new service install (7045) whose binary path is the psexec/remote-exec \
shape: a service whose "binary" is a shell or scripting interpreter, or one served \
straight off the admin share. psexec-class lateral movement (impacket-psexec, smbexec) \
leaves this even when the service name is randomized - detect on the binary path shape \
and allowlist your known services. \
Scoped to the interpreter/ADMIN$ shapes on purpose: a drop-directory match (\Users\, \
\Temp\) catches the same intrusions but also every third-party installer and updater \
that registers a service from a temp path, and a rule that fires on routine software \
installs gets muted. If you want drop-directory coverage, add it as a separate lower- \
confidence rule gated on a service-name or signed-binary allowlist. \
Validate (purple): run impacket-psexec from dotfiles-Offense (hacktheplanet "Lateral \
movement & remote execution" / "Active Directory" folds; pairs with pth-lateral-nxc).
search = source="WinEventLog:System" EventCode=7045 ImagePath IN ("*\\ADMIN$\\*", "*%COMSPEC%*", "*\\cmd.exe*", "*powershell.exe*", "*powershell -*", "*pwsh.exe*", "*cscript*", "*wscript*", "*rundll32*", "*mshta*")

[Unconstrained delegation abuse - DC machine account authenticating to a non-DC (4624)]
description = Detects the capture half of unconstrained-delegation abuse: a domain controller's \
MACHINE account completing a Kerberos network logon (4624 type 3) onto a host that \
is not itself a domain controller. \
The invariant is direction. A DC has no reason to authenticate OUT to an ordinary \
member server - DC-to-DC traffic is replication, and inbound auth to a DC is the \
normal shape. When DC01$ shows up as the TargetUserName on some other machine's \
4624, something MADE it authenticate: the attacker sets unconstrained delegation on \
a host they control (or stands up a machine account with it), then coerces the DC \
to it with PrinterBug/PetitPotam/DFSCoerce. Because the destination is trusted for \
unconstrained delegation, the DC's own TGT is forwarded and cached in that host's \
LSASS, where Rubeus monitor lifts it - and a DC TGT is the domain. \
This is the second half of a two-rule chain: coercion_named_pipes_5145 catches the \
trigger on the wire (the spoolss/efsrpc/lsarpc pipe touch), this catches the \
coerced logon landing. Either alone is triage; both within a minute is the attack. \
Kerberos is required in the selection because the TGT forwarding this steals is a \
Kerberos mechanism - an NTLM-authenticated coercion is the relay case, covered by \
siem/{splunk/correlation_searches.conf,sentinel/ntlm_relay_4624.yaml}. Drop the \
AuthenticationPackageName term if you want both shapes in one alert. \
The durable control is configuration, not detection: mark privileged accounts \
"sensitive and cannot be delegated", put them in Protected Users, and audit for \
unconstrained delegation on anything that is not a DC (TRUSTED_FOR_DELEGATION on \
userAccountControl). This catches it when that isn't in place. \
Validate (purple): coerce a DC to a delegation-enabled host and monitor for the TGT \
from dotfiles-Offense (hacktheplanet "Poisoning & relay" fold; PURPLE-TEAM \
unconstrained-deleg-4624 row). Requires Logon auditing (success) on member servers, \
which is where this event is written - not on the DC.
search = source="WinEventLog:Security" EventCode=4624 LogonType=3 AuthenticationPackageName="Kerberos" TargetUserName IN ("DC1$", "DC2$") NOT (Computer IN ("DC1*", "DC2*"))

[WMI remote exec - shell spawned by WmiPrvSE]
description = Detects WMI-based remote execution (impacket-wmiexec, nxc --exec-method wmiexec): \
the payload runs as a child of WmiPrvSE.exe with no service install (7045) to \
catch. A process creation whose parent is WmiPrvSE.exe spawning cmd/powershell is \
the signal - especially with impacket's "cmd.exe /Q /c ... 1> \\127.0.0.1\ADMIN$" \
output-redirect shape. Legit WMI providers spawn children too, so this pairs the \
parent-shell shape AND the SMB output-redirect string (impacket's canonical form) \
to keep the rule high-confidence. Redirect-less wmiexec variants (a custom \
--exec-method or a hand-rolled client that skips the ADMIN$ tee) fall to a \
separate, lower-confidence hunt on the WmiPrvSE-parent shape alone. \
Validate (purple): run impacket-wmiexec from dotfiles-Offense (hacktheplanet "Lateral \
movement & remote execution" fold; htpx pair wmiexec-impacket).
search = ParentImage="*\\WmiPrvSE.exe" Image IN ("*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe") CommandLine="*/Q*" CommandLine="*/c*" CommandLine="*127.0.0.1\\ADMIN$*"

### discovery (splunk_windows)

[Share / session enumeration sweep across hosts (net view fan-out, T1135)]
description = Detects Network Share Discovery (T1135) together with System Network Connections \
Discovery (T1049) and System Owner/User Discovery (T1033) in their operator form: ONE \
principal binding the srvsvc/wkssvc enumeration pipes on MANY DISTINCT hosts inside a \
short window. That is `net view \\host` walked across a host list, SharpHound's \
Session and LoggedOn collection, or any of the nxc/CrackMapExec enumeration modes - \
the sweep that turns "I have a credential" into a map of where to go next. \
This is deliberately the SECOND way the corpus sees these three techniques. The first \
is host_recon_command_burst, which matches `net view` / `net session` on the command \
line; an operator working over SMB from a foothold, or in-process via an RPC call, \
writes no process-creation event on the target at all. Detecting the same behaviour on \
two independent feeds is the resilience this change is about: before it, nine Discovery \
techniques shared one data source. \
Counting distinct Computer per principal is the invariant - breadth across hosts, not \
volume against one. Normal use re-touches a small set of file servers all day and stays \
at one or two distinct hosts; an enumeration pass touches each host once. \
Validate (purple): run the SMB enumeration fold from dotfiles-Offense (htpx pair \
smb-enum-nxc), or walk `net view \\host` across a host list. Requires the Detailed \
File Share audit subcategory (5145).
search = source="WinEventLog:Security" EventCode=5145 ShareName="*IPC$*" RelativeTargetName IN ("*srvsvc*", "*wkssvc*") NOT (SubjectUserName="*$" OR SubjectUserName IN ("svc_backup", "svc_monitoring")) \
 \
| bin _time span=10m \
| stats dc(Computer) as value_count by _time SubjectUserName \
 \
| search value_count >= 10

[Host discovery burst - many distinct recon commands on one host]
description = Detects one host running many DISTINCT built-in discovery commands in a short \
window - the situational-awareness burst an operator runs on arrival, and the \
invariant precursor to lateral movement. This is the cheapest high-value detection \
in the corpus: the data source (4688 / Sysmon 1) is already collected for the \
potato, wmiexec, and ransomware-precursor rules, and no post-exploitation workflow \
skips this step - a hands-on-keyboard attacker who has just landed does not know \
where they are. \
Counting DISTINCT command lines (not a raw execution rate) is the point: a login \
script firing the same `net use` a hundred times stays at one, while an operator \
walking `whoami /all` -> `net group "domain admins" /domain` -> `nltest /dclist:` -> \
`systeminfo` -> `netstat -ano` trips it in under a minute. Grouping by Computer \
rather than by account is deliberate - the actor field differs per channel \
(Security-4688 SubjectUserName vs Sysmon-1 User) and naming either would null the \
rule under the other channel's pipeline; the burst is a property of the host \
anyway. Tune the threshold to your build: imaging, patch, and inventory windows are \
the baseline that shifts it. \
Validate (purple): run the discovery fold from dotfiles-Offense (hacktheplanet \
"Situational awareness" / post-exploitation recon; the seatbelt/winPEAS and manual \
`whoami`/`net`/`nltest` sweeps). Requires the Process Creation audit subcategory \
(4688) or Sysmon EventID 1.
search = Image IN ("*\\whoami.exe", "*\\quser.exe", "*\\qwinsta.exe") OR Image IN ("*\\systeminfo.exe", "*\\hostname.exe") OR Image="*\\tasklist.exe" OR Image IN ("*\\ipconfig.exe", "*\\netstat.exe", "*\\arp.exe", "*\\route.exe", "*\\nbtstat.exe") OR Image IN ("*\\nltest.exe", "*\\dsquery.exe") OR (Image IN ("*\\net.exe", "*\\net1.exe") CommandLine IN ("* user*", "* group*", "* localgroup*", "* accounts*", "* share*", "* view*", "* session*", "* config*", "* start*")) OR (Image="*\\sc.exe" CommandLine IN ("*query*", "*qc *")) OR (Image="*\\wmic.exe" CommandLine IN ("*os get*", "*computersystem*", "*process get*", "*service *", "*qfe*", "*startup*")) \
 \
| bin _time span=10m \
| stats dc(CommandLine) as value_count by _time Computer \
 \
| search value_count >= 5

[LDAP / host recon by explicit-credential fan-out (4648)]
description = Detects one principal driving explicit-credential logons (4648) to many distinct \
targets in a short window - the alternate-credential recon fan-out (LDAP/account \
enumeration and host discovery run under a captured credential, e.g. runas + \
nxc/ldapsearch, or tooling that passes -u/-p per host). Counting distinct targets \
per subject beats a raw 4648-rate threshold because a legit admin touches a few \
known hosts, not a broad sweep. Tune the threshold to your admin workflow; jump \
hosts and orchestration accounts that legitimately fan out should be allowlisted. \
Validate (purple): run LDAP recon / host sweep under explicit creds from \
dotfiles-Offense (hacktheplanet recon fold; PURPLE-TEAM "LDAP recon by one principal" \
4648 row). Requires Logon auditing (success) with explicit-credential logging.
search = source="WinEventLog:Security" EventCode=4648 NOT (SubjectUserName="*$" OR TargetServerName IN ("-", "localhost")) \
 \
| bin _time span=10m \
| stats dc(TargetServerName) as value_count by _time SubjectUserName \
 \
| search value_count >= 15

[Local SAM enumeration sweep across hosts (SharpHound LocalGroup, T1069.001)]
description = Detects Permission Groups Discovery: Local Groups (T1069.001) and Local Account \
Discovery (T1087.001) in their operator form: ONE principal enumerating local group \
membership across MANY DISTINCT hosts in a short window. That is the "who is local \
admin where" sweep BloodHound runs to find the path to Domain Admin, and it is the \
same question `net localgroup administrators \\host` asks one host at a time. \
Counting distinct COMPUTER values rather than distinct targets is deliberate, for two \
reasons. First, correctness: on 4798 TargetUserName holds the enumerated USER, on 4799 \
it holds the enumerated GROUP, so a distinct-target count would mix users with groups \
and mean nothing - the same field-semantics trap that kept 4729/4733 out of \
account_access_removal_4725. Computer means the same thing on both events. Second, \
fidelity: the recognised complaint about 4799 is that it is noisy, but that noise is \
LOCAL - an agent or a logon checking the Administrators group on its own machine. Such \
a source can never exceed one distinct Computer, so the fan-out shape structurally \
immunises this rule against its own worst false-positive mode. What remains is \
centralised inventory, which is exactly what filter_sweep_principals is for. \
Tune the threshold to your estate: ten hosts in ten minutes is a sweep in a small \
domain and a rounding error in a large one. \
Validate (purple): run SharpHound with the LocalGroup collection method, or walk \
`net localgroup administrators \\host` across a host list, from dotfiles-Offense \
(hacktheplanet BloodHound / situational-awareness folds). Requires Audit User Account \
Management (4798) and Audit Security Group Management (4799).
search = source="WinEventLog:Security" EventCode IN (4798, 4799) NOT (SubjectUserName="*$" OR SubjectUserSid="S-1-5-18" OR SubjectUserName IN ("svc_inventory", "svc_scanner")) \
 \
| bin _time span=10m \
| stats dc(Computer) as value_count by _time SubjectUserName \
 \
| search value_count >= 10

[BloodHound / SharpHound directory enumeration sweep (4662)]
description = Detects one principal accessing many distinct directory objects in a short \
window - the SharpHound/BloodHound collection fingerprint. Counting distinct \
objects per principal beats a raw 4662-rate threshold because the sweep is a \
broad fan-out over users, groups, computers, and ACLs rather than repeated hits \
on one object. Tune the threshold to your directory size and audit SACL scope; \
a small directory or a broad SACL both shift the normal baseline. \
Validate (purple): run SharpHound / bloodhound-python from dotfiles-Offense \
(hacktheplanet "Active Directory enumeration" fold; htpx pair bloodhound-sharphound).
search = source="WinEventLog:Security" EventCode=4662 NOT (SubjectUserName="*$" OR SubjectUserSid="S-1-5-18") \
 \
| bin _time span=10m \
| stats dc(ObjectName) as value_count by _time SubjectUserName \
 \
| search value_count >= 100

### collection (splunk_windows)

[Collected data staged into an archive (T1560.001)]
description = Detects the packaging step between collection and exfiltration: a command-line \
archiver compressing data, either under a password or into a staging directory. \
The invariant is that bulk data leaves as a container, not as ten thousand \
individual reads. Exfiltration over almost any channel - HTTP PUT, a cloud sync \
client, a C2 upload, physical media - is preceded by "make it one file, make it \
small". That step runs a utility, and the utility takes arguments. \
Two shapes, both scoped to the archiver binaries so the argument matching stays \
meaningful: \
- PASSWORD. `rar a -hp<pass>` / `7z a -p<pass>` produces an encrypted archive. \
  Almost nothing on an endpoint legitimately does this unattended, and `-hp` also \
  encrypts the header so the file list can't be read - a defensive measure for the \
  attacker, not the user. This is the near-zero-FP half. \
- STAGING PATH. Archiving into Temp, Public, or ProgramData. Users archive to their \
  own Documents or Desktop; staging directories are chosen because they are \
  world-writable and unremarkable, which is exactly what makes them remarkable here. \
Detection posture: the password half is high-confidence on its own. The staging \
half is a triage surface - software packaging and installer builds do it - so \
filter_backup_tooling exists to suppress the ones your build/backup estate runs. \
This is the "stage" half of a pair: collection_mass_file_read_4663 catches the \
READ sweep that fills the directory, this catches the archive it is packed into. \
Either alone is worth a look; both on one host within a window is the collection \
chain, and if egress follows, exfiltration is already in progress. \
Generic `category: process_creation` so it matches both Security-4688 and Sysmon-1 \
(it names only Image and CommandLine, which both channels carry). \
Validate (purple): stage and archive a directory under a password from \
dotfiles-Offense (hacktheplanet collection/exfil fold; htpx pair archive-staging-rar). \
Requires the Process Creation audit subcategory (4688) or Sysmon EventID 1.
search = (Image IN ("*\\rar.exe", "*\\winrar.exe", "*\\7z.exe", "*\\7za.exe", "*\\7zg.exe") CommandLine IN ("* -hp*", "* -p*", "* -mhe*")) OR ((Image IN ("*\\rar.exe", "*\\winrar.exe", "*\\7z.exe", "*\\7za.exe", "*\\7zg.exe", "*\\tar.exe", "*\\makecab.exe") CommandLine IN ("*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*")) OR (Image IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine="*Compress-Archive*" CommandLine="*\\Temp\\*") NOT ParentImage="*\\backup-agent.exe")

[Mass file read - local data collection sweep (T1005)]
description = Detects Data from Local System (T1005): a single process reading many distinct files \
in a short window - the collection sweep that precedes staging and exfiltration. \
Counting DISTINCT ObjectName per process beats a read-rate threshold because the \
fingerprint is BREADTH across directories, not repeated reads of one file. A database \
or log writer hammers a handful of files; an operator walking a share touches hundreds \
of different ones exactly once each. \
Detection posture: this is the noisiest rule in the corpus and it is being shipped \
with that said out loud rather than discovered later. Reads are orders of magnitude \
more common than the writes its impact/ twin counts, so the threshold is higher (200 \
vs 100) AND the base event carries a suppression list. Treat filter_indexers as \
mandatory, not optional: unfilled, your nightly backup trips this, the rule gets \
muted, and a muted rule is a blind spot. Suppress the sweepers by ProcessName; do not \
raise the threshold until the payload fits under it. \
Grouped per host AND per process, not per process alone: ProcessName is a path and \
the same path exists fleet-wide, so grouping on it alone would pool one agent's reads \
across the estate and trip on aggregate activity no single host performed. (Same \
reasoning as the impact/ twin.) \
Pair with collection_archive_staging_utility: this catches the sweep that fills a \
staging directory, that catches the archive it gets packed into. Both on one host \
inside a window is collection in progress; if egress follows, so is exfiltration. \
Validate (purple): sweep a SACL'd share with a copy/collection script from \
dotfiles-Offense (hacktheplanet collection/exfil fold; htpx pair local-data-collection).
search = source="WinEventLog:Security" (EventCode=4663 ObjectType="File" AccessList="*%%4416*") OR (EventCode=4663 ObjectType="File" AccessMask="0x1") NOT (ProcessName IN ("*\\SearchIndexer.exe", "*\\MsMpEng.exe", "*\\backup-agent.exe")) \
 \
| bin _time span=5m \
| stats dc(ObjectName) as value_count by _time Computer ProcessName \
 \
| search value_count >= 200

### persistence (splunk_windows)

[Machine-account creation burst - MachineAccountQuota abuse (4741)]
description = Detects one principal creating many computer accounts (4741) in a short window - \
MachineAccountQuota abuse. A single attacker-controlled machine account is the \
precursor to RBCD (msDS-AllowedToActOnBehalfOfOtherIdentity, see \
rbcd_allowedtoact_5136) and noPac/sAMAccountName spoofing; a burst from a \
non-provisioning identity is the tell that a normal user is minting accounts they \
shouldn't. Counting distinct new accounts per creator over a window separates the \
abuse from steady provisioning; pair with the rbcd 5136 write for the full chain. \
Set MachineAccountQuota to 0 and delegate machine-account creation as the durable \
control - this catches it when that isn't in place. \
Validate (purple): run impacket-addcomputer (or the rbcd/noPac chain) from \
dotfiles-Offense (hacktheplanet "Active Directory - attack paths" fold; htpx pair \
rbcd-impacket). Requires the Computer Account Management audit subcategory.
search = source="WinEventLog:Security" EventCode=4741 \
 \
| bin _time span=30m \
| stats dc(TargetUserName) as value_count by _time SubjectUserName \
 \
| search value_count >= 3

[Rogue account creation (4720)]
description = Detects account-creation persistence: a 4720 user-account-created event. After \
gaining privilege, an operator often creates a fresh account (frequently paired \
with 4722, account-enabled, and a 4728/4732 privileged-group add) to hold access \
independent of the compromised credential. On a domain controller this is a domain \
account (T1136.002); on a member host it is a local account (T1136.001). Detect on \
the creation itself and baseline your provisioning path - where accounts are made \
by IAM/JML automation, allowlist that pipeline so operator-driven creations stand \
out. Correlate with the 4728/4732 group-add and the creator's SubjectUserName for \
triage: a new account created by an unexpected principal, then promoted, is the \
high-confidence shape. \
Validate (purple): run net user /add (or nxc -x "net user ...") from dotfiles-Offense \
(hacktheplanet "Persistence" fold; PURPLE-TEAM rogue-account row). Requires the \
Account Management > User Account Management audit subcategory.
search = source="WinEventLog:Security" EventCode=4720 NOT SubjectUserName="svc_iam_provisioning"

[Scheduled task created with a suspicious action]
description = Detects scheduled-task persistence: a 4698 task-created event whose task XML runs \
encoded/hidden PowerShell or a LOLBin (mshta/regsvr32/rundll32). Detect on the action, \
not the task name; 4702 catches the modify-an-existing-task variant. Baseline your \
software's legit tasks and alert on the rest. \
Scoped to the interpreter/LOLBin shapes on purpose: bare '\Users\' and '\Temp\' \
TaskContent matches were REMOVED for the same reason service_creation_psexec_7045 \
removed them from ImagePath - per-user updaters (Chrome, Edge, OneDrive, Teams) and \
third-party installers register tasks from those paths at volume, and a path match that \
common turns a high-severity rule into a mute button. If you want drop-directory \
coverage, add it as a separate lower-confidence rule gated on a task-name or \
signed-binary allowlist rather than folding it back into this OR. \
Validate (purple): run schtasks /create (or nxc -M schtask_as) from dotfiles-Offense \
(hacktheplanet "Persistence" fold; htpx pair schtask-persist). Requires the \
Object Access > Other Object Access Events audit subcategory.
search = source="WinEventLog:Security" EventCode=4698 TaskContent IN ("*-enc*", "*-EncodedCommand*", "*-w hidden*", "*-WindowStyle Hidden*", "*FromBase64String*", "*\\mshta.exe*", "*\\regsvr32.exe*", "*\\rundll32.exe*", "*DownloadString*", "*IEX*")

[WMI event subscription persistence - command-line or script consumer]
description = Detects fileless WMI event-subscription persistence: Sysmon 20 (WmiConsumer) \
registering a permanent consumer that runs PowerShell/cmd/a LOLBin or executes \
inline script. The subscription lives in the WMI repository, survives reboot, \
runs as SYSTEM, and touches no Run key or scheduled task - the Security log \
barely sees it, but Sysmon does. This keys on the consumer (event 20) because \
that is what carries the payload; the binding (event 21) and filter (event 19) \
carry no Destination, so treat any *new* binding as its own separate low-volume \
alert rather than folding it in here. \
Sysmon logs exactly two consumer classes, and event 20's Type discriminates \
them, so both are covered on their own terms: "Command Line" \
(CommandLineEventConsumer) by keyword on Destination, which is where its \
command line lands; "Script" (ActiveScriptEventConsumer) by class alone. \
Blind spot, stated rather than papered over: what Destination holds for a \
script consumer - the inline ScriptText body or a ScriptFileName path - is not \
confirmed against a captured event, so the script branch deliberately does not \
inspect it and fires on the registration itself. That is the safe direction to \
be wrong in; a keyword branch built on an unconfirmed field would look like \
coverage and silently be none. A capture would let the payload keywords apply \
to script bodies too, which is a refinement, not a fix. \
Two shape notes for whoever edits this next. Type is matched with contains \
rather than equality because "Command Line" cannot contain "Script", so there \
is no collision risk, and a rendering we have not seen verbatim still lands. \
EventID 20 is repeated in both selections rather than factored into a third \
one - factoring it out is the tidier rule and compiles to an UNGROUPED \
"EventID=20 A OR B" on the Splunk backend, which is correct only because \
Splunk's search command happens to evaluate OR before AND, and inverts if that \
query is ever moved into a where clause. Leave the repetition. \
Validate (purple): run "nxc -M wmi-event" / PowerLurk from dotfiles-Offense \
(hacktheplanet "Persistence" fold; htpx pair wmi-subscription) - PowerLurk's \
Register-MaliciousWmiEvent registers either class. Requires Sysmon with WMI \
eventing enabled (config schema >= 4.1).
search = (EventCode=20 Destination IN ("*powershell*", "*cmd.exe*", "*mshta*", "*wscript*", "*cscript*", "*rundll32*", "*-enc*", "*FromBase64String*")) OR (EventCode=20 Type="*Script*")

### defense_evasion (splunk_windows)

[DCShadow - rogue DC registration (GC SPN added to a non-DC)]
description = Detects DCShadow: to push changes as fake DC-to-DC replication, the attacker \
must briefly make the directory treat a non-DC as a DC, which adds a global- \
catalog SPN (GC/...) to a computer account (4742) and creates an nTDSDSA/server \
object (5137). The GC SPN write onto an account that isn't an established domain \
controller is the cleanest invariant. Corroborate with 5137 creating an \
nTDSDSA/server object and 4662 replication sourced from outside your DC inventory. \
Validate (purple): run mimikatz lsadump::dcshadow from dotfiles-Offense (hacktheplanet \
"Active Directory - attack paths" fold; htpx pair dcshadow). Allowlist your real \
DC computer accounts below.
search = source="WinEventLog:Security" EventCode=4742 ServicePrincipalNames="*GC/*" NOT (TargetUserName IN ("DC1$", "DC2$"))

### impact (splunk_windows)

[Account access removal burst - locking the defenders out (T1531)]
description = Detects Account Access Removal (T1531): one actor resetting, disabling, or deleting many \
DISTINCT accounts in a short window - the move that locks responders and administrators \
out of the estate while the rest of the impact plays out. It is a standard extortion and \
wiper precursor, and it sits alongside the ransomware fold this corpus already covers: \
service_stop_burst clears the locks, recovery_inhibition_process removes the rollback, \
the encryption rules catch the payload, and this catches the attempt to stop anyone \
responding to all three. \
Counting DISTINCT TargetUserName per actor is what separates it from help-desk work. A \
help-desk operator resets one account, or resets the same account twice while the user is \
on the phone; an actor locking out a response team walks a list of different accounts in \
one pass. Grouped by SubjectUserName because the invariant is about the ACTOR - an \
identity that does not normally administer identity suddenly doing so in bulk. \
Highest-value tuning is not the threshold, it is filter_identity_admins: fill it and this \
becomes near-zero-FP, because the accounts that legitimately do this in bulk are a short, \
knowable list. Best paired with a standing alert on ANY change to break-glass accounts, \
which no threshold should ever suppress. \
Validate (purple): run the defender lock-out fold from dotfiles-Offense (htpx pair \
account-lockout-defenders). Requires the Audit User Account Management subcategory.
search = source="WinEventLog:Security" EventCode IN (4724, 4725, 4726) NOT (SubjectUserName IN ("svc_jml", "helpdesk-admin")) \
 \
| bin _time span=10m \
| stats dc(TargetUserName) as value_count by _time SubjectUserName \
 \
| search value_count >= 4

[Data encrypted for impact - BitLocker driven from the command line]
description = Detects the one slice of Data Encrypted for Impact (T1486) that process-creation \
telemetry can actually see: an operator turning the machine's own full-disk \
encryptor against it. Rather than ship an encryptor and risk detection, the \
ShrinkLocker-style play enables BitLocker on the volumes, adds a protector whose \
key only the attacker holds (-recoverypassword / -password), and reboots - the host \
is ransomed with a signed Microsoft binary and no malicious file on disk. \
The invariant is the CHANNEL, not the tool: a managed BitLocker rollout is driven by \
MDM/GPO/the TPM provisioning path, not by an interactive manage-bde or an \
Enable-BitLocker line in a command line. Pair with recovery_inhibition_process \
(T1490) and service_stop_burst (T1489) - the three together on one host inside a \
window is the ransomware chain, not administration. \
Scope note (no data source, no detection): this does NOT cover the general T1486 \
case of a dropped encryptor rewriting files. That invariant is mass file \
modification, which needs Sysmon FileCreate/11 or EDR file telemetry - \
sysmon/sysmonconfig-detection-lab.xml does not enable it, so the honest coverage \
here is the BitLocker-abuse path only. Turning on 11 is the ingestion ticket. \
Generic `category: process_creation` so it matches both Security-4688 and Sysmon-1. \
Validate (purple): enable BitLocker with an attacker-held protector on a lab VM \
alongside the ransomware-precursor fold from dotfiles-Offense. Requires the Process \
Creation audit subcategory (4688) or Sysmon EventID 1.
search = (Image="*\\manage-bde.exe" CommandLine IN ("*-on*", "*-protectors -add*", "*-forcerecovery*")) OR (Image IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine IN ("*Enable-BitLocker*", "*Add-BitLockerKeyProtector*"))

[Data destruction - free-space wipe / secure delete / volume clean]
description = Detects Data Destruction (T1485): the built-in and Sysinternals primitives that make \
data unrecoverable rather than merely deleted - cipher /w (overwrite free space, \
which is how deleted-file recovery is defeated), sdelete (secure overwrite), \
fsutil file setZeroData (zero a file's contents in place), and diskpart clean \
(wipe the partition table). These are the destructive tail of the same kill chain \
recovery_inhibition_process (T1490) opens: T1490 removes the rollback, this removes \
the data, and where the operator wants a wiper rather than a ransom this is the \
whole objective. \
Detection posture: near-zero-FP on endpoints and servers. None of these run in \
normal operation - the legitimate users are decommissioning and disk-imaging \
workflows, which are scheduled, hosted, and easy to allowlist. One of these on a \
workstation is an incident. \
Generic `category: process_creation` so it matches both Security-4688 and Sysmon-1. \
Validate (purple): run the destruction commands alongside the ransomware-precursor \
fold from dotfiles-Offense (htpx pair inhibit-recovery-vssadmin). Requires the Process \
Creation audit subcategory (4688) or Sysmon EventID 1.
search = (Image="*\\cipher.exe" CommandLine="*/w*") OR Image IN ("*\\sdelete.exe", "*\\sdelete64.exe") OR (Image="*\\fsutil.exe" CommandLine="*setzerodata*") OR (Image="*\\diskpart.exe" CommandLine="*clean*")

[Mass file encryption - one process rewriting many files (4663)]
description = Detects the ransomware payload itself (T1486): a single process opening write/delete \
handles against many distinct files in a short window. This is the other half of the \
ransomware pair - recovery_inhibition_process catches the operator destroying the \
rollback path (T1490, the precursor), this catches the encryption that follows. Counting \
DISTINCT ObjectName per process beats a raw 4663-rate threshold because the payload's \
fingerprint is breadth (a sweep across directories) rather than repeated writes to one \
file, which is what a database or log writer looks like. \
Tune the threshold to your SACL scope and your baseline: a SACL on a single document \
share and one on every user profile have very different normal rates, and backup, \
indexing, AV-scan-and-quarantine, and sync agents are the processes that legitimately \
sweep files - identify them from your own data and suppress them by ProcessName rather \
than raising the threshold until the payload fits under it. \
This is the general T1486 case, on a data source that exists today: 4663 with a SACL, \
rather than the Sysmon 11 FileCreate the repo does not yet collect. It sits alongside \
bitlocker_abuse_encryption, which covers the narrower slice process creation can see \
(BitLocker driven from the command line). Pair both with T1490 recovery inhibition \
(recovery_inhibition_process) and the two T1489 service-stop rules: those inside one \
window are a ransomware event, not a noisy host. \
Validate (purple): run the file-encryption simulation from dotfiles-Offense (htpx pair \
ransomware-encrypt-files) against a SACL'd share.
search = source="WinEventLog:Security" (EventCode=4663 ObjectType="File" AccessList IN ("*%%4417*", "*%%4418*", "*%%1537*")) OR (EventCode=4663 ObjectType="File" AccessMask IN ("0x2", "0x4", "0x6", "0x10000")) \
 \
| bin _time span=5m \
| stats dc(ObjectName) as value_count by _time Computer ProcessName \
 \
| search value_count >= 100

[Mass file encryption - one process rewriting many files (Sysmon 11)]
description = Detects the ransomware payload itself (T1486) without depending on ACL configuration: \
a single process creating or overwriting many distinct files in a short window. \
Why this exists alongside mass_file_encryption_4663, which finds the same invariant: \
4663 is only emitted where a SACL is configured, so that rule's reach is exactly your \
SACL's scope - a share nobody put a SACL on is invisible to it. Sysmon 11 fires on \
every write regardless of ACLs, so this covers the directories the SACL never reached. \
It is the broader instrument; the 4663 twin is the one that works without touching \
Sysmon. Collect both if you can. \
Detection posture: the threshold is NOT the discriminator, and treating it as one is \
the way to tune this rule into uselessness. Compilers, installers, backup and sync \
agents, and AV scan-and-quarantine all legitimately write hundreds of files a minute, \
and an encryptor writes thousands - so raising the threshold until the build server \
goes quiet will eventually hide the payload too. Identify the sweepers in YOUR data and \
suppress them by Image; keep the threshold where a human never reaches it. \
Grouped per host AND per image, not per image alone: Image is a path, and the same path \
exists on every machine in the fleet - grouping on it alone would pool one agent's file \
counts across the estate and trip on aggregate activity no single host performed. (Same \
reasoning as the 4663 twin's Computer+ProcessName grouping.) \
Pair with T1490 recovery inhibition (recovery_inhibition_process), the two T1489 \
service-stop rules, and T1485 data destruction: those inside one window are a ransomware \
event, not a busy host. \
Validate (purple): run the file-encryption simulation from dotfiles-Offense (htpx pair \
ransomware-encrypt-files). Requires FileCreate (EventID 11) in the Sysmon config.
search = TargetFilename="*\\*" NOT (TargetFilename IN ("*\\AppData\\Local\\Microsoft\\Windows\\INetCache\\*", "*\\AppData\\Local\\Microsoft\\Windows\\WebCache\\*", "*\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\Cache\\*", "*\\AppData\\Local\\Mozilla\\Firefox\\Profiles\\*") OR TargetFilename IN ("C:\\Windows\\Prefetch\\*", "C:\\Windows\\SoftwareDistribution\\*", "C:\\Windows\\WinSxS\\*", "C:\\Windows\\Logs\\*") OR TargetFilename="*.etl") \
 \
| bin _time span=5m \
| stats dc(TargetFilename) as value_count by _time Computer Image \
 \
| search value_count >= 200

[Inhibit system recovery - shadow copy / backup / boot-recovery deletion]
description = Detects the ransomware kill-chain precursor Inhibit System Recovery (T1490): an \
operator destroying the means to roll back before or during encryption - vssadmin / \
wmic deleting shadow copies, wbadmin deleting the backup catalog, or bcdedit disabling \
Windows Recovery (recoveryenabled no / bootstatuspolicy ignoreallfailures). These run \
from almost nothing legitimate on endpoints and are near-zero-FP and high-fidelity; \
they are the natural inverse of ntds_dump_ntdsutil_vss_4688 (which keys on vssadmin \
*create* shadow). One of these on a workstation is an incident, not a maintenance task. \
First leg of the ransomware fold here. The rest: service_stop_burst and \
service_stop_protected_services clear the way (T1489 - the broad teardown and the \
named-protected-service stop respectively), mass_file_encryption_4663 and \
bitlocker_abuse_encryption are the payload (T1486 - the general 4663 case and the \
BitLocker-from-the-command-line case), and data_destruction_wipe is the no-ransom \
variant (T1485). Any two of those on one host inside a window is a ransomware event in \
progress, not two maintenance tasks. \
Validate (purple): run the recovery-inhibition commands from dotfiles-Offense (htpx pair \
inhibit-recovery-vssadmin).
search = (Image IN ("*\\vssadmin.exe", "*\\wmic.exe") CommandLine="*shadow*" CommandLine="*delete*") OR (Image="*\\wbadmin.exe" CommandLine="*delete*" CommandLine="*catalog*") OR (Image="*\\bcdedit.exe" CommandLine="*recoveryenabled*" CommandLine="*no*") OR (Image="*\\bcdedit.exe" CommandLine="*bootstatuspolicy*" CommandLine="*ignoreallfailures*")

[Mass service stop - the ransomware pre-encryption teardown (T1489)]
description = Detects one host stopping many distinct services in a short window - the teardown \
that precedes encryption. Ransomware cannot encrypt a file another process holds \
open, so before the encryptor runs it kills database engines, mail stores, backup \
agents, and the security tooling that would stop it. That produces a dense burst of \
stop commands from one host, which no maintenance workflow matches: patching stops \
a service, waits, restarts it - it does not tear down twenty in four minutes. \
This is the sibling of recovery_inhibition_process (T1490, shadow copy / backup \
catalog / boot recovery deletion): T1490 destroys the rollback, T1489 clears the \
way for the encryption itself. Seeing both on one host inside the same window is \
the ransomware kill chain in progress, not two maintenance tasks - alert-chain them \
if your backend supports it. \
Counting DISTINCT command lines makes a retry loop against one stubborn service \
count once, while a walk through many services trips it. Tune to your build: patch \
windows and application-deployment hosts are the baseline that shifts it. \
Validate (purple): run the ransomware-precursor fold from dotfiles-Offense alongside \
the recovery-inhibition commands (htpx pair inhibit-recovery-vssadmin). Requires the \
Process Creation audit subcategory (4688) or Sysmon EventID 1.
search = (Image IN ("*\\net.exe", "*\\net1.exe") CommandLine="* stop*") OR (Image="*\\sc.exe" CommandLine IN ("* stop*", "*start= disabled*", "*start=disabled*")) OR (Image="*\\taskkill.exe" CommandLine="*/f *") OR (Image IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine IN ("*Stop-Service*", "*Stop-Process*")) \
 \
| bin _time span=5m \
| stats dc(CommandLine) as value_count by _time Computer \
 \
| search value_count >= 5

[Protected service stopped - backup / AV / database teardown (T1489)]
description = Detects a command-line stop or disable of a service that protects data (T1489): the \
database and mail engines that hold the files open, the backup agents that would let you \
roll back, and the AV/EDR that would kill the payload. Ransomware families ship this as a \
hard-coded net stop / sc stop list run seconds before the encryption sweep. \
Paired with service_stop_burst, not a duplicate of it. The two rules discriminate on \
different axes and each catches what the other misses: \
  - service_stop_burst counts VOLUME AND VARIETY - five distinct stop commands on one \
    host in five minutes - and knows nothing about which services. It catches the broad \
    teardown, and misses a surgical single stop. \
  - this rule knows the NAMES that matter and fires on ONE of them. It catches \
    `net stop VeeamBackupSvc` on its own, and misses a walk through twenty services \
    whose names aren't in the list. \
Run both: the burst is the general case, this is the high-confidence single event. Both \
sit in the ransomware fold alongside recovery_inhibition_process (T1490, destroys the \
rollback), mass_file_encryption_4663 and bitlocker_abuse_encryption (T1486, the payload), \
and data_destruction_wipe (T1485). Any two of those on one host inside a window is a \
ransomware event in progress. \
On process creation rather than the Service Control Manager's own 7036 "entered the \
stopped state" transition: a Sigma rule carries one logsource, and 4688/Sysmon-1 is \
already collected here while 7036 needs the System channel plus a much wider name list to \
be useful. Use 7036 as the corroborating signal in triage - the process-creation event \
names the operator and the parent, the 7036 pair proves the services actually went down. \
The keyword list is the scoping: it is the difference between "someone stopped a service" \
(constant) and "someone stopped the things that protect the data" (an incident). Extend \
it with your own backup/AV/line-of-business service names. \
Validate (purple): run the pre-ransom service-stop batch from dotfiles-Offense (htpx pair \
service-stop-preransom).
search = (Image IN ("*\\net.exe", "*\\net1.exe", "*\\sc.exe") CommandLine IN ("* stop *", "*start= disabled*", "*start=disabled*")) OR (Image IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine IN ("*Stop-Service*", "*Set-Service*")) CommandLine IN ("*sql*", "*msexchange*", "*veeam*", "*backup*", "*acronis*", "*memtas*", "*mepocs*", "*sophos*", "*sentinel*", "*defend*", "*vss*", "*sqlwriter*", "*postgres*", "*oracle*")

### linux (--without-pipeline)

[Kerberos ccache file staged by a copy/transfer/interpreter process]
description = Detects the T1558.005 (Ccache Files) theft invariant on Linux: a Kerberos \
credential-cache file handled by a copy/archive/transfer/encode/interpreter \
process. On Linux a TGT lives on disk as a ccache - the default MIT path is \
/tmp/krb5cc_<uid> (or a named *.ccache when KRB5CCNAME points at one). Legitimate \
Kerberos consumers (kinit, sssd, sshd, the owning app) reach the ccache through \
libkrb5 using the default/KRB5CCNAME location - they do NOT name the path on a \
command line. So a ccache path appearing in the argv of cp/tar/base64/scp/curl/ \
python is the tell: someone is collecting the ticket off disk to replay it \
(Pass-the-Ticket, T1550.003) as the user without their password. This keys on the \
handling process, not a tool name, so it fires on hand-rolled exfil the same as on \
tooling. It is the first-class *nix half of the Kerberos-forgery coverage whose \
Windows/AD side lives in the credential_access Sigma rules and the Golden/Silver \
absence searches - the forged tickets in dotfiles-Offense's golden-ticket / silver- \
ticket flows are written to and used from an Administrator.ccache, which is exactly \
what this catches when it is copied or exfiltrated. \
Complementary hardening (not this rule): enable an auditd file watch on the ccache \
directory (e.g. -w /tmp -p r -k ccache) to also see plain reads, and alert on \
KRB5CCNAME / /etc/krb5.conf tampering. \
Validate (purple): after minting a ticket to Administrator.ccache in the \
hacktheplanet "Microsoft Windows Kerberos" fold, run `cp Administrator.ccache /tmp/x` \
or `base64 Administrator.ccache` from dotfiles-Offense and confirm this fires.
search = CommandLine IN ("*/tmp/krb5cc_*", "*.ccache*", "*krb5.ccache*") Image IN ("*/cp", "*/mv", "*/dd", "*/cat", "*/tac", "*/tar", "*/gzip", "*/bzip2", "*/xz", "*/zip", "*/base64", "*/xxd", "*/scp", "*/rsync", "*/sftp", "*/nc", "*/ncat", "*/socat", "*/curl", "*/wget", "*/openssl", "*/python", "*/python3", "*/perl", "*/ruby")

### cloud (--without-pipeline)

[AWS cloud data destruction burst (control-plane wiper, T1485)]
description = Detects Data Destruction (T1485) on the AWS control plane: one principal issuing a burst \
of delete calls across storage and backup services in a short window - snapshots, buckets, \
objects, and tables going away together. This is the cloud-native form of the extortion \
or wiper endgame, and the counterpart to the on-prem impact/data_destruction_wipe rule \
(cipher /w, sdelete, diskpart clean) which only ever sees an endpoint. Before this rule \
the corpus had no control-plane destruction coverage at all: T1485 was Windows-only. \
Volume is the invariant, not the verb. A single delete is housekeeping and a retention \
policy trims snapshots every night; what no maintenance workflow produces is a dense \
run of deletes from one identity inside five minutes. Deleting the backups is also the \
step that turns a ransomware incident into an unrecoverable one, so this is worth pairing \
with cloud/aws_iam_privesc_policy - privilege escalation followed by a destruction burst \
from the same principal is the whole chain. \
Two triage signals the correlation cannot express but the backend can: VARIETY (distinct \
eventName values - housekeeping deletes one kind of thing, a rampage deletes snapshots \
AND buckets AND tables) and ERRORS (an errorCode mix as the principal probes what it is \
allowed to destroy). Weight both when the alert lands. \
Structural defence beats detection here: S3 Object Lock, MFA-delete, and cross-account \
backup copies the compromised principal cannot reach. \
Validate (purple): run the snapshot/bucket destruction fold from dotfiles-Offense (htpx pair \
cloud-snapshot-destroy).
search = eventSource IN ("ec2.amazonaws.com", "rds.amazonaws.com", "s3.amazonaws.com", "dynamodb.amazonaws.com", "elasticache.amazonaws.com", "fsx.amazonaws.com") eventName IN ("DeleteSnapshot", "DeleteDBClusterSnapshot", "DeleteDBSnapshot", "DeleteBucket", "DeleteObject", "DeleteObjects", "DeleteTable") NOT userIdentity.arn="arn:aws:sts::111122223333:assumed-role/terraform-apply/*" \
 \
| bin _time span=5m \
| stats count as event_count by _time userIdentity.arn \
 \
| search event_count >= 10

[AWS IAM access key created (backdoor triage)]
description = Surfaces CloudTrail CreateAccessKey for IAM access-key-backdoor triage. The abuse \
invariant is actor != target (a principal minting a key for another, usually more \
privileged, user) - but that field-to-field comparison isn't expressible in Sigma, \
so this matches the event and leaves the actor-vs-target call to the analyst / \
backend. Compare userIdentity (actor) to requestParameters.userName (target); \
alert when they differ or the target is privileged. \
Validate (purple): run "aws iam create-access-key --user-name <other>" / Pacu \
iam__backdoor_users_keys from dotfiles-Offense (htpx pair aws-iam-backdoor-key).
search = eventSource="iam.amazonaws.com" eventName="CreateAccessKey"

[AWS IAM privilege escalation via policy attach/put (CloudTrail)]
description = Detects the classic AWS IAM privilege-escalation primitive: granting a controlled \
principal more permission than it had, by attaching a managed policy, inlining a \
policy document, publishing a new default version of a customer-managed policy, or \
dropping the principal into a privileged group (T1098.003). This is the step that turns \
a limited foothold into an administrative one, and it is the gap between the two \
credential-minting rules already here - aws_iam_access_key_created (the key) and \
aws_login_profile_created (the console password) both give the attacker a way IN; this \
is how they make that way WORTH having. \
CreatePolicyVersion/SetDefaultPolicyVersion are the quiet ones: no policy is attached \
to anything, so an attach-only detection misses them entirely - the attacker edits a \
policy the target already holds. Triage on the granted policy (AdministratorAccess, \
iam:*, PassRole, or any wildcard action/resource), on the target principal, and on \
actor != target, the same actor-vs-target call the sibling IAM rules leave to the \
analyst. \
Validate (purple): run the Pacu iam__privesc_scan policy-attach path from dotfiles-Offense \
(htpx pair aws-iam-privesc-policy).
search = eventSource="iam.amazonaws.com" eventName IN ("AttachUserPolicy", "AttachRolePolicy", "AttachGroupPolicy", "PutUserPolicy", "PutRolePolicy", "PutGroupPolicy", "CreatePolicyVersion", "SetDefaultPolicyVersion", "AddUserToGroup") NOT userIdentity.arn="arn:aws:sts::111122223333:assumed-role/terraform-apply/*"

[AWS IAM login profile created or updated (console takeover)]
description = Detects CloudTrail CreateLoginProfile / UpdateLoginProfile - giving a \
programmatic-only IAM user a console password, or resetting another user's, is \
account takeover. A login profile is normally set once at user creation by an \
admin, and users reset only their own, so CreateLoginProfile on an existing user \
or UpdateLoginProfile where actor != target is the tell. Pairs with the \
CreateAccessKey alert for the full console+API takeover. \
Validate (purple): run "aws iam create-login-profile --user-name <other>" from \
dotfiles-Offense (htpx pair aws-console-login-profile).
search = eventSource="iam.amazonaws.com" eventName IN ("CreateLoginProfile", "UpdateLoginProfile")

[AWS S3 bulk object read (cloud-storage collection sweep, T1530)]
description = Detects Data from Cloud Storage (T1530): one principal reading many DISTINCT object keys \
from S3 in a short window - the bucket sweep that follows a leaked access key or an \
over-permissive role, and the cloud twin of the on-prem T1005 read sweep in \
collection/mass_file_read_4663. \
Counting distinct object keys beats a raw read-rate threshold because the fingerprint is \
BREADTH across the keyspace, not repeated reads of one object. A healthy application \
re-reads a small working set all day; an operator draining a bucket touches hundreds of \
different keys exactly once each. Usually preceded by a ListObjects/ListBucket sweep - \
worth chaining if your backend supports it. \
Grouped by userIdentity.arn ALONE, unlike the on-prem twin's Computer+ProcessName pair. \
An ARN is already globally unique, so there is nothing to disambiguate; and adding \
sourceIPAddress to the group-by would let an operator rotating through IPs or NAT egress \
split one sweep into several sub-threshold buckets. Treat the source IP as triage \
context, not as part of the key. \
Blind spot, stated rather than papered over: CopyObject is deliberately NOT in the base \
selection. A server-side copy into an attacker-owned bucket is recorded as a data event \
against the DESTINATION bucket, which is outside this account's trail - so a CopyObject \
branch here could never fire on the exfil path it appears to cover, and shipping one \
would claim coverage that does not exist. That path is caught on the source bucket's S3 \
server access logs (which record the read) and by the GetObject volume signal above. \
Tune the threshold to your largest legitimate consumer before paging on it. \
Validate (purple): drain a bucket with an assumed role from dotfiles-Offense (htpx pair \
aws-s3-mass-exfil).
search = eventSource="s3.amazonaws.com" eventName="GetObject" NOT userIdentity.arn="arn:aws:sts::111122223333:assumed-role/backup-replication/*" \
 \
| bin _time span=5m \
| stats dc(requestParameters.key) as value_count by _time userIdentity.arn \
 \
| search value_count >= 100

[Entra directory role assigned (tenant privilege escalation)]
description = Detects a directory-role assignment in the Entra ID audit log - "Add member to role" \
and its eligible/PIM-activation variants. After a tenant foothold the attacker grants \
their own account (or a service principal they control) a privileged directory role - \
Global Administrator, Privileged Role Administrator, Application Administrator - which \
is durable, tenant-wide, and survives the victim's password reset (T1098.003). It is \
the Entra twin of gws_admin_role_grant, and the missing third leg of the Entra set \
here: entra_illicit_consent_grant covers the app-consent path and \
entra_sp_credential_backdoor the service-principal credential path, but neither sees a \
plain role grant. \
Role grants are rare and reconcilable, so triage on the role and the actor: which role \
was granted (the tenant-admin roles above are the ones that matter), whether the actor \
normally administers roles, and whether the grant follows a new-user or new-service- \
principal creation. Application Administrator and Privileged Authentication Administrator \
are the quiet escalation paths - they aren't Global Admin but they reach it. \
Validate (purple): assign a directory role via Graph from dotfiles-Offense (htpx pair \
entra-directory-role).
search = OperationName IN ("Add member to role", "Add eligible member to role", "Add member to role in PIM requested (permanent)", "Add member to role completed (PIM activation)", "Add member to role requested (PIM activation)")

[Entra consent grant to a third-party app (illicit-consent triage)]
description = Detects an OAuth consent grant in Entra ID that hands a third-party app a high-value \
scope: a "Consent to application" / delegated-permission-grant audit event whose granted \
scopes include mail/file/directory reads (Mail.Read, offline_access, Files.Read.All, \
Directory.Read.All, ...). Scoping to the high-risk scope set is what separates this from \
the earlier bare "any consent" form - most consent is benign app onboarding, and firing \
on all of it is a mute-me alert; the abuse is the refresh token to a user's mail/files \
with no password and no MFA on reuse, surviving password resets. A sanctioned LOB app \
can legitimately hold these scopes, so allowlist its app ID in filter_known_apps \
(deploy-time); triage the rest by app, scope, and whether the app is newly registered/ \
unverified. Restricting user consent to verified publishers turns this into prevention. \
Validate (purple): run an illicit-consent grant from dotfiles-Offense (htpx pair \
consent-grant; companion-only, M365/Entra section).
search = OperationName IN ("Consent to application", "Add delegated permission grant", "Add OAuth2PermissionGrant") TargetResources IN ("*Mail.Read*", "*Mail.ReadWrite*", "*Mail.Send*", "*offline_access*", "*Files.Read.All*", "*Files.ReadWrite.All*", "*Sites.Read.All*", "*Directory.Read.All*", "*full_access_as_user*") NOT TargetResources="*00000000-0000-0000-0000-000000000000*"

[Entra service-principal credential added (app backdoor)]
description = Detects a credential (client secret or certificate) being added to an Entra app \
registration / service principal - the durable cloud backdoor: the attacker then \
authenticates as the app, non-interactive, no MFA, surviving user password resets. \
The credential-add audit event is the invariant; triage by who did it, which \
(privileged) app it targets, and whether it lines up with a normal app-lifecycle \
change. A credential added to a high-privilege app by an unexpected actor is the \
tell. \
Validate (purple): run "az ad app credential reset" / Add-MgApplicationPassword \
from dotfiles-Offense (htpx pair sp-cred-backdoor; companion-only, M365/Entra section).
search = OperationName IN ("Add service principal credentials", "Add application credentials", "Update application - Certificates and secrets management", "Update application – Certificates and secrets management")

[GCP logging sink deleted / disabled (audit-log tampering)]
description = Detects an attacker blinding GCP logging: deleting or updating a Cloud Logging sink \
(google.logging.v2.ConfigServiceV2.DeleteSink / UpdateSink) or deleting a log bucket \
(DeleteBucket). Killing the export/sink path is the cloud equivalent of clearing the \
event log - it defeats every other cloud detection downstream, so it is the highest- \
value logging-tamper signal (T1562.008). Sink lifecycle changes are rare and should \
come from IaC; a delete/update from an interactive principal is the anomaly. Alert and \
corroborate with the sink/bucket name and the caller. \
Validate (purple): delete a logging sink from dotfiles-Offense (htpx pair \
gcp-audit-log-disable).
search = gcp.audit.method_name IN ("*ConfigServiceV2.DeleteSink", "*ConfigServiceV2.UpdateSink", "*ConfigServiceV2.DeleteBucket") NOT gcp.audit.principal_email="logging-terraform@example.iam.gserviceaccount.com"

[GCP IAM policy binding added (SetIamPolicy backdoor)]
description = Detects a SetIamPolicy call in GCP Cloud Audit Logs - the primitive behind IAM \
persistence/backdoors (T1098): granting a controlled principal a role on a project, \
service account, or resource (add a binding, or the notorious allUsers/allAuthenticated \
or actAs / roles.owner grant). SetIamPolicy is how an attacker keeps access after the \
initial foothold. It also fires for legitimate IaC, so allowlist the automation \
principals and triage the rest by the granted role and the added member - a binding to \
a personal account, an external domain, or a public principal is the tell. \
Validate (purple): add an IAM binding from dotfiles-Offense (htpx pair \
gcp-iam-policy-backdoor).
search = gcp.audit.method_name="*.SetIamPolicy" NOT gcp.audit.principal_email="iam-terraform@example.iam.gserviceaccount.com"

[GCP user-managed service-account key created]
description = Detects creation of a user-managed service-account key \
(google.iam.admin.v1.CreateServiceAccountKey) in GCP Cloud Audit Logs. These keys \
are long-lived credentials outside SSO/MFA and are the classic GCP persistence \
backdoor - Google recommends disabling them. Alert on creation for privileged \
service accounts, by unexpected actors, or anywhere org policy forbids user-managed \
keys; the org-policy constraint iam.disableServiceAccountKeyCreation is the \
preventive control. \
Validate (purple): run "gcloud iam service-accounts keys create" from dotfiles-Offense \
(htpx pair gcp-sa-key).
search = gcp.audit.method_name="google.iam.admin.v1.CreateServiceAccountKey"

### kubernetes (--without-pipeline)

[Kubernetes cluster-admin role binding created or modified]
description = Detects a (cluster)rolebinding that grants the built-in cluster-admin role - the \
most direct Kubernetes privilege-escalation / persistence move: bind a user, group, \
or (compromised) service account to cluster-admin and you own the cluster, durably. \
The roleRef to cluster-admin is the invariant. The rule covers create, update, and \
patch, so the title says "created or modified". Almost nothing should mint or edit \
cluster-admin bindings outside controlled platform automation. \
Requires the kube-apiserver audit policy to log requestObject (Request or \
RequestResponse level) - roleRef.name lives in the request body, so at Metadata \
level this rule will not match even though audit events exist. \
Validate (purple): run "kubectl create clusterrolebinding ... --clusterrole= \
cluster-admin --serviceaccount=default:default" from dotfiles-Offense (htpx pair \
k8s-clusteradmin-binding).
search = verb IN ("create", "update", "patch") objectRef.resource IN ("clusterrolebindings", "rolebindings") requestObject.roleRef.name="cluster-admin"

[Kubernetes pod exec / attach]
description = Detects interactive access into a running pod: a create against the pods/exec or \
pods/attach subresource (kubectl exec / attach). This is the container-runtime \
equivalent of an interactive shell on a host - routine in dev, but in production it \
is the tell for hands-on-keyboard activity, debugging-as-a-foothold, or post- \
compromise lateral movement. Scope to production namespaces and alert on \
exec/attach by human users (not controllers/service accounts). \
Validate (purple): run "kubectl exec -it <pod> -- sh" from dotfiles-Offense (htpx pair \
k8s-exec). Requires the kube-apiserver audit policy logging the exec subresource.
search = verb="create" objectRef.resource="pods" objectRef.subresource IN ("exec", "attach") NOT user.username="system:serviceaccount:*"

[Kubernetes privileged / host-namespace pod created (node escape)]
description = Detects creation of a pod that can escape to the node: a privileged container, \
host PID namespace sharing, or a hostPath mount of the root filesystem. These are \
the building blocks of the classic "privileged pod -> nsenter into PID 1" container \
breakout (the three the detection below actually matches). Almost nothing in a \
hardened cluster legitimately requests privileged/hostPID; gate them with admission \
control (PSA restricted) and alert on the rest. \
Validate (purple): run the privileged-pod/nsenter breakout from dotfiles-Offense \
(htpx pair k8s-privileged-pod). Requires the kube-apiserver audit policy logging \
pod create at RequestResponse level (so requestObject is present). \
 \
DEPLOY-REQUIRED: array traversal. Two of the three escape branches key into JSON \
ARRAYS: `spec.containers` is []Container and `spec.volumes` is []Volume in the \
kube-apiserver audit requestObject. Sigma has no portable array-index syntax, so the \
dotted paths below rely on the BACKEND expanding arrays, and backends differ: \
  - Elasticsearch/OpenSearch: object fields are flattened by default, so \
    `requestObject.spec.containers.securityContext.privileged` matches. Works as shipped \
    UNLESS the index maps these as `nested`, which requires a nested query instead. \
  - Sentinel/KQL: the generated form is `['requestObject.spec.containers...'] == true`, \
    a LITERAL dotted column name. It does not walk the array, so the privileged and \
    hostPath branches will NOT fire without a pipeline that expands them first \
    (`mv-expand` the container/volume arrays, or project the fields out at ingest). \
Confirm on your backend before trusting this rule. `escape_hostpid` keys on \
`requestObject.spec.hostPID`, a genuine scalar, and is unaffected — so the rule can appear to work \
while the two branches it is named for are silently dead.
search = verb="create" objectRef.resource="pods" requestObject.spec.containers.securityContext.privileged=true OR requestObject.spec.hostPID=true OR requestObject.spec.volumes.hostPath.path="/"

### okta (--without-pipeline)

[Okta API token created (programmatic persistence)]
description = Detects creation of an Okta API token (System Log event system.api_token.create). \
An API token is long-lived, carries the creator's privileges, and is used \
non-interactively - so it bypasses MFA and survives the creator's password/session \
reset: a clean tenant-persistence backdoor after an admin compromise. API tokens \
should come from a small, known set of service integrations; one minted by an \
unexpected actor (especially a human admin during an incident) is the tell. \
Validate (purple): mint an API token from dotfiles-Offense (htpx pair okta-api-token).
search = eventType="system.api_token.create"

[Okta identity provider created or activated (federation backdoor)]
description = Detects a new inbound identity provider being added/activated in Okta \
(system.idp.lifecycle.create / .activate). Adding an attacker-controlled IdP lets \
them federate in as arbitrary users — an authentication backdoor that sidesteps \
passwords and MFA, the technique behind several high-profile Okta tenant \
compromises. IdP changes are rare and high-impact, so any create/activate by an \
unexpected actor warrants immediate review; pair with the source-anomaly profile. \
Validate (purple): add a rogue IdP via the admin API from dotfiles-Offense (htpx pair \
okta-idp-backdoor).
search = eventType IN ("system.idp.lifecycle.create", "system.idp.lifecycle.activate")

[Okta MFA factor reset or deactivated (account-takeover prep)]
description = Detects MFA factors being reset or deactivated on an Okta user - the \
Scattered-Spider / help-desk-social-engineering move: clear a victim's factors so \
the attacker can enroll their own and own the account. The Okta System Log event \
(user.mfa.factor.reset_all / *.deactivate) is the invariant. Routine during real \
help-desk resets, so the signal is correlation: a reset NOT preceded by a verified \
support ticket, or one immediately followed by a new-factor enrollment + sign-in \
from a new device/geo. \
Validate (purple): run the reset_factors admin-API call from dotfiles-Offense (htpx \
pair okta-mfa-reset).
search = eventType IN ("user.mfa.factor.reset_all", "user.mfa.factor.deactivate", "system.mfa.factor.deactivate")

### github (--without-pipeline)

[GitHub branch-protection tampered (unreviewed merge)]
description = Detects branch-protection tampering in the GitHub Enterprise audit log: \
protected_branch.destroy (the rule was deleted, opening the branch) or \
protected_branch.policy_override (an admin merged past a still-present rule). Both \
bypass required reviews/status checks to land unreviewed code on a protected branch \
- and the pipeline that deploys it - a supply-chain evasion. Both actions are rare \
and legitimately map to a change ticket, so a destroy quickly followed by a \
re-create (cover-tracks) or any override outside the approved window warrants review. \
Validate (purple): delete/override branch protection from dotfiles-Offense (htpx pair \
gh-branch-protection-off).
search = action IN ("protected_branch.destroy", "protected_branch.policy_override")

[GitHub deploy-key or PAT credential backdoor]
description = Detects durable-credential additions in the GitHub Enterprise audit log: \
repo.create_deploy_key (an SSH key bound to a repo - prioritize writable keys) or \
personal_access_token.access_granted (a fine-grained PAT approved against org \
resources). Both mint MFA-free, non-interactive access that survives a password \
reset, so an unexpected actor or an out-of-band grant is the tell. Reconcile new \
credentials against known CI integrations and review any created during an incident. \
Validate (purple): add a deploy key / fine-grained PAT from dotfiles-Offense (htpx pair \
gh-deploy-key-backdoor).
