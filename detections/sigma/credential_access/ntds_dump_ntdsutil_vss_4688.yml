title: NTDS.dit theft via ntdsutil / VSS on a domain controller
id: 3e5d07b8-2e1b-4145-9f6a-ee29d7cd470f
status: test
description: |
  Detects local NTDS.dit extraction on a DC, which sidesteps the DCSync 4662
  replication detection entirely: ntdsutil with an ifm/create-full argument, or
  vssadmin/diskshadow/wbadmin creating a shadow copy to copy NTDS.dit + the SYSTEM
  hive out. Almost nothing legitimately runs "ntdsutil ... ifm" outside a planned
  DC backup/migration. Corroborate with event 8222 (shadow copy created).
  Validate (purple): run the ntdsutil/VSS dump from dotfiles-Offense (hacktheplanet
  "DCSync / NTDS dump" fold; htpx pair ntds-ntdsutil). Scope to DC hosts.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/ntds-ntdsutil-4688.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-23
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_ntdsutil:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains:
      - 'ifm'
      - 'create full'
  selection_shadow:
    # Verbs only: the Image already names the binary, so repeating it inside the
    # CommandLine token ('vssadmin create shadow') only added a way to miss - a full path
    # or a .exe suffix on argv[0] broke the match. Each verb belongs to one binary, so the
    # cross-product the two lists form is harmless.
    CommandLine|contains:
      - 'create shadow'
      - 'start backup'
    Image|endswith:
      - '\vssadmin.exe'
      - '\wbadmin.exe'
  selection_diskshadow:
    # Deliberately the binary alone, unlike its siblings. diskshadow is driven by a script
    # (`diskshadow /s x.dsh`) and the `set context persistent` / `add volume` / `expose`
    # commands that stage NTDS.dit live in the .dsh, not on the command line, so a verb
    # gate here would miss the real attack and catch only the interactive form. The bar is
    # the same one the `ifm` branch justifies: diskshadow is a backup-admin tool with no
    # routine use on a DC, so any run there is worth a look. Scope to DC hosts.
    Image|endswith: '\diskshadow.exe'
  condition: 1 of selection_*
falsepositives:
  - Scheduled DC backup software (allowlist its binary path and account).
level: high
