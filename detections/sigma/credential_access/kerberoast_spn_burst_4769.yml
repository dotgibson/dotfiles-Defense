title: Kerberoasting base - service ticket for a user SPN (4769, any etype)
id: 413b4d51-f6c6-493b-85d5-202d5adea99d
status: experimental
description: |
  Base event for the Kerberoasting burst correlation below: a successful 4769 service
  ticket for an SPN held by a user account (not a machine `$`, not krbtgt), in ANY
  encryption type. Not actionable alone - users request tickets for SQL, web and file
  services all day. The roasting shape is one client asking for many distinct user SPNs
  in a short window, expressed by the correlation.
references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/kerberoasting-4769.md
author: dotfiles-Defense
date: 2026-09-28
name: kerberoast_tgs_user_spn_4769
tags:
  - attack.credential-access
  - attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    Status: '0x0'
  filter_machine:
    ServiceName|endswith: '$'
  filter_krbtgt:
    ServiceName: 'krbtgt'
  condition: selection and not 1 of filter_*
falsepositives:
  - Every ordinary service-ticket request for a user-held SPN (defeated by the
    distinct-SPN count below).
level: informational
