title: AD CS ESC8 end state - DC machine account TGT by certificate (PKINIT) from a non-DC address (4768)
id: 10a4cab4-fec8-477b-94ca-ed474dc470c7
status: experimental
description: |
  Detects a Kerberos TGT request (4768) for a DOMAIN CONTROLLER'S machine account where the
  pre-authentication was a certificate (PreAuthType 16, PA-PK-AS-REQ / PKINIT) and the
  requesting client address is not one of the domain controllers.
  The invariant: a DC's own account should only ever obtain a TGT from a DC address. A DC
  requests its machine TGT from itself (or a peer DC) over password pre-auth; it has no
  reason to PKINIT at all, and none to do so from a member server or workstation. When
  DC01$ gets a TGT with a certificate from 10.0.0.50, something presented a certificate
  issued to DC01$ from a host that is not DC01 - which is the end state of ESC8: coerce
  the DC (PetitPotam/PrinterBug/DFSCoerce), relay its NTLM authentication to the CA's web
  enrollment endpoint, enroll a certificate as DC01$, then authenticate with it (certipy
  auth / Rubeus asktgt /certificate) and DCSync as the DC. It is also the logon side of a
  shadow-credentials or ESC1 forgery whose SAN names a DC.
  This is the rule the 4662 pair cannot be. dcsync_replication_4662 drops every $ subject,
  dcsync_non_dc_machine_account_4662 allowlists the real DCs, and 4662 carries no source
  address, so DCSync as DC01$ from an attacker host reads there as ordinary replication.
  4768 is where the requesting address exists, so this is the one event in the chain that
  can see the DC's identity being used from somewhere it is not.
  The false-positive profile is UNMEASURED. The lab has not captured a DC-account PKINIT of
  any kind, benign or not, and the rule is written from the Microsoft 4768 field reference
  rather than from observed traffic. The expectation is near-zero in a plain estate, but
  the falsepositives below are the shapes most likely to break that expectation; measure
  against your own DCs before paging on it, and keep it experimental until you have.
  Two DEPLOY-REQUIRED spots: the DC computer accounts in the selection, and the DC
  addresses in filter_dc_sources. Until the first is filled the rule matches only the
  DC01$/DC02$ examples and is inert - fill it first, the same caveat as
  unconstrained_delegation_4624. The selection is restricted to DC accounts on purpose:
  widening it to every machine account (TargetUserName|endswith '$') would also catch a
  shadow-credentials PKINIT as a workstation account, but Sigma cannot compare the client
  address to that workstation's own address, so it would fire on every machine-certificate
  PKINIT in the estate. If your estate has none, widen it; otherwise keep it to the DCs.
  Status is deliberately not constrained: a FAILED certificate pre-auth as DC01$ from a
  non-DC address (strong-mapping rejection, revoked certificate) is the same operator one
  step earlier, and a success is the compromise. Triage on CertIssuerName /
  CertSerialNumber / CertThumbprint, which 4768 populates for PKINIT; the serial resolves
  to the 4886/4887 request adcs_esc1_san_mismatch_4886 surfaced, and that pairing (a
  machine-account certificate requested through a relay, then used from the relay host) is
  the whole chain. Requires success AND failure auditing on "Audit Kerberos Authentication
  Service" on every DC; success-only auditing drops the failed half described above.
  Validate (purple): dotfiles-Offense coercion -> relay -> AD CS (ESC8) fold, then
  `certipy auth -pfx dc01.pfx` from the relay host; the 4768 lands on whichever DC answered.
references:
  - https://attack.mitre.org/techniques/T1649/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768
  - https://posts.specterops.io/certified-pre-owned-d95910965cd2
author: dotfiles-Defense
date: 2026-10-14
tags:
  - attack.credential-access
  - attack.t1649
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType: 16   # PA-PK-AS-REQ: the TGT was obtained with a certificate
    # DEPLOY-REQUIRED: replace with EVERY domain controller's computer account (and any
    # RODC). These are the identities whose TGT must only ever be requested from a DC.
    # Until filled this matches only the examples, so a certificate-authenticated TGT as
    # any other real DC is missed entirely — this rule is inert until you substitute your
    # inventory. Run detections/sigma/deploy-required.sh to find this.
    TargetUserName:
      - 'DC01$'   # example — replace
      - 'DC02$'   # example — replace
  filter_dc_sources:
    # DEPLOY-REQUIRED: replace with the addresses of those same domain controllers, in the
    # form 4768 logs them: IPv4 clients arrive as IPv4-mapped IPv6 (::ffff:a.b.c.d), IPv6
    # clients as their IPv6 address. List every address a DC can source Kerberos from —
    # each interface, each IPv6 address if IPv6 is in use, and any load balancer or NAT a
    # DC-to-DC request can traverse. Until filled, a DC-account PKINIT from any real DC
    # other than the examples would fire.
    IpAddress:
      - '::ffff:10.0.0.10'   # example — replace (DC01)
      - '::ffff:10.0.0.11'   # example — replace (DC02)
  filter_local:
    # The DC asking its own KDC - logged against the loopback address, never a remote host.
    IpAddress:
      - '::1'
      - '127.0.0.1'
      - '::ffff:127.0.0.1'
  condition: selection and not 1 of filter_*
falsepositives:
  - A DC missing from filter_dc_sources - a newly promoted DC, a re-addressed DC, a second
    interface, or an IPv6 address on a DC listed only by IPv4. Keep the list in step with
    the Domain Controllers OU and its DNS records; this is the FP that will actually occur.
  - Read-only DCs, which request tickets from writable DCs and may not be in either list
    (add the RODC's account to the selection and its address to the filter, or neither).
  - DC-to-DC Kerberos that traverses a load balancer, VPN concentrator or NAT, so the
    requesting address 4768 records is the middlebox rather than the DC. Allowlist the
    middlebox address only if nothing but DCs can source traffic through it.
  - DCs whose Kerberos client has been configured for machine-certificate PKINIT (some
    device-certificate / Credential Guard deployments). Confirm by CertIssuerName and the
    requesting address; a DC's own renewal still arrives from a DC address, so this is a
    false positive only when combined with one of the address cases above.
  - None of the above has been measured in the lab; treat the list as the hypotheses to
    check during tuning, not as a baseline.
level: high
