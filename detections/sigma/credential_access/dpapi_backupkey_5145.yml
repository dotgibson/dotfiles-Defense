title: MS-BKRP use over the protected_storage pipe on a DC (5145, hunt)
id: d2280db3-54ba-4329-8cc7-de905fac62ac
status: test
description: |
  Hunt, not the backup-key-theft alert. A 5145 on a DC for the protected_storage pipe over
  IPC$ is MS-BKRP (BackupKey Remote Protocol) use. It was titled as backup-key theft, but
  the tools that steal the key do not take it this way: SharpDPAPI `backupkey`, impacket
  `dpapi.py backupkeys` and mimikatz `lsadump::backupkeys` read the G$BCKUPKEY_* LSA
  secret over \lsarpc (verified in SharpDPAPI lib/Backup.cs and impacket dpapi.py). That
  theft is dpapi_backupkey_secret_read_4662.yml (id d4125b17-0cc3-4f43-83f9-5f9190750682).
  What does ride protected_storage is BackuprKey restore: a client asking the DC to
  decrypt one master key online. Windows clients do that for their own user when a
  password reset leaves a master key unreadable, and impacket `dpapi.py masterkey` does it
  with a stolen user credential. So this is worth a look at a principal doing it for many
  users, or from a host that is not theirs, but it is not a theft signal on its own.
  Requires detailed file-share auditing (5145) on domain controllers.
references:
  - https://attack.mitre.org/techniques/T1555/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/dpapi-backupkey-4662.md
author: dotfiles-Defense
date: 2026-07-15
modified: 2026-09-28
tags:
  - attack.credential-access
  - attack.t1555
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains: 'IPC$'
    RelativeTargetName|contains: 'protected_storage'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Windows clients asking the DC to recover their own master key after a password
    reset (legitimate BackuprKey restore under the user's own account).
level: low
