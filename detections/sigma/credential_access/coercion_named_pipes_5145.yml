title: Authentication coercion - named-pipe access over IPC$ (5145)
id: 29ac7a00-b6fe-48d8-8c65-f62a8b83808d
status: experimental
description: |
  Detects the on-wire moment of an authentication-coercion trigger: a 5145 detailed
  file-share access to one of the coercion named pipes - spoolss (PrinterBug),
  efsrpc (PetitPotam), lsarpc/netlogon (DFSCoerce/others), or lsass - over the IPC$
  share. Every coercion vector converges on this small set of RPC endpoints, so the
  detection keys on the pipe set rather than the tool: the target endpoint can't
  change even as the coercion technique does. This is the trigger half of the
  coercion -> relay chain; the relayed logon is caught separately (see the 4624
  fan-out rule).
  Detection posture: broad triage surface even after filtering. netlogon and lsarpc carry
  legitimate domain traffic, so this still fires on benign access by real users - scope by
  threshold, source, or pipe subset per environment, and pair with a coercion tripwire host.
  Prefer efsrpc/spoolss as the higher-signal subset if the full set is too noisy; those two
  are genuinely rare over IPC$, where netlogon and lsarpc are not. Splitting them into an
  alerting subset plus a distinct-target fan-out correlation for the noisy pair (the shape
  host_enum_srvsvc_wkssvc_5145 already uses) is the next step if the machine-account filter
  alone does not bring the volume down.
  Validate (purple): run PetitPotam / coercer / printerbug from dotfiles-Offense
  (hacktheplanet "Poisoning & relay" fold; htpx pair coerce-petitpotam). Requires
  detailed file-share auditing (5145) on DCs and servers.
references:
  - https://attack.mitre.org/techniques/T1187/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/coercion-5145.md
author: dotfiles-Defense
date: 2026-07-15
tags:
  - attack.credential_access
  - attack.t1187
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains: 'IPC$'
    RelativeTargetName|contains:
      - 'spoolss'
      - 'efsrpc'
      - 'lsarpc'
      - 'netlogon'
      - 'lsass'
  filter_machine:
    # The same machine-account filter both 5145 siblings carry (dpapi_backupkey_5145,
    # gpp_cpassword_sysvol_5145). Domain members bind netlogon and lsarpc to each other
    # as routine business under their COMPUTER account, and that traffic is the bulk of
    # what made this rule an estate-wide firehose. Coercion is driven from a user or an
    # unauthenticated context, so it survives this filter.
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Legitimate RPC over these pipes (spooler, netlogon secure channel, EFS) by a real
    USER account - filter_machine removes the computer-account bulk, not this. Triage on
    the source principal/host and volume, allowlist known infrastructure, or narrow to
    the efsrpc/spoolss subset.
  - Service accounts that bind these pipes as part of a management or backup product
    (allowlist the specific principal).
level: medium
