title: Kerberos password spray - one source, many accounts with wrong-password pre-auth failures (4771 0x18)
id: c34eca90-8774-47f6-a0d7-c01b1a116c00
status: experimental
description: |
  Detects one client address generating wrong-password Kerberos pre-auth failures (0x18)
  across many distinct accounts - a password spray over Kerberos (kerbrute
  passwordspray / bruteuser), the 4771 twin of password_spray_4625.yml's NTLM/4625 view.
  A real user mistypes their own password, not five-plus other people's. Username
  enumeration does NOT produce this event (see the base rule's description); it is
  kerberos_user_enum_4768.yml.
  Validate (purple): run "kerbrute passwordspray" from dotfiles-Offense (hacktheplanet
  "Microsoft Windows Kerberos" fold).
references:
  - https://attack.mitre.org/techniques/T1110/003/
correlation:
  type: value_count
  rules:
    - kerb_preauth_fail_4771
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    gte: 5
    field: TargetUserName
falsepositives:
  - A jump host or service running under many identities (allowlist its address).
level: high
