title: Kerberos password-spray base - pre-auth failure 0x18, wrong password (4771)
id: 5eb3081c-3f36-48b1-980e-7430685bbc01
status: experimental
description: |
  Base event for the Kerberos password-spray correlation: a pre-auth failure with code
  0x18, KDC_ERR_PREAUTH_FAILED - which Microsoft's 4771 reference defines as "the wrong
  password was provided". One is normal; many distinct accounts from one client is the
  spray. This rule used to call itself an AS-REP / username-ENUMERATION base, which 0x18
  is not: kerbrute userenum and GetNPUsers send AS-REQs without pre-auth, so a real user
  never reaches a password check and a nonexistent one comes back as 4768 status 0x6.
  That enumeration is kerberos_user_enum_4768.yml; the roast itself (4768 pre-auth type
  0) is asrep_roast_4768.yml. The filename is kept for the manifest and htpx references.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/password-spray-4625.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-28
name: kerb_preauth_fail_4771
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4771
    Status: '0x18'
  condition: selection
falsepositives:
  - A single user with an expired password (defeated by the group-by below).
level: informational
