title: GPP cpassword hunt - one user sweeping many User preferences files (5145)
id: d7a490eb-2559-4a2f-8853-728a486d8c4a
status: test
description: |
  Detects a GPP cpassword harvester reading User\Preferences files across SYSVOL: one
  user account reading ten or more distinct preference XMLs in ten minutes. A logon reads
  the files of that user's linked GPOs; Get-GPPPassword and nxc -M gpp_password read
  every one in every policy. The count is of distinct file PATHS, and each path carries
  its GPO's GUID, so a user whose three linked GPOs each map drives and printers reads six
  distinct files per logon. The threshold therefore has to clear the most any one user
  reads across all their linked GPOs, not the file count of a single GPO. (Counting
  distinct GPOs would be the sharper signal, but a Sigma correlation cannot count a
  field derived from the path.)
  Validate (purple): run "nxc -M gpp_password" from dotfiles-Offense (hacktheplanet SMB
  fold; htpx pair gpp-cpassword).
references:
  - https://attack.mitre.org/techniques/T1552/006/
correlation:
  type: value_count
  rules:
    - gpp_user_preferences_read_5145
  group-by:
    - SubjectUserName
  timespan: 10m
  condition:
    # DEPLOY-REQUIRED: size this to your estate. It must sit above the most User\Preferences
    # files any one user reads at logon across ALL their linked GPOs, and below the number
    # of credential-bearing preference XMLs in your SYSVOL, or the correlation can never
    # fire. Run detections/sigma/deploy-required.sh to find this.
    gte: 10
    field: RelativeTargetName
falsepositives:
  - A GPO administrator reviewing many policies' preferences from SYSVOL (allowlist GPO
    admins on the base rule).
level: medium
