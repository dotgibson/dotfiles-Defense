title: GPP cpassword hunt - Machine preferences XML read by a user account (5145)
id: 37d35e16-6e07-457b-b899-d8ef0c4fe8f3
status: test
description: |
  Detects the on-wire moment of a GPP cpassword hunt: a 5145 detailed file-share
  access on the SYSVOL share whose relative target is a credential-bearing Group
  Policy Preferences XML under a GPO's Machine\Preferences. The decrypt is offline
  (Microsoft published the AES key), so the read is the only telemetry. Machine
  preferences are applied by the computer, so only machine accounts read them
  legitimately - a user account reading one is the hunt.
  User\Preferences files are different: every user reads their linked GPOs' user
  preferences at logon, under their own account, so a single read of those is normal.
  They are covered by the fan-out correlation below instead (many distinct files by one
  user in a short window - a harvester sweeping SYSVOL, not a logon).
  Validate (purple): run "nxc -M gpp_password" from dotfiles-Offense (hacktheplanet
  SMB fold; htpx pair gpp-cpassword). Honey-policy a fake Groups.xml for a
  near-zero-FP tripwire. Requires detailed file-share auditing on DCs.
references:
  - https://attack.mitre.org/techniques/T1552/006/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/gpp-cpassword-5145.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-28
tags:
  - attack.credential-access
  - attack.t1552.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains: 'SYSVOL'
    RelativeTargetName|contains: '\Machine\Preferences\'
    # The six cpassword-bearing preference files. Drives.xml was missing; a drive map
    # can carry a password and Get-GPPPassword / nxc -M gpp_password both harvest it.
    RelativeTargetName|endswith:
      - 'Groups.xml'
      - 'Services.xml'
      - 'ScheduledTasks.xml'
      - 'Printers.xml'
      - 'DataSources.xml'
      - 'Drives.xml'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Admin workstations editing Group Policy Preferences (allowlist GPO admins).
level: medium
