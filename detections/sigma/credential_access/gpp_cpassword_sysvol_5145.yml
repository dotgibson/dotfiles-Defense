title: GPP cpassword base - User preferences XML read (5145)
id: 798535c3-788a-463f-bceb-04c1a814524a
status: test
description: |
  Base event for the User-preferences fan-out below: a user account reading a
  credential-bearing preferences XML under a GPO's User\Preferences on SYSVOL. Not
  actionable alone - every logon does this for the user's linked GPOs.
references:
  - https://attack.mitre.org/techniques/T1552/006/
author: dotfiles-Defense
date: 2026-09-28
name: gpp_user_preferences_read_5145
tags:
  - attack.credential-access
  - attack.t1552.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains: 'SYSVOL'
    RelativeTargetName|contains: '\User\Preferences\'
    RelativeTargetName|endswith:
      - 'Groups.xml'
      - 'Services.xml'
      - 'ScheduledTasks.xml'
      - 'Printers.xml'
      - 'DataSources.xml'
      - 'Drives.xml'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Every user logon (defeated by the distinct-file count below).
level: informational
