title: DPAPI domain backup key read from LSA secrets (4662 on a DC)
id: d4125b17-0cc3-4f43-83f9-5f9190750682
status: experimental
description: |
  Detects theft of the DPAPI domain backup key the way the tools actually take it: a
  read of the G$BCKUPKEY_* LSA secret on a domain controller. SharpDPAPI `backupkey`
  (lib/Backup.cs: LsaOpenPolicy, then LsaRetrievePrivateData on "G$BCKUPKEY_PREFERRED" and
  "G$BCKUPKEY_<guid>"), impacket `dpapi.py backupkeys` (hLsarRetrievePrivateData over
  \lsarpc) and mimikatz `lsadump::backupkeys` all read the secret through LSARPC. On the
  DC that is a 4662 on the LSA SecretObject with AccessMask 0x2 - the read of the secret
  value - and the object name carries BCKUPKEY. With the key an attacker decrypts every
  user's DPAPI master keys offline, domain-wide, so this read is the one moment there is
  to see. Shape follows SigmaHQ's "DPAPI Domain Backup Key Extraction" (4ac1f50b), itself
  built on the OTRF Threat Hunter Playbook capture.
  This replaces what dpapi_backupkey_5145.yml claimed: that rule watches the
  protected_storage pipe (MS-BKRP), which these tools do not use to take the key. It is
  kept as a low-severity hunt for MS-BKRP use.
  Data-source prerequisite: 4662 for LSA secret objects must be audited on DCs - confirm
  in the lab that a SharpDPAPI backupkey run produces the event before relying on this.
  Validate (purple): run SharpDPAPI backupkey or `dpapi.py backupkeys` from
  dotfiles-Offense (hacktheplanet "Credential access" fold; htpx pair dpapi-backupkey).
references:
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1555/
  - https://threathunterplaybook.com/hunts/windows/190620-DomainDPAPIBackupKeyExtraction/notebook.html
  - https://github.com/GhostPack/SharpDPAPI/blob/master/SharpDPAPI/lib/Backup.cs
author: dotfiles-Defense
date: 2026-09-28
tags:
  - attack.credential-access
  - attack.t1003.004
  - attack.t1555
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    ObjectType: 'SecretObject'
    AccessMask: '0x2'
    ObjectName|contains: 'BCKUPKEY'
  condition: selection
falsepositives:
  - A sanctioned domain backup / DR procedure that exports the backup key (rare and
    change-controlled; confirm and allowlist the principal).
level: high
