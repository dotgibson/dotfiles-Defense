title: LSASS process access with dump-shaped rights
id: 4e9ec480-5e5f-4e7d-b986-a10d0caedebc
status: experimental
description: |
  Detects credential theft from memory: a handle to lsass.exe with read/dump
  access rights, from a process that is not a known security/AV engine. Sysmon 10
  (ProcessAccess) sees this far better than the Security log. GrantedAccess is matched on
  the PROCESS_VM_READ (0x10) bit rather than a fixed list: an exact list (0x1010, 0x1410,
  0x1438, 0x143a, 0x1fffff) let any other read-capable mask through, including
  0x1f0fff (pre-Vista PROCESS_ALL_ACCESS, still what tools built against old headers ask
  for) and 0x410 (QUERY_INFORMATION|VM_READ). The suffix list follows SigmaHQ's LSASS
  access-flag rule. The full-rights masks are the ones most likely to be a legitimate
  agent, so if this rule stays noisy after the allowlist below is populated, that is where
  the noise is.
  Validate (purple): run "nxc -M lsassy" / a remote LSASS dump from dotfiles-Offense
  (hacktheplanet "Lateral movement" fold; htpx pair lsass-dump-lsassy). Tune the
  SourceImage allowlist to your EDR/AV.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/lsass-4656.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-28
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    # Low byte carries PROCESS_VM_READ (0x10) when its high nibble is odd. Sysmon renders
    # the mask as lowercase hex; Sigma matching is case-insensitive.
    - GrantedAccess|endswith: ['10', '30', '50', '70', '90', 'b0', 'd0', 'f0',
                               '18', '38', '58', '78', '98', 'b8', 'd8', 'f8',
                               '1a', '3a', '5a', '7a', '9a', 'ba', 'da', 'fa']
    - GrantedAccess|startswith: ['0x1f0fff', '0x1f1fff', '0x1f2fff', '0x1f3fff', '0x1fffff']
  filter_av:
    # DEPLOY-REQUIRED: extend with YOUR endpoint-protection agents. The list below covers
    # Defender (MsMpEng/MsSense) and the two OS processes that legitimately hold LSASS
    # handles; the third-party entries are the common EDRs, kept as EXAMPLES because the
    # binary names differ by product and version. In any non-Defender shop the EDR reads
    # LSASS continuously, so until this matches your agent this high-severity rule fires
    # steadily. Run detections/sigma/deploy-required.sh to find this.
    # Keyed on FULL paths / protected install directories, never a bare basename:
    # `SourceImage|endswith: '\MsMpEng.exe'` also matched C:\Users\Public\MsMpEng.exe, so a
    # dumper renamed to MsMpEng.exe was filtered. Defender runs from a versioned folder
    # under its Platform directory, which tamper protection keeps attacker-proof.
    - SourceImage|startswith:
        - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
        - 'C:\Program Files\Windows Defender\'
        - 'C:\Program Files\Windows Defender Advanced Threat Protection\'
    - SourceImage:
        - 'C:\Windows\System32\wininit.exe'
        - 'C:\Windows\System32\csrss.exe'
        - 'C:\Program Files\CrowdStrike\CSFalconService.exe'   # example (CrowdStrike) — verify on your fleet
        - 'C:\Program Files\Confer\RepMgr.exe'                 # example (Carbon Black) — verify on your fleet
    - SourceImage|startswith: 'C:\Program Files\SentinelOne\'   # example (SentinelOne, versioned folder) — verify
  condition: selection and selection_access and not filter_av
falsepositives:
  - Endpoint protection / EDR agents reading LSASS (allowlist by SourceImage).
  - Some backup and performance-monitoring agents.
level: high
