title: Protected service stopped - backup / AV / database teardown (T1489)
id: b28f3d5e-701d-4b00-bb34-8a241a99f018
status: experimental
description: |
  Detects a command-line stop or disable of a service that protects data (T1489): the
  database and mail engines that hold the files open, the backup agents that would let you
  roll back, and the AV/EDR that would kill the payload. Ransomware families ship this as a
  hard-coded net stop / sc stop list run seconds before the encryption sweep.
  Paired with service_stop_burst, not a duplicate of it. The two rules discriminate on
  different axes and each catches what the other misses:
    - service_stop_burst counts VOLUME AND VARIETY - five distinct stop commands on one
      host in five minutes - and knows nothing about which services. It catches the broad
      teardown, and misses a surgical single stop.
    - this rule knows the NAMES that matter and fires on ONE of them. It catches
      `net stop VeeamBackupSvc` on its own, and misses a walk through twenty services
      whose names aren't in the list.
  Run both: the burst is the general case, this is the high-confidence single event. Both
  sit in the ransomware fold alongside recovery_inhibition_process (T1490, destroys the
  rollback), mass_file_encryption_4663 and bitlocker_abuse_encryption (T1486, the payload),
  and data_destruction_wipe (T1485). Any two of those on one host inside a window is a
  ransomware event in progress.
  On process creation rather than the Service Control Manager's own 7036 "entered the
  stopped state" transition: a Sigma rule carries one logsource, and 4688/Sysmon-1 is
  already collected here while 7036 needs the System channel plus a much wider name list to
  be useful. Use 7036 as the corroborating signal in triage - the process-creation event
  names the operator and the parent, the 7036 pair proves the services actually went down.
  The keyword list is the scoping: it is the difference between "someone stopped a service"
  (constant) and "someone stopped the things that protect the data" (an incident). That only
  holds if the keywords match where a SERVICE NAME sits rather than anywhere on the line -
  see the block's own comment for the two shapes and for how to extend it, which is the part
  the earlier "extend it with your own service names" advice left out.
  Validate (purple): run the pre-ransom service-stop batch from dotfiles-Offense (htpx pair
  service-stop-preransom).
references:
  - https://attack.mitre.org/techniques/T1489/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/service-stop-7036.md
author: dotfiles-Defense
date: 2026-08-05
modified: 2026-09-16
tags:
  - attack.impact
  - attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection_net_sc:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\sc.exe'
    CommandLine|contains:
      - ' stop '
      - 'start= disabled'
      - 'start=disabled'
  selection_powershell_stop:
    # Image-scoped like every other process_creation selection in the corpus: a cmdlet name
    # only reaches a command line via an inline -Command/-c invocation, which runs under
    # these two images by definition.
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains: 'Stop-Service'
  selection_powershell_disable:
    # SPLIT FROM THE STOP ARM because Set-Service is not a teardown verb on its own. It is
    # equally how you START a service, rename it, or edit its description - so
    # `Set-Service -Name MSSQLSERVER -Description "nightly maintenance window"` used to match
    # this selection and the keyword block below, and page at high for a text edit. Requiring
    # the disabling form makes this arm consistent with its own net/sc sibling, which already
    # insists on `start= disabled` rather than firing on any `sc config`.
    # Matched on 'Disabled' rather than the full '-StartupType Disabled' so the parameter's
    # colon form (-StartupType:Disabled) and PowerShell's unambiguous-prefix abbreviations
    # still match; the cmdlet name in the same block is what keeps the word scoped.
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains|all:
      - 'Set-Service'
      - 'Disabled'
  protected_services:
    # ANCHORING, and it is the point of this block rather than a detail of it. These keywords
    # are ANDed with a stop/disable verb but matched against the WHOLE command line, so a
    # short one matched anywhere - including in a redirect target, a log path, or a flag
    # argument. `sc stop Spooler >> C:\Backup\logs\svc.txt` is a Spooler stop that paged as a
    # backup-agent teardown, and the analyst could not tell from the alert why it fired.
    #
    # Two shapes, and which one a keyword gets depends only on whether it can collide:
    #   - a distinctive product or service name goes in bare, because a command line that
    #     happens to contain it somewhere other than the service-name slot is not a realistic
    #     shape;
    #   - a short or generic token is GUARDED by the character that precedes a service name.
    #     A service name follows a space or an opening quote; a path component follows a
    #     backslash - which is exactly what the guard rejects. Same reasoning as the
    #     deliberate trailing space on taskkill's '/f ' in service_stop_burst.
    #
    # EXTENDING THIS LIST: add the service NAME, and if it is short or a common English word,
    # add both guarded forms rather than the bare token. The rule's own advice used to be
    # "extend it" without saying how, and extending an unanchored list makes the false
    # positives worse, not the coverage better.
    CommandLine|contains:
      # Distinctive - bare.
      - 'msexchange'
      - 'veeam'
      - 'acronis'
      - 'sophos'
      - 'memtas'
      - 'mepocs'
      - 'postgres'
      - 'oracle'
      - 'mssql'
      - 'sqlwriter'
      - 'sqlserveragent'
      - 'backupexec'
      - 'windefend'
      - 'swprv'
      # Short or generic - guarded to the service-name position.
      - ' sql'
      - '"sql'
      - ' vss'
      - '"vss'
      - ' backup'
      - '"backup'
      - ' sentinel'
      - '"sentinel'
      - ' defend'
      - '"defend'
      - ' sense'
      - '"sense'
  condition: (1 of selection_*) and protected_services
falsepositives:
  - Sanctioned maintenance - a DBA or backup admin stopping one service during a patch
    window. The discriminators are the parent process (a script/shell dropped by the
    intrusion, not a console session) and co-occurrence with T1490 recovery inhibition or
    the T1489 burst; suppress known maintenance hosts and windows at the SIEM rather than
    in the rule.
  - Installers and updaters that stop their own database or AV service to upgrade it.
level: high
