title: Mass file encryption - one process rewriting many files (4663)
id: 5f7afed7-23a5-4731-a3aa-855371ebf920
status: experimental
description: |
  Detects the ransomware payload itself (T1486): a single process opening write/delete
  handles against many distinct files in a short window. This is the other half of the
  ransomware pair - recovery_inhibition_process catches the operator destroying the
  rollback path (T1490, the precursor), this catches the encryption that follows. Counting
  DISTINCT ObjectName per process beats a raw 4663-rate threshold because the payload's
  fingerprint is breadth (a sweep across directories) rather than repeated writes to one
  file, which is what a database or log writer looks like.
  Tune the threshold to your SACL scope and your baseline: a SACL on a single document
  share and one on every user profile have very different normal rates, and backup,
  indexing, AV-scan-and-quarantine, and sync agents are the processes that legitimately
  sweep files - identify them from your own data and suppress them by ProcessName rather
  than raising the threshold until the payload fits under it. Pair with T1490 recovery
  inhibition and T1489 service stop: those three inside one window is a ransomware
  event, not a noisy host.
  Validate (purple): run the file-encryption simulation from dotfiles-Kali (htpx pair
  ransomware-encrypt-files) against a SACL'd share.
references:
  - https://attack.mitre.org/techniques/T1486/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/mass-encrypt-4663.md
correlation:
  type: value_count
  rules:
    - file_write_handle_4663
  group-by:
    - ProcessName
  timespan: 5m
  condition:
    gte: 100
    field: ObjectName
falsepositives:
  - Backup, indexing, sync, and AV-scan agents sweeping a SACL'd tree (suppress the
    specific ProcessName; raising the threshold instead just hides the payload).
  - Bulk migrations and mass deletions run by an administrator (expected, and in a
    change window).
level: high
