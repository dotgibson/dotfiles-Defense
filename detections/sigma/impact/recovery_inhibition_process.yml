title: Inhibit system recovery - shadow copy / backup / boot-recovery deletion
id: 7dbc97d7-0d27-4a77-8dfd-daf203087726
status: test
description: |
  Detects the ransomware kill-chain precursor Inhibit System Recovery (T1490): an
  operator destroying the means to roll back before or during encryption - vssadmin /
  wmic deleting shadow copies, wbadmin deleting the backup catalog, or bcdedit disabling
  Windows Recovery (recoveryenabled no / bootstatuspolicy ignoreallfailures). These run
  from almost nothing legitimate on endpoints and are near-zero-FP and high-fidelity;
  they are the natural inverse of ntds_dump_ntdsutil_vss_4688 (which keys on vssadmin
  *create* shadow). One of these on a workstation is an incident, not a maintenance task.
  First leg of the ransomware fold here. The rest: service_stop_burst and
  service_stop_protected_services clear the way (T1489 - the broad teardown and the
  named-protected-service stop respectively), mass_file_encryption_4663 and
  bitlocker_abuse_encryption are the payload (T1486 - the general 4663 case and the
  BitLocker-from-the-command-line case), and data_destruction_wipe is the no-ransom
  variant (T1485). Any two of those on one host inside a window is a ransomware event in
  progress, not two maintenance tasks.
  Validate (purple): run the recovery-inhibition commands from dotfiles-Offense (htpx pair
  inhibit-recovery-vssadmin).
references:
  - https://attack.mitre.org/techniques/T1490/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/inhibit-recovery-4688.md
author: dotfiles-Defense
date: 2026-07-22
modified: 2026-09-28
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss:
    Image|endswith:
      - '\vssadmin.exe'
      - '\wmic.exe'
    CommandLine|contains|all:
      - 'shadow'
      - 'delete'
  selection_vss_resize:
    # Conti-style purge: shrink shadow storage until Windows discards the copies itself -
    # `vssadmin resize shadowstorage /for=C: /on=C: /maxsize=401MB` - no "delete" anywhere.
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'resize'
      - 'shadowstorage'
  selection_ps_shadowcopy:
    # Get-WmiObject/Get-CimInstance Win32_ShadowCopy piped to Remove-WmiObject /
    # Remove-CimInstance, or `.Delete()` on each - the same deletion without vssadmin.
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains: 'Win32_ShadowCopy'
  ps_shadowcopy_delete:
    CommandLine|contains:
      - 'Remove-WmiObject'
      - 'Remove-CimInstance'
      - '.Delete('
  selection_wbadmin:
    # `delete catalog`, `delete systemstatebackup` and `delete backup` all destroy the
    # backup set; requiring `catalog` alone let the other two through.
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains: 'delete'
  wbadmin_target:
    CommandLine|contains:
      - 'catalog'
      - 'backup'
  selection_bcdedit_recovery:
    Image|endswith: '\bcdedit.exe'
    # bcdedit booleans accept no/off/false/0, so requiring the literal `no` let
    # `recoveryenabled off` and `... 0` through. Setting it by hand is rare either way.
    CommandLine|contains: 'recoveryenabled'
  selection_bcdedit_bootstatus:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains|all:
      - 'bootstatuspolicy'
      - 'ignoreallfailures'
  condition: selection_vss or selection_vss_resize or (selection_ps_shadowcopy and ps_shadowcopy_delete) or (selection_wbadmin and wbadmin_target) or 1 of selection_bcdedit_*
falsepositives:
  - An administrator resizing shadow storage upward, or re-enabling boot recovery with
    `recoveryenabled yes`, during maintenance - both now match; confirm against the change.
  - Sanctioned backup/imaging software or an administrator intentionally clearing shadow
    storage during maintenance (allowlist the binary path and account/host).
level: high
