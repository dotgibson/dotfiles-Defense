title: Data destruction - free-space wipe / secure delete / volume clean
id: 4b90e2fa-6c17-4d53-a8e9-70c1b5348d2f
status: experimental
description: |
  Detects Data Destruction (T1485): the built-in and Sysinternals primitives that make
  data unrecoverable rather than merely deleted - cipher /w (overwrite free space,
  which is how deleted-file recovery is defeated), sdelete (secure overwrite),
  fsutil file setZeroData (zero a file's contents in place), and diskpart clean
  (wipe the partition table). These are the destructive tail of the same kill chain
  recovery_inhibition_process (T1490) opens: T1490 removes the rollback, this removes
  the data, and where the operator wants a wiper rather than a ransom this is the
  whole objective.
  Detection posture: near-zero-FP on endpoints and servers. None of these run in
  normal operation - the legitimate users are decommissioning and disk-imaging
  workflows, which are scheduled, hosted, and easy to allowlist. One of these on a
  workstation is an incident.
  Generic `category: process_creation` so it matches both Security-4688 and Sysmon-1.
  Validate (purple): run the destruction commands alongside the ransomware-precursor
  fold from dotfiles-Kali (htpx pair inhibit-recovery-vssadmin). Requires the Process
  Creation audit subcategory (4688) or Sysmon EventID 1.
references:
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1490/
author: dotfiles-Defense
date: 2026-08-05
tags:
  - attack.impact
  - attack.t1485
logsource:
  category: process_creation
  product: windows
detection:
  selection_cipher_wipe:
    Image|endswith: '\cipher.exe'
    CommandLine|contains: '/w'
  selection_sdelete:
    Image|endswith:
      - '\sdelete.exe'
      - '\sdelete64.exe'
  selection_fsutil_zero:
    Image|endswith: '\fsutil.exe'
    CommandLine|contains: 'setzerodata'
  selection_diskpart_clean:
    Image|endswith: '\diskpart.exe'
    CommandLine|contains: 'clean'
  condition: 1 of selection_*
falsepositives:
  - Decommissioning / media-sanitization and disk-imaging workflows (allowlist the host
    and the operator account, and scope to the change window).
  - Sysinternals sdelete used by an administrator to scrub a specific file (triage on
    the target path and the account).
level: high
