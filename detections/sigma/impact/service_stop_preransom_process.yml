title: Pre-ransom service teardown - backup / AV / database services stopped
id: b28f3d5e-701d-4b00-bb34-8a241a99f018
status: experimental
description: |
  Detects the service teardown that precedes encryption (T1489): an operator stopping or
  disabling the services that would otherwise hold files open, keep backing them up, or
  kill the payload - SQL/Exchange, the backup agents (Veeam, Acronis, Backup Exec), and
  the AV/EDR services. Ransomware families ship this as a hard-coded net stop / sc stop
  list run seconds before the encryption sweep, and it is the third leg of the ransomware
  fold here: recovery inhibition (T1490, recovery_inhibition_process) destroys the
  rollback path, this clears the way, mass_file_encryption_4663 is the payload.
  The detection is on process creation rather than on the Service Control Manager's own
  7036 "entered the stopped state" transition, for two reasons: a Sigma rule carries one
  logsource, and 4688/Sysmon-1 is already collected here while 7036 needs the System
  channel plus a much wider name list to be useful. Use 7036 as the corroborating signal
  in triage - the process-creation event names the operator and the parent, the 7036 pair
  proves the services actually went down.
  Gated on the protected-service keyword list: it is the difference between "someone
  stopped a service" (constant) and "someone stopped the things that protect the data"
  (an incident). Extend the list with your own backup/AV/line-of-business service names.
  Validate (purple): run the pre-ransom service-stop batch from dotfiles-Kali (htpx pair
  service-stop-preransom).
references:
  - https://attack.mitre.org/techniques/T1489/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/service-stop-7036.md
author: dotfiles-Defense
date: 2026-08-05
tags:
  - attack.impact
  - attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection_net_sc:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\sc.exe'
    CommandLine|contains:
      - ' stop '
      - 'start= disabled'
      - 'start=disabled'
  selection_powershell:
    CommandLine|contains:
      - 'Stop-Service'
      - 'Set-Service'
  protected_services:
    CommandLine|contains:
      - 'sql'
      - 'msexchange'
      - 'veeam'
      - 'backup'
      - 'acronis'
      - 'memtas'
      - 'mepocs'
      - 'sophos'
      - 'sentinel'
      - 'defend'
      - 'vss'
      - 'sqlwriter'
      - 'postgres'
      - 'oracle'
  condition: (1 of selection_*) and protected_services
falsepositives:
  - Sanctioned maintenance - a DBA or backup admin stopping one service during a patch
    window. The discriminators are volume (a ransomware batch stops many services in
    seconds), the parent process (a script/shell dropped by the intrusion, not a console
    session), and co-occurrence with T1490 recovery inhibition; suppress known maintenance
    hosts and windows at the SIEM rather than in the rule.
  - Installers and updaters that stop their own database or AV service to upgrade it.
level: high
