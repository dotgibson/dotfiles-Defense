title: Account-management base - password reset, disable, or delete (4724/4725/4726)
id: d6d62842-978b-492f-893a-9c771543ea1d
status: experimental
description: |
  Base event for the account-access-removal correlation below: one administrative action
  against a user account - 4724 (password reset attempt), 4725 (account disabled), 4726
  (account deleted). Not actionable alone; every one of these is an ordinary help-desk
  action. The impact shape is a burst of them against many accounts from one actor,
  expressed by the correlation rule.
  Scope note on the two events NOT in this selection: 4729 and 4733 (removal from a
  privileged group) belong to the same attacker behaviour, but they carry different field
  semantics - on 4733 TargetUserName holds the GROUP name and the removed principal is in
  MemberName, where on 4724/4725/4726 TargetUserName holds the affected USER. Folding all
  five into one selection would make the distinct-TargetUserName count below mix users
  with groups and mean nothing. Privileged-group removal is worth its own rule keyed on
  MemberName; it is deliberately not bolted onto this one.
  Requires the Audit User Account Management subcategory.
references:
  - https://attack.mitre.org/techniques/T1531/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/account-removal-4725.md
author: dotfiles-Defense
date: 2026-08-12
name: account_removal_action
tags:
  - attack.impact
  - attack.t1531
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4724 # password reset attempt
      - 4725 # account disabled
      - 4726 # account deleted
  filter_identity_admins:
    # DEPLOY-REQUIRED: replace with your help-desk, JML/IAM, and provisioning principals -
    # the accounts whose whole job is resetting and disabling users. Unfilled, an offboarding
    # batch or a bulk password reset trips the correlation and the rule gets muted. The
    # signal this rule exists for is an actor who does NOT normally administer identity, so
    # this list is what makes it sharp rather than what makes it quiet. Run
    # detections/sigma/deploy-required.sh to find this.
    SubjectUserName:
      - 'svc_jml'        # example — replace with your IAM/JML automation
      - 'helpdesk-admin' # example — replace with your help-desk principals
  condition: selection and not filter_identity_admins
falsepositives:
  - Any individual help-desk password reset or offboarding action - defeated by the
    distinct-target count below.
level: informational
---
title: Account access removal burst - locking the defenders out (T1531)
id: 26bd9736-4bbc-4f3a-b33d-541d312a1844
status: experimental
description: |
  Detects Account Access Removal (T1531): one actor resetting, disabling, or deleting many
  DISTINCT accounts in a short window - the move that locks responders and administrators
  out of the estate while the rest of the impact plays out. It is a standard extortion and
  wiper precursor, and it sits alongside the ransomware fold this corpus already covers:
  service_stop_burst clears the locks, recovery_inhibition_process removes the rollback,
  the encryption rules catch the payload, and this catches the attempt to stop anyone
  responding to all three.
  Counting DISTINCT TargetUserName per actor is what separates it from help-desk work. A
  help-desk operator resets one account, or resets the same account twice while the user is
  on the phone; an actor locking out a response team walks a list of different accounts in
  one pass. Grouped by SubjectUserName because the invariant is about the ACTOR - an
  identity that does not normally administer identity suddenly doing so in bulk.
  Highest-value tuning is not the threshold, it is filter_identity_admins: fill it and this
  becomes near-zero-FP, because the accounts that legitimately do this in bulk are a short,
  knowable list. Best paired with a standing alert on ANY change to break-glass accounts,
  which no threshold should ever suppress.
  Validate (purple): run the defender lock-out fold from dotfiles-Kali (htpx pair
  account-lockout-defenders). Requires the Audit User Account Management subcategory.
references:
  - https://attack.mitre.org/techniques/T1531/
correlation:
  type: value_count
  rules:
    - account_removal_action
  group-by:
    - SubjectUserName
  timespan: 10m
  condition:
    gte: 4
    field: TargetUserName
falsepositives:
  - Bulk offboarding, an org-wide forced password reset after a credential-exposure
    incident, or a seasonal-staff teardown - the reason filter_identity_admins exists;
    suppress the principals that run those, not the rule.
  - Directory-cleanup scripts deleting stale accounts in a batch (expected, and in a change
    window - triage on whether the actor normally administers identity at all).
level: high
