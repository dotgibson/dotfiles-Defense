title: File create/overwrite base (Sysmon 11)
id: 0a6c58e3-1b47-4d92-8fe0-3c7b91d4a562
status: experimental
description: |
  Base event for the ACL-independent mass-encryption correlation below: a Sysmon
  FileCreate (EventID 11), which fires on both a new file and an overwrite of an
  existing one - the two shapes ransomware writes in (encrypt-to-new-name, and
  encrypt-in-place). Not actionable alone: every save, download, build artifact, and
  temp file is one of these. The payload shape is one process writing a large, diverse
  set of files in minutes, expressed by the correlation rule.
  Channel: this is the Sysmon half of a per-source pair. Its Security-4663 twin is
  mass_file_encryption_4663.yml (id 5f7afed7-23a5-4731-a3aa-855371ebf920), which reads
  ObjectName/ProcessName from object-access auditing. The two are split because they are
  genuinely different data sources with different field names - not one rule naming
  both, which would null under either pipeline (the trap potato_seimpersonate_* documents).
  Deploy whichever you collect; deploy both if you collect both.
  The high-churn write paths are filtered here rather than in the correlation so the
  distinct-file count reflects the operator's sweep and not the machine's own noise.
  Requires FileCreate to be enabled in the Sysmon config - see
  detections/sysmon/sysmonconfig-detection-lab.xml, whose file-create-noise block
  excludes the same shape of path at collection time.
references:
  - https://attack.mitre.org/techniques/T1486/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/mass-encrypt-4663.md
author: dotfiles-Defense
date: 2026-08-05
name: file_create_sysmon_11
tags:
  - attack.impact
  - attack.t1486
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: '\'
  filter_cache_paths:
    TargetFilename|contains:
      - '\AppData\Local\Microsoft\Windows\INetCache\'
      - '\AppData\Local\Microsoft\Windows\WebCache\'
      - '\AppData\Local\Google\Chrome\User Data\Default\Cache\'
      - '\AppData\Local\Mozilla\Firefox\Profiles\'
  filter_os_churn:
    TargetFilename|startswith:
      - 'C:\Windows\Prefetch\'
      - 'C:\Windows\SoftwareDistribution\'
      - 'C:\Windows\WinSxS\'
      - 'C:\Windows\Logs\'
  filter_trace_files:
    TargetFilename|endswith: '.etl'
  condition: selection and not 1 of filter_*
falsepositives:
  - Any normal file write (defeated by the distinct-file count below).
level: informational
