logsource:
  category: process_creation
  product: windows
detection:
  lolbin:
    # The bare binary is not the signal - see the description. Both are ANDed with
    # lolbin_suspicious_arg below.
    Image|endswith:
      - '\rundll32.exe'
      - '\regsvr32.exe'
  lolbin_suspicious_arg:
    # ANDed with lolbin: a URL or scriptlet (regsvr32 /i:http, rundll32 url.dll,OpenURL),
    # a UNC path, or a user-writable directory. Same list as the 4698 rule's
    # lolbin_suspicious_arg, adapted for a command line: `http` is anchored on the SCHEME
    # because System32 ships winhttp.dll and httpapi.dll (`regsvr32 /s winhttp.dll` is a
    # real installer step) and a URL cannot be a DLL name. The TN fixture carries that
    # exact near-miss so a future bare 'http' fails the gate.
    # A UNC prefix is '\\\\': backslash is Sigma's escape character, so '\\' is ONE
    # literal backslash and would match every Windows path.
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '\\\\'
      - 'javascript:'
      - 'vbscript:'
      - '/i:'
      - '\Users\'
      - '\Temp\'
      - '\ProgramData\'
      - '%APPDATA%'
      - '%TEMP%'
      - '%PUBLIC%'
  selection_mshta:
    # Bare, as in the 4698 rule: mshta has no routine benign shape in an estate that does
    # not ship HTA tooling. An estate that does names the tooling's parent in the filter.
    Image|endswith: '\mshta.exe'
  filter_vendor_installers:
    # DEPLOY-REQUIRED: replace with the FULL PATHS of the per-user app installers and
    # updaters that register COM DLLs from AppData/ProgramData via regsvr32 in YOUR estate
    # (the Teams meeting add-in, OneDrive, Zoom and printer/driver setup are the usual
    # set), plus any HTA-based vendor tooling, as exact parent images. Never a basename or
    # an |endswith: a renamed launcher in a user-writable directory would match it and
    # silence every arm, which is what lolbin_proxy_parent_userdir.jsonl pins as a true
    # positive. Prefer parents under Program Files / Windows; list an exact path under a
    # user-writable directory only if the volume forces it, knowing the attacker can plant
    # a binary there. Until filled this excludes only the example. Run
    # detections/sigma/deploy-required.sh to find this.
    ParentImage:
      - 'C:\Program Files\Acme\vendor-installer.exe' # example - replace with your installers' full paths
  condition: ((lolbin and lolbin_suspicious_arg) or selection_mshta) and not filter_vendor_installers
falsepositives:
  - Per-user application installers and updaters registering COM DLLs under AppData or
    ProgramData via regsvr32 (Teams meeting add-in, OneDrive, Zoom). Name the parent's full
    path in filter_vendor_installers.
  - OEM and driver setup running rundll32 against a DLL it staged under ProgramData. Same
    filter, by the parent's full path.
  - Helpdesk or vendor tooling delivered as an HTA (mshta). Same filter, by the parent's
    full path.
  - regsvr32 `/i:` with a local, non-URL install string (rare; triage the DLL path).
level: high
