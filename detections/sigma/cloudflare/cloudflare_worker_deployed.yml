title: Cloudflare Worker deployed (serverless edge code execution)
id: 8e5d901a-61d7-4b11-bb7f-51102447c040
status: experimental
description: |
  Detects publication of a Cloudflare Worker in the account audit log
  (resource.type=worker or workers_script, action.type=create/update). Workers run
  attacker code on the edge in front of every request - skimming credentials/session
  cookies from live traffic, injecting content, or proxying to an attacker origin before
  the request reaches the real site (T1648). Worker deploys should ship from version-
  controlled CI, so one by a human/unexpected actor, outside the deploy pipeline, or on a
  sensitive zone is the tell for edge interception/exfil. Alert on API-side script writes
  that bypass CI and diff the deployed script against its source.
  Validate (purple): deploy a Worker via the Cloudflare API from dotfiles-Kali (htpx pair
  cf-worker-deploy).
references:
  - https://attack.mitre.org/techniques/T1648/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/cf-worker-deploy-audit.md
author: dotfiles-Defense
date: 2026-07-02
tags:
  - attack.execution
  - attack.t1648
logsource:
  product: cloudflare
  service: audit
detection:
  selection:
    resource.type:
      - 'worker'
      - 'workers_script'
    action.type:
      - 'create'
      - 'update'
  condition: selection
falsepositives:
  - Legitimate Worker deploys from the CI pipeline - allowlist the CI service identity
    and require version-controlled deploys; alert on API-side script writes that bypass it.
level: high
