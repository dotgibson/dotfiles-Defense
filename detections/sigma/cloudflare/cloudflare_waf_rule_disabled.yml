title: Cloudflare WAF/firewall rule deleted or disabled (edge exposed)
id: 13b980a3-037f-47c7-bb66-772455159283
status: experimental
description: |
  Detects removal or weakening of a Cloudflare edge control in the account audit log
  (resource.type=firewall_rule or ruleset, action.type=delete/update). The WAF and
  firewall rules gate what reaches the origin; deleting a rule or flipping a ruleset's
  rules to disabled exposes the origin to traffic it was dropping - no origin change
  needed, just an API call (T1562.001). These changes are rare and high-impact, so any by
  an unexpected actor, or a disable quickly followed by anomalous origin traffic, warrants
  review; a delete followed by a re-create is the cover-tracks shape. Manage rules as code
  and alert on out-of-band changes.
  Validate (purple): delete/disable a firewall rule via the Cloudflare API from
  dotfiles-Offense (htpx pair cf-waf-disable).
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/cf-waf-disable-audit.md
author: dotfiles-Defense
date: 2026-07-02
tags:
  - attack.defense-impairment
  - attack.t1686.001
logsource:
  product: cloudflare
  service: audit
detection:
  selection:
    resource.type:
      - 'firewall_rule'
      - 'ruleset'
    action.type:
      - 'delete'
      - 'update'
  condition: selection
falsepositives:
  - Legitimate rule tuning by a security admin during an approved window - reconcile
    against the change ticket and alert on out-of-band firewall/WAF changes.
level: high
