title: Cloudflare WAF/firewall rule deleted or disabled (edge exposed)
id: 13b980a3-037f-47c7-bb66-772455159283
status: experimental
description: |
  Detects removal or weakening of a Cloudflare edge control in the account audit log
  (resource.type=firewall_rule or ruleset, action.type=delete/update). The WAF and
  firewall rules gate what reaches the origin; deleting a rule or flipping a ruleset's
  rules to disabled exposes the origin to traffic it was dropping - no origin change
  needed, just an API call (T1686.001). These changes are rare and high-impact, so any by
  an unexpected actor, or a disable quickly followed by anomalous origin traffic, warrants
  review; a delete followed by a re-create is the cover-tracks shape. Manage rules as code
  and alert on out-of-band changes.
  Validate (purple): delete/disable a firewall rule via the Cloudflare API from
  dotfiles-Offense (htpx pair cf-waf-disable).
references:
  - https://attack.mitre.org/techniques/T1686/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/cf-waf-disable-audit.md
author: dotfiles-Defense
date: 2026-07-02
tags:
  - attack.defense-impairment
  - attack.t1686.001
logsource:
  product: cloudflare
  service: audit
detection:
  selection:
    resource.type:
      - 'firewall_rule'
      - 'ruleset'
    action.type:
      - 'delete'
      - 'update'
  filter_ci:
    # DEPLOY-REQUIRED: replace with the identity your IaC/deploy pipeline manages edge
    # rules as (the Terraform or wrangler service account's email, or the token owner
    # shown in the audit log). ruleset/update is the event for ANY ruleset change, so
    # without this every pipeline-driven edge change - including the ones that TIGHTEN
    # the WAF - is a high-severity alert and the rule gets muted. Until filled this
    # excludes only the example actor.
    # Run detections/sigma/deploy-required.sh to find this.
    actor.email:
      - 'ci-deploy@example.com'   # example — replace with your CI service identity
  condition: selection and not filter_ci
falsepositives:
  - Routine edge-rule management from the IaC pipeline - allowlist the CI service
    identity in filter_ci and require version-controlled edge config; what remains is
    the out-of-band change, which is the event this rule is for.
  - Legitimate rule tuning by a security admin during an approved window - reconcile
    against the change ticket and alert on out-of-band firewall/WAF changes.
level: high
