title: GitHub deploy-key, PAT, or App-install credential backdoor
id: 42f34b55-a66d-494c-8e97-723f8c81947c
status: experimental
description: |
  Detects durable-credential additions in the GitHub Enterprise audit log:
  repo.create_deploy_key (an SSH key bound to a repo - prioritize writable keys),
  personal_access_token.access_granted (a fine-grained PAT approved against org
  resources), or integration_installation.create (a GitHub App installed on the org or
  a repo - its installation token is minted on demand for as long as the install
  stands, with whatever permissions the install granted). All three mint MFA-free,
  non-interactive access that survives a password reset, so an unexpected actor or an
  out-of-band grant is the tell. The App install is the quiet one: it is an admin
  action, it is rare, and once in place nothing about it looks like a credential.
  It was the durable path this rule did not select when first shipped. OAuth-app
  authorizations are deliberately not here - they are user-volume (every IDE and CLI
  sign-in) and are not on the enterprise audit-log action list this rule is scoped to.
  Reconcile new credentials and installs against known CI integrations and review any
  created during an incident.
  Validate (purple): add a deploy key / fine-grained PAT from dotfiles-Offense (htpx pair
  gh-deploy-key-backdoor); install a throwaway GitHub App on a lab org.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/gh-cred-audit.md
author: dotfiles-Defense
date: 2026-07-02
modified: 2026-09-02
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: github
  service: audit
detection:
  selection:
    action:
      - 'repo.create_deploy_key'
      - 'personal_access_token.access_granted'
      - 'integration_installation.create'
  condition: selection
falsepositives:
  - Onboarding a sanctioned CI integration or deploy automation - allowlist the
    expected actors and review credentials granted outside change windows.
level: medium
