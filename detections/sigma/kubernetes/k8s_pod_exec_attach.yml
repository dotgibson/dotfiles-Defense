title: Kubernetes pod exec / attach
id: 58f7fc78-5340-4f02-9596-da4514108b67
status: experimental
description: |
  Detects interactive access into a running pod: a create against the pods/exec or
  pods/attach subresource (kubectl exec / attach). This is the container-runtime
  equivalent of an interactive shell on a host - routine in dev, but in production it
  is the tell for hands-on-keyboard activity, debugging-as-a-foothold, or post-
  compromise lateral movement. Scope to production namespaces and alert on
  exec/attach by human users (not controllers/service accounts).
  Validate (purple): run "kubectl exec -it <pod> -- sh" from dotfiles-Offense (htpx pair
  k8s-exec). Requires the kube-apiserver audit policy logging the exec subresource.
references:
  - https://attack.mitre.org/techniques/T1609/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/k8s-exec-audit.md
author: dotfiles-Defense
date: 2026-06-30
tags:
  - attack.execution
  - attack.t1609
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb: 'create'
    objectRef.resource: 'pods'
    objectRef.subresource:
      - 'exec'
      - 'attach'
  filter_sa:
    # Controllers and service accounts exec into pods constantly (operators, debug
    # sidecars); the tell is a *human* getting an interactive shell. Drop the
    # service-account principals so this fires on people, not automation.
    # DEPLOY-REQUIRED: additionally scope objectRef.namespace to your production
    # namespaces. Run detections/sigma/deploy-required.sh to find this.
    user.username|startswith: 'system:serviceaccount:'
  condition: selection and not filter_sa
falsepositives:
  - Routine developer/operator access in non-production namespaces, and debug
    controllers - scope objectRef.namespace to production and allowlist known human
    break-glass principals.
level: medium
