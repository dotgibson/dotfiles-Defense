title: Google Workspace illicit OAuth grant (consent phish)
id: ee3ba747-0017-46fe-83a8-1918fbbc3241
status: experimental
description: |
  Detects a third-party OAuth application being authorized in the Google Workspace token
  audit (eventName=authorize). Consent-phishing tricks a user into authorizing a malicious
  app with Gmail/Drive scopes; the resulting refresh token reads mail and files with no
  password and no MFA, surviving the user's password reset until the grant is revoked
  (T1528). Most grants are for known apps, so triage on a first-seen/low-reputation
  client_id or app_name, broad/sensitive scopes (mail.google.com, drive, gmail.readonly),
  or a burst of authorize events across users (a campaign).
  Validate (purple): authorize a scoped OAuth app from dotfiles-Kali (htpx pair
  gws-oauth-grant).
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/gws-oauth-audit.md
author: dotfiles-Defense
date: 2026-07-02
tags:
  - attack.credential_access
  - attack.t1528
logsource:
  product: google_workspace
  service: token
detection:
  selection:
    eventName: 'authorize'
  condition: selection
falsepositives:
  - Users authorizing sanctioned Marketplace apps - allowlist known client IDs and alert
    on new client IDs requesting mail/drive scopes or a burst of grants across users.
level: medium
