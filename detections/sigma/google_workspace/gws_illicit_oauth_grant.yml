title: Google Workspace illicit OAuth grant (consent phish)
id: ee3ba747-0017-46fe-83a8-1918fbbc3241
status: experimental
description: |
  Detects a third-party OAuth application being authorized in the Google Workspace token
  audit (eventName=authorize). Consent-phishing tricks a user into authorizing a malicious
  app with Gmail/Drive scopes; the resulting refresh token reads mail and files with no
  password and no MFA, surviving the user's password reset until the grant is revoked
  (T1528). Most grants are for known apps, so triage on a first-seen/low-reputation
  client_id or app_name, broad/sensitive scopes (mail.google.com, drive, gmail.readonly),
  or a burst of authorize events across users (a campaign).
  Validate (purple): authorize a scoped OAuth app from dotfiles-Offense (htpx pair
  gws-oauth-grant).
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/gws-oauth-audit.md
author: dotfiles-Defense
date: 2026-07-02
tags:
  - attack.credential-access
  - attack.t1528
logsource:
  product: google_workspace
  service: token
detection:
  selection:
    eventName: 'authorize'
  selection_scopes:
    # Scope the bare "any authorize" down to grants that hand the app high-value
    # mail/file access - the illicit-consent payoff. Firing on every authorize is the
    # noisiest benign event in the tenant (every Marketplace app connect); the abuse is
    # the refresh token to mail/drive. Mirrors the Entra rule's high-risk scope set.
    scope|contains:
      - 'mail.google.com'
      - 'auth/gmail'
      - 'auth/drive'
      - 'auth/spreadsheets'
      - 'auth/documents'
      - 'auth/contacts'
  filter_known_apps:
    # DEPLOY-REQUIRED: replace with your sanctioned OAuth client IDs so verified apps that
    # legitimately hold mail/drive scopes don't alert. Until filled this excludes only the
    # example. Run detections/sigma/deploy-required.sh to find this.
    client_id:
      - '000000000000-example.apps.googleusercontent.com'   # example client id — replace
  condition: selection and selection_scopes and not filter_known_apps
falsepositives:
  - Users authorizing sanctioned Marketplace apps - allowlist known client IDs in
    filter_known_apps and alert on new client IDs requesting mail/drive scopes or a burst
    of grants across users.
level: medium
