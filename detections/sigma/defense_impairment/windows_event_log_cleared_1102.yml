title: Windows Security audit log cleared (1102)
id: c1df047f-8b4f-4411-bd3c-f406b55c6d47
status: experimental
description: |
  Detects the Security event log being cleared: a 1102 record, which the event-log
  service writes as the FIRST entry of the now-empty log. This is the anti-forensic
  step that follows the noisy part of an intrusion - the operator has what they came
  for and is removing the record of how they got it - and it is the one action on this
  list that destroys the evidence for every other rule in the corpus at once.
  1102 is the invariant, not the tool. wevtutil cl, Clear-EventLog, Remove-EventLog,
  the Event Viewer GUI and the EvtClearLog API all produce it, so this does not depend
  on matching a binary name or a command line and cannot be evaded by renaming the
  utility or calling the API directly. That is why the event is the right selection here
  rather than a process-creation matcher on the tool names.
  Scope, stated plainly: 1102 covers the SECURITY channel only. Clearing Application,
  System, or an operational channel such as Sysmon emits 104 in the System channel
  instead - a different logsource, so a different rule (dotgibson/dotfiles-Defense#215).
  Until that sibling exists, an operator who clears Sysmon/Operational and leaves the
  Security log alone is not caught here.
  Triage on SubjectUserName and SubjectLogonId - who cleared it - and on whether a
  maintenance window or a log-rotation change explains it. Correlate against what the
  same account did in the minutes before: the cleared log is the end of a chain, and the
  surviving forwarded copy (or the SIEM's own ingested events) is where that chain still
  lives. A cleared log with no corresponding change ticket is the finding.
  Validate (purple): clear the Security log with `wevtutil cl Security` on a lab host.
  The htpx corpus has no entry for this one - its Defense Impairment entries are all
  cloud-side. Requires no audit subcategory: the event-log service writes 1102
  unconditionally when the Security log is cleared.
references:
  - https://attack.mitre.org/techniques/T1685/005/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: dotfiles-Defense
date: 2026-08-26
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Deliberate log rotation or a rebuild/imaging step that clears the Security log as
    part of host preparation. This rule ships NO filter on purpose - clearing the
    Security log is rare enough that suppressing it by actor would cost more than it
    saves, and an allowlist here is exactly what an operator would target. Triage on
    SubjectUserName and the change record instead.
level: high
