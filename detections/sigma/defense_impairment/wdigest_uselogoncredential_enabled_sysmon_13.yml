title: WDigest UseLogonCredential enabled - cleartext credential caching turned back on (Sysmon 13)
id: 1b79fc15-80e1-4b53-a57e-1eb50164a13e
status: experimental
description: |
  Detects HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential
  being set to 1. Since KB2871997 (and by default from Windows 8.1 / Server 2012 R2 on),
  WDigest no longer keeps a reversible copy of the logon password in LSASS. Setting this
  value re-enables that cache, so every interactive logon AFTER the change leaves the
  cleartext password in memory for sekurlsa::wdigest or any LSASS dump to read. It is a
  staging step: an operator who already has admin sets it, waits for a privileged user to
  log on, then dumps - which is why it is worth catching before the dump rule fires.
  Whether the cache actually comes back depends on the build: on current Windows 11 with
  Credential Guard / LSA protection the write may no longer yield cleartext. The write is
  still the operator stating intent, so it is alerted on regardless.
  The value is the invariant, not the tool: reg.exe, PowerShell Set-ItemProperty, WMI
  StdRegProv and a direct RegSetValueEx call all produce the same Sysmon 13, so nothing
  here keys on the writing process. Nothing legitimate on a supported Windows build needs
  this set to 1, which is why there is no filter; a hit is the finding.
  Data-source prerequisite: detections/sysmon/sysmonconfig-detection-lab.xml collects
  exactly this value (RegistryEvent include on \SecurityProviders\WDigest\UseLogonCredential).
  A Sysmon config without a registry include for it makes this rule silently inert.
  Setting the value to 0 (the hardening direction) is deliberately NOT matched.
references:
  - https://attack.mitre.org/techniques/T1112/
  - https://support.microsoft.com/en-us/security/microsoft-security-advisory-update-to-improve-credentials-protection-and-management-may-13-2014
  - https://research.splunk.com/endpoint/0c7d8ffe-25b1-11ec-9f39-acde48001122/
author: dotfiles-Defense
date: 2026-09-27
tags:
  # T1112 is Defense Impairment + Persistence in the pinned v19.2 bundle; this rule claims
  # only the first. Re-enabling WDigest weakens a credential protection - it establishes
  # no foothold on its own, so the persistence half would overstate it.
  - attack.defense-impairment
  - attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control\SecurityProviders\WDigest\UseLogonCredential'
    # Sysmon renders a REG_DWORD write as "DWORD (0x........)".
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
  - Legacy applications that genuinely require WDigest (HTTP Digest auth against old
    IIS / appliances) on an unsupported or unpatched build - confirm the change ticket; on a
    modern estate there is no routine reason for this value to be 1.
level: high
