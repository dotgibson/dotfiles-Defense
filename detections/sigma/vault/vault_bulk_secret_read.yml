title: Vault secret-read base - KV read on a secret/ path
id: 371f9c69-d831-4b7e-ba6c-8c2601f6cbe7
status: experimental
description: |
  Base event for the bulk-secret-read correlation below: a single KV secret read
  (request.operation=read on a secret/ path) in the Vault audit device log. Not
  actionable alone - one read is normal application automation. The exfil shape is
  one identity reading many distinct secret paths in a short window, expressed by
  the correlation rule.
references:
  - https://attack.mitre.org/techniques/T1555/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/vault-secret-read-audit.md
author: dotfiles-Defense
date: 2026-07-02
name: vault_secret_read
tags:
  - attack.credential_access
  - attack.t1555
logsource:
  product: vault
  service: audit
detection:
  selection:
    type: 'request'
    request.operation: 'read'
    request.path|startswith: 'secret/'
  condition: selection
falsepositives:
  - An application reading its own secret - the common case, filtered out by the
    distinct-path count below.
level: informational
