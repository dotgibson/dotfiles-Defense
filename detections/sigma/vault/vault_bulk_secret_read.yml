title: Vault secret-read base - KV read on a secret mount
id: 371f9c69-d831-4b7e-ba6c-8c2601f6cbe7
status: experimental
description: |
  Base event for the bulk-secret-read correlation below: a single KV secret read
  (request.operation=read on a KV mount path) in the Vault audit device log. Not
  actionable alone - one read is normal application automation. The exfil shape is
  one identity reading many distinct secret paths in a short window, expressed by
  the correlation rule.
references:
  - https://attack.mitre.org/techniques/T1555/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/vault-secret-read-audit.md
author: dotfiles-Defense
date: 2026-07-02
modified: 2026-09-28
name: vault_secret_read
tags:
  - attack.credential-access
  - attack.t1555
logsource:
  product: vault
  service: audit
detection:
  selection:
    type: 'request'
    request.operation: 'read'
    request.path|startswith:
      # DEPLOY-REQUIRED: list every KV mount in your estate. `secret/` is only the dev-server
      # and docs default; a production Vault mounts KV at kv/, per-team paths, or per-app
      # paths, and a sweep of any mount not listed here is invisible to this rule. `vault
      # secrets list -format=json` prints the mounts; keep the trailing slash so a mount named
      # `secret` does not also match `secrets-archive/`.
      - 'secret/'
  filter_secret_automation:
    # DEPLOY-REQUIRED: replace with the identities that legitimately read many secrets in one
    # window - the deploy job that hydrates an environment's config, a secrets-sync operator,
    # a batch process that walks a whole KV mount on start. These exist in most estates and
    # each one is a standing false positive at ANY threshold, because breadth is their normal
    # shape rather than an anomaly in it. Until filled this excludes only the example. Run
    # detections/sigma/deploy-required.sh to find this.
    #
    # The filter belongs HERE, on the base event, not on the correlation: raising the
    # correlation's threshold to clear your largest batch job blunts the rule for every other
    # identity, which is the trade the cloud twins refuse for the same reason.
    #
    # Keyed on auth.entity_id, which is NOT what the correlation groups by: that is
    # auth.accessor (see below). The two do different jobs. The allowlist names a standing
    # identity, and the entity id is the only stable one - it survives token renewal,
    # re-auth and a rename, where auth.display_name is a mutable label and a new token
    # brings a new accessor, so an accessor allowlist would silently stop matching. The
    # count has to include tokens with NO entity (root and orphan tokens - entity_id is
    # omitempty in the audit record), which an entity group-by drops. An allowlisted
    # entity's events never reach the correlation, so every accessor it holds is excluded
    # with it. Read the id from `vault read -format=json identity/entity/name/<name>` or
    # from the audit event itself.
    auth.entity_id:
      - '00000000-0000-0000-0000-000000000000'   # example — replace with an entity id
  condition: selection and not filter_secret_automation
falsepositives:
  - An application reading its own secret - the common case, filtered out by the
    distinct-path count below.
level: informational
---
title: HashiCorp Vault bulk secret read (credential-store exfil)
id: 40c30130-ab39-405e-8d45-92fa88224752
status: experimental
description: |
  Detects one token reading many distinct KV secret paths in a short window - the
  credential-store drain (DB creds, cloud keys, API tokens) after a Vault token is
  compromised (T1555, Credentials from Password Stores). Breadth is the signal, so
  this counts distinct paths per identity rather than firing on every read - the
  earlier single-read form matched 100% of normal application traffic and was pure
  fatigue (a muted rule is a blind spot). Counting per token beats a raw read-rate
  threshold because a healthy app re-reads its own small secret set, while an
  attacker sweeps across unrelated paths. Tune the threshold to your largest
  legitimate consumer; batch jobs that read many secrets should be allowlisted by
  entity id in filter_secret_automation on the base rule above.
  Grouped by auth.accessor, not auth.entity_id. Root tokens and orphan tokens created
  with a root or sudo policy carry no entity, and Vault omits entity_id from the audit
  record when it is empty. Grouping by entity therefore dropped exactly the tokens an
  attacker most wants: a leaked root token could sweep every secret without being
  counted. The accessor is present on every token-authenticated request. Like the other
  auth fields it is HMAC'd in the audit log by default, but the HMAC is stable per value,
  so it still groups. The cost is that an attacker who spreads a sweep across several
  tokens resets the count per token. An entity-level twin would catch that, but only
  for tokens that have an entity.
  Validate (purple): bulk-read KV secrets under one token from dotfiles-Offense
  (htpx pair vault-secret-exfil).
references:
  - https://attack.mitre.org/techniques/T1555/
correlation:
  type: value_count
  rules:
    - vault_secret_read
  group-by:
    - auth.accessor
  timespan: 10m
  condition:
    gte: 20
    field: request.path
falsepositives:
  - CI/CD or batch identities that legitimately read many secrets at once - allowlist the
    entity id in filter_secret_automation on the base rule rather than raising this
    threshold, which would blunt the rule for every other identity. The base rule carries
    that list for this purpose; until it did, this text pointed at an allowlist that did
    not exist.
  - A KV mount deliberately used as a small config store that one application reads
    wholesale on start. Baseline that entity and allowlist it; a mount holding twenty
    secrets that one identity always reads together is not the shape this rule is for.
level: high
