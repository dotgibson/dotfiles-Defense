title: npm package published by non-CI actor (supply-chain implant)
id: 505d8a0a-d8ab-4a9e-96d0-35d1ecc76aa2
status: experimental
description: |
  Detects a package publish in the npm account/org audit log (action=package.publish) by an
  actor that is not the known CI publish identity. Publishing is routine, but it should come
  from one automation identity; a publish by a human/unexpected actor, from an unusual IP, or
  a first-ever publisher on a widely-depended package is how a compromised maintainer token
  ships a trojanized version that every downstream `npm install` then runs (T1195.002). Pin
  releases to the CI identity and allowlist it; a publish right after an owner_add or a 2FA
  change is the high-signal sequence.
  Validate (purple): publish a package as a non-CI user from dotfiles-Offense (htpx pair
  npm-malicious-publish).
references:
  - https://attack.mitre.org/techniques/T1195/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/npm-publish-audit.md
author: dotfiles-Defense
date: 2026-07-03
tags:
  - attack.initial-access
  - attack.t1195.002
logsource:
  product: npm
  service: audit
detection:
  selection:
    action: 'package.publish'
  filter_ci:
    actor.type: 'ci'
  condition: selection and not filter_ci
falsepositives:
  - Releases from the sanctioned CI publish identity - allowlist that actor (filter_ci) and
    alert on any package.publish outside it, especially a first-time publisher.
level: high
