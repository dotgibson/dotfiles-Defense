title: npm maintainer or owner added (durable publish backdoor)
id: e633218d-b46d-4766-9f29-f7016897b5f7
status: experimental
description: |
  Detects a new maintainer/owner grant in the npm account/org audit log
  (action=package.owner_add or team.user_add). Adding an attacker-controlled account as a
  package owner - or to the org team that owns it - mints durable publish rights that survive
  the compromised maintainer's password reset and MFA re-enrollment, the persistent form of a
  stolen token (T1098). Ownership changes are rare and map to a known onboarding, so an
  unfamiliar account or an out-of-band grant is the tell; an owner_add followed by a publish
  is the takeover-then-ship shape.
  Validate (purple): add a maintainer via `npm owner add` from dotfiles-Kali (htpx pair
  npm-owner-add).
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/npm-owner-audit.md
author: dotfiles-Defense
date: 2026-07-03
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: npm
  service: audit
detection:
  selection:
    action:
      - 'package.owner_add'
      - 'team.user_add'
  condition: selection
falsepositives:
  - Onboarding a sanctioned collaborator - reconcile new owners against known maintainers and
    alert on unfamiliar accounts or grants made during an incident.
level: high
