title: Scheduled task created with a suspicious action
id: 8ae44ad2-6331-4444-97f4-b2eac893717c
status: experimental
description: |
  Detects scheduled-task persistence: a 4698 task-created event whose task XML runs
  encoded/hidden PowerShell or a LOLBin (mshta/regsvr32/rundll32). Detect on the action,
  not the task name; 4702 catches the modify-an-existing-task variant. Baseline your
  software's legit tasks and alert on the rest.
  Scoped to the interpreter/LOLBin shapes on purpose: bare '\Users\' and '\Temp\'
  TaskContent matches were REMOVED for the same reason service_creation_psexec_7045
  removed them from ImagePath - per-user updaters (Chrome, Edge, OneDrive, Teams) and
  third-party installers register tasks from those paths at volume, and a path match that
  common turns a high-severity rule into a mute button. If you want drop-directory
  coverage, add it as a separate lower-confidence rule gated on a task-name or
  signed-binary allowlist rather than folding it back into this OR.
  The interpreter tokens are anchored for the same reason the path matches were dropped.
  A bare 'IEX' is a 3-character case-insensitive substring against the whole task XML, so
  it matches iexplore.exe and any author/product string containing "iex"; it is written
  as 'IEX(' / 'IEX ' / '| IEX' instead. '-enc' matched '-encoding', so it carries a
  trailing space. The space is trailing only, NOT leading - '<Arguments>-enc ...' has a
  tag, not a space, in front of the flag. DownloadString and FromBase64String are left
  bare: both are specific enough to stand alone.
  Second plane, and only that. svcctl_atsvc_remote_pipe_sysmon_18.yml (id
  e9d70412-5340-436c-9917-b3664f5d77a7) sees the atsvc pipe bind that PRECEDES a remotely
  scheduled task - impacket atexec's step before this one - on Sysmon 18. It is
  corroboration, not coverage this rule lacks: it survives an estate that never forwards
  4698, but it says nothing about the task's ACTION, which is what this rule selects on.
  dotgibson/dotfiles-Defense#229.
  Validate (purple): run schtasks /create (or nxc -M schtask_as) from dotfiles-Offense
  (hacktheplanet "Persistence" fold; htpx pair schtask-persist). Requires the
  Object Access > Other Object Access Events audit subcategory.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/schtask-4698.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-29
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  suspicious:
    TaskContent|contains:
      - '-enc '
      - '-EncodedCommand'
      - '-w hidden'
      - '-WindowStyle Hidden'
      - 'FromBase64String'
      # Path-less, so `<Command>mshta</Command>` matches as well as `\mshta.exe`.
      - 'mshta'
      - '\regsvr32.exe'
      - '\rundll32.exe'
      - 'DownloadString'
      - 'IEX('
      - 'IEX '
      - '| IEX'
  powershell_task:
    TaskContent|contains:
      - 'powershell'
      - 'pwsh'
  powershell_short_flags:
    # Any abbreviation of -EncodedCommand followed by its payload. Scoped to a PowerShell
    # task. PowerShell's parser (CommandLineParameterParser) takes any prefix down to
    # `-e`/`-ec`; accepts `-`, `/` and the en dash, em dash and horizontal bar as the switch
    # character, and pwsh drops a doubled one (`--e`); and trims each argv element. Argv
    # parsing also removes quotes INSIDE a token (`-"e"c` is `-ec`) and cmd removes carets
    # anywhere (`-e^c`, `^-e`), so both are allowed between every character of the flag.
    # The payload is decoded with Convert.FromBase64String, which ignores whitespace, so it
    # is matched as 20 base64 characters that may be split by quotes or carets, OR a quoted
    # payload with whitespace inside, OR - behind a dash-type switch only, since robocopy's
    # `/E %OPTS%` is common - a variable (`%p%`, `!p!`, `$p`). Requiring a payload is what
    # keeps robocopy's `/E /R:2`, `-Encoding utf8` and a script's own short `-e prod`
    # argument out. The dashes are an alternation, not a character class, so the pattern
    # still matches if Splunk's PCRE runs in byte mode.
    # Not settled: whether character references an attacker writes into the task XML
    # (`&#32;`, `&#45;`) survive into 4698 TaskContent. If they do, they evade this; a
    # lab capture of a task registered from such XML would tell.
    # DEPLOY-REQUIRED (Elastic only): Lucene regexes match the whole term implicitly, have
    # no (?i) flag, and treat " & # ^ / < > as operators, so the generated Lucene form never
    # matches. Rewrite it in your Elastic rule as below, replacing each <TAB> with a literal
    # tab character (Lucene has no \t escape; `\t` is the letter t). TaskContent must be a
    # keyword field, and the leading `.*` with two counted branches can exceed Elasticsearch's
    # max_determinized_states - test it on your cluster before relying on it:
    #   TaskContent:/((.*[ <TAB>\>\"';(,=\^])?(\^|\"|\&quot;)*(-|\/|–|—|―)(\^|\"|\&quot;)*((-|\/|–|—|―)(\^|\"|\&quot;)*)?[eE]((\^|\"|\&quot;)*[cC]|(\^|\"|\&quot;)*[nN]((\^|\"|\&quot;)*[cC]((\^|\"|\&quot;)*[oO]((\^|\"|\&quot;)*[dD]((\^|\"|\&quot;)*[eE]((\^|\"|\&quot;)*[dD]((\^|\"|\&quot;)*[cC]((\^|\"|\&quot;)*[oO]((\^|\"|\&quot;)*[mM]((\^|\"|\&quot;)*[mM]((\^|\"|\&quot;)*[aA]((\^|\"|\&quot;)*[nN]((\^|\"|\&quot;)*[dD])?)?)?)?)?)?)?)?)?)?)?)?)?(\&quot;|\&apos;|[\"'\^])*([ <TAB>]|\&\#[xX]?9;)+(((\&quot;|\&apos;|[\"'\^])*[A-Za-z0-9+\/]){20}|(\&quot;|\")(([ <TAB>]|(\&quot;|\&apos;|[\"'\^]))*[A-Za-z0-9+\/]){20})|(.*[ <TAB>\>\"';(,=\^])?(\^|\"|\&quot;)*(-|–|—|―)(\^|\"|\&quot;)*((-|–|—|―)(\^|\"|\&quot;)*)?[eE]((\^|\"|\&quot;)*[cC]|(\^|\"|\&quot;)*[nN]((\^|\"|\&quot;)*[cC]((\^|\"|\&quot;)*[oO]((\^|\"|\&quot;)*[dD]((\^|\"|\&quot;)*[eE]((\^|\"|\&quot;)*[dD]((\^|\"|\&quot;)*[cC]((\^|\"|\&quot;)*[oO]((\^|\"|\&quot;)*[mM]((\^|\"|\&quot;)*[mM]((\^|\"|\&quot;)*[aA]((\^|\"|\&quot;)*[nN]((\^|\"|\&quot;)*[dD])?)?)?)?)?)?)?)?)?)?)?)?)?(\&quot;|\&apos;|[\"'\^])*([ <TAB>]|\&\#[xX]?9;)+(\&quot;|\&apos;|[\"'\^])*[%!$]).*/
    # Splunk and Sentinel take the pattern as written; gen-siem.sh gives the Splunk form
    # the base search the backend omits.
    TaskContent|re: '(?i)((^|[\s>"'';(,=^])(\^|"|&quot;)*(-|/|–|—|―)(\^|"|&quot;)*((-|/|–|—|―)(\^|"|&quot;)*)?e((\^|"|&quot;)*c|(\^|"|&quot;)*n((\^|"|&quot;)*c((\^|"|&quot;)*o((\^|"|&quot;)*d((\^|"|&quot;)*e((\^|"|&quot;)*d((\^|"|&quot;)*c((\^|"|&quot;)*o((\^|"|&quot;)*m((\^|"|&quot;)*m((\^|"|&quot;)*a((\^|"|&quot;)*n((\^|"|&quot;)*d)?)?)?)?)?)?)?)?)?)?)?)?)?(&quot;|&apos;|["''^])*(\s|&#x?9;)+(((&quot;|&apos;|["''^])*[A-Za-z0-9+/]){20}|(&quot;|")((\s|(&quot;|&apos;|["''^]))*[A-Za-z0-9+/]){20})|(^|[\s>"'';(,=^])(\^|"|&quot;)*(-|–|—|―)(\^|"|&quot;)*((-|–|—|―)(\^|"|&quot;)*)?e((\^|"|&quot;)*c|(\^|"|&quot;)*n((\^|"|&quot;)*c((\^|"|&quot;)*o((\^|"|&quot;)*d((\^|"|&quot;)*e((\^|"|&quot;)*d((\^|"|&quot;)*c((\^|"|&quot;)*o((\^|"|&quot;)*m((\^|"|&quot;)*m((\^|"|&quot;)*a((\^|"|&quot;)*n((\^|"|&quot;)*d)?)?)?)?)?)?)?)?)?)?)?)?)?(&quot;|&apos;|["''^])*(\s|&#x?9;)+(&quot;|&apos;|["''^])*[%!$])'
  powershell_window_flags:
    TaskContent|contains:
      - '-w 1'
      - '-win h'
  impacket_atexec:
    # impacket examples/atexec.py registers <Command>cmd.exe</Command> with
    # <Arguments>/C <cmd> > %windir%\Temp\<8 letters>.tmp 2>&1</Arguments> as S-1-5-18.
    # 4698 carries TaskContent as XML text, so the redirect arrives entity-escaped.
    # `-silentcommand` drops the redirect and is not caught here.
    TaskContent|contains|all:
      - '<Command>cmd.exe</Command>'
      - '/C '
      - '\Temp\'
      - '.tmp 2&gt;&amp;1'
  condition: selection and (suspicious or (powershell_task and 1 of powershell_*_flags) or impacket_atexec)
falsepositives:
  - Software installers that register tasks invoking helper scripts (allowlist).
  - A PowerShell task passing its own script a long `-e` value that looks like base64 (for
    example `deploy.ps1 -e ProductionWestEurope01`, or `wsl -e /usr/local/bin/...`).
    Allowlist the task.
  - A PowerShell task passing its own script a variable after a dash-type `-e` (for
    example `-e $env:STAGE`) matches the variable arm. Allowlist the task.
level: high
