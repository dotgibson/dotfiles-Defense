title: Rogue account creation (4720)
id: 7394f3ba-a17c-47eb-8b74-9fb709d0283f
status: experimental
description: |
  Detects account-creation persistence: a 4720 user-account-created event. After
  gaining privilege, an operator often creates a fresh account (frequently paired
  with 4722, account-enabled, and a 4728/4732 privileged-group add) to hold access
  independent of the compromised credential. On a domain controller this is a domain
  account (T1136.002); on a member host it is a local account (T1136.001). Detect on
  the creation itself and baseline your provisioning path - where accounts are made
  by IAM/JML automation, allowlist that pipeline so operator-driven creations stand
  out. Correlate with the 4728/4732 group-add and the creator's SubjectUserName for
  triage: a new account created by an unexpected principal, then promoted, is the
  high-confidence shape.
  Validate (purple): run net user /add (or nxc -x "net user ...") from dotfiles-Offense
  (hacktheplanet "Persistence" fold; PURPLE-TEAM rogue-account row). Requires the
  Account Management > User Account Management audit subcategory.
references:
  - https://attack.mitre.org/techniques/T1136/002/
  - https://attack.mitre.org/techniques/T1136/001/
author: dotfiles-Defense
date: 2026-07-15
tags:
  - attack.persistence
  - attack.t1136.002
  - attack.t1136.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4720
  filter_provisioning:
    # DEPLOY-REQUIRED: replace with the accounts your IAM / joiner-mover-leaver automation
    # and helpdesk provisioning create users as. Account creation is continuous in any
    # organization with a JML process, so without this the rule alerts on routine
    # onboarding; what's left after it is operator-driven creation. Until filled this
    # excludes only the example. Run detections/sigma/deploy-required.sh to find this.
    SubjectUserName:
      - 'svc_iam_provisioning'   # example — replace with your provisioning principals
  condition: selection and not filter_provisioning
falsepositives:
  - IAM / joiner-mover-leaver automation and helpdesk provisioning create accounts
    routinely - allowlist the provisioning principals in filter_provisioning and alert
    on the rest.
level: medium
