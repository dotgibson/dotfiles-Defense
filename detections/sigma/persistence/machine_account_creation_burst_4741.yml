title: Computer-account-created base (4741)
id: 5eef34a1-04b5-4e2b-9128-ff4801932813
status: experimental
description: |
  Base event for the machine-account-burst correlation below: a 4741 computer
  account created. Not actionable alone - domain-join and provisioning create
  computer accounts routinely. The abuse shape is one non-provisioning principal
  minting several machine accounts in a short window (MachineAccountQuota lets any
  authenticated user create up to 10 by default), expressed by the correlation rule.
references:
  - https://attack.mitre.org/techniques/T1136/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/rbcd-5136.md
author: dotfiles-Defense
date: 2026-07-15
name: computer_account_created_4741
tags:
  - attack.persistence
  - attack.t1136.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4741
  condition: selection
falsepositives:
  - Bulk domain-join / imaging runs (allowlist the provisioning account or host).
level: informational
