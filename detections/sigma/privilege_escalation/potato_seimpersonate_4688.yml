title: Potato privesc - service identity spawning an interactive shell (Security 4688)
id: 9486ed6c-4c38-457f-a475-188a978eaa4a
status: experimental
description: |
  Detection posture: moderate. SeImpersonate abuse (PrintSpoofer/GodPotato/Juicy)
  uses a legitimate impersonation API, and 4688 alone cannot show the run-as-SYSTEM
  result. This flags the shape it can see - a service identity (app-pool /
  NETWORK|LOCAL SERVICE) spawning cmd/powershell. Confirm the SYSTEM
  outcome with token_theft_process_target_subject_4688.yml (id
  1faa7a59-9fd5-4d14-9bf1-d94f82466acb), which reads the Target Subject block on this
  same event and so shows the stolen token directly rather than the shape around it -
  a host already forwarding for this rule needs no new ingestion to deploy it - or with
  spoolss_pipe_impersonation_sysmon_17.yml (id
  d5c5c185-a62f-415a-ab0f-2572f910b541), which detects the impersonation
  itself on Sysmon 17, and with Sysmon 1 linking the service parent to a SYSTEM
  child.
  Channel: native Security-4688 carries the CREATOR's account in SubjectUserName -
  "the name of the account that requested the 'create process' operation", per
  Microsoft. Its Sysmon-plane counterpart is potato_seimpersonate_sysmon_1.yml (id
  03e878f6-bbdc-41e1-afa6-68b2979938fe), which used to be described here as this
  rule's twin keyed on User. It is not, and the correction is
  dotgibson/dotfiles-Defense#239: Sysmon 1 User is the CREATED process, not the
  creator, so on a successful potato that rule went silent at the moment this one
  fired - measured silent on all six real potato captures in
  sbousseaden/EVTX-ATTACK-SAMPLES. It now selects ParentUser, which is the Sysmon
  expression of what SubjectUserName says here. The two are still split per channel,
  for the reason that forced the split originally - a single rule naming a field from
  each resolves under only one pysigma pipeline, and the pipeline that can't resolve
  one drops the whole rule, so it silently never fires - but they are two different
  invariants covering one technique rather than one shape on two channels. Deploy
  both; whichever channel your hosts forward will match. Note the Sysmon half now
  needs an agent at version 13 or later, which this rule does not.
  UNCONFIRMED ON A REAL POTATO. This rule has never been shown to fire on one. No
  capture available to us carries a Security 4688 from a potato at all, let alone one
  whose SubjectUserName is an app pool, so its fixture proves only that it fires on the
  event shape we believe in - and the shape rests on the same Creator-Subject reading
  that token_theft_process_target_subject_4688.yml flags as its one open assumption. If
  the audit reads the impersonating THREAD token rather than the calling process's,
  SubjectUserName arrives as SYSTEM and this rule is silent too. Tracked in
  docker/validation/labruns/runbook-potato-seimpersonate.md.
  Validate (purple): run PrintSpoofer/GodPotato from dotfiles-Offense (hacktheplanet
  "Windows privilege escalation" fold; htpx pair potato-seimpersonate).
references:
  - https://attack.mitre.org/techniques/T1134/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/potato-seimpersonate-4688.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-08-30
tags:
  # T1134.001 is dual-tactic in ATT&CK v19 — TA0004 and TA0005 (Stealth) — and only the
  # TA0004 half is claimed here. That is deliberate, not an oversight
  # (dotgibson/dotfiles-Defense#223, reaffirmed in #225).
  # What this rule selects is a service identity spawning a shell: the shape BEFORE the
  # token is stolen, keyed on the un-masked SubjectUserName. Nothing in it observes the
  # impersonation itself, which is the part TA0005 is about — and the description above
  # already concedes the rule cannot see the run-as-SYSTEM result. Claiming the Stealth
  # half would add a COVERAGE.md row that THIS rule does not earn. The TA0005 half of
  # T1134.001 is claimed instead by spoolss_pipe_impersonation_sysmon_17.yml, which
  # observes the pipe the impersonation cannot avoid standing up - the evasion itself -
  # dotgibson/dotfiles-Defense#225 settled that it belongs there rather than here.
  # Deliberately NOT writing the tag string in this comment: gen-coverage.sh matches
  # tactic slugs over the whole file, so naming it here would tag the rule by accident.
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_svc_identity:
    SubjectUserName|contains:
      - 'APPPOOL'
      - 'NETWORK SERVICE'
      - 'LOCAL SERVICE'
  condition: selection_shell and selection_svc_identity
falsepositives:
  - Service accounts that legitimately shell out (scripts, monitoring) - baseline
    per host and allowlist the known parent/child pairs.
level: medium
