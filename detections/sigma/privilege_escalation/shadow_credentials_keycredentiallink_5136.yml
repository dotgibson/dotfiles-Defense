title: Shadow Credentials - msDS-KeyCredentialLink write
id: 97ee214e-8e8a-4bee-bb1e-88ae6a40d782
status: experimental
description: |
  Detects Shadow Credentials: a 5136 directory-object-modified event writing the
  msDS-KeyCredentialLink attribute. The attack must write this attribute to add an
  attacker-controlled key for PKINIT, so the write is the invariant. Almost nothing
  legitimately writes it except Windows Hello for Business enrollment - allowlist
  those sources and alert on the rest.
  Validate (purple): run "certipy-ad shadow auto" from dotfiles-Offense (hacktheplanet
  "Active Directory - attack paths" fold; htpx pair shadow-credentials-certipy).
  Requires the Directory Service Changes audit subcategory + a SACL on the objects.
  The allowlist the description has always prescribed is now a filter block rather
  than advice, the same shape as rbcd_allowedtoact_5136's. What it can and cannot
  express: in a hybrid key-trust deployment the writer is the Entra Connect sync
  account (MSOL_<hex> by default), a principal, so it allowlists cleanly. In on-prem
  key-trust and cert-trust the DC writes the key on the user's own behalf, so the
  Subject IS the object - a self-write - and Sigma has no way to say "SubjectUserName
  equals the object's sAMAccountName". That comparison belongs in the SIEM query on
  top of this rule; without it, on-prem enrollment alerts and is triaged as
  Subject == object. The attack never looks like that: certipy writes as the
  principal holding GenericWrite over the victim, which is a different account.
references:
  - https://attack.mitre.org/techniques/T1556/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/shadow-credentials-5136.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-02
tags:
  - attack.credential-access
  - attack.persistence
  - attack.t1556
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: 'msDS-KeyCredentialLink'
  filter_whfb:
    # DEPLOY-REQUIRED: replace with the principals that legitimately write
    # msDS-KeyCredentialLink in your forest - the Entra Connect sync account for hybrid
    # key-trust (MSOL_<hex> unless renamed), and any device-registration or PKI
    # service account. Until filled this excludes only the MSOL_ prefix, so on-prem
    # self-enrollment and any renamed sync account still alert. Run
    # detections/sigma/deploy-required.sh to find this.
    SubjectUserName|startswith:
      - 'MSOL_'      # example — the default Entra Connect sync-account prefix; replace
  condition: selection and not filter_whfb
falsepositives:
  - Windows Hello for Business / passwordless enrollment - allowlist the Entra Connect
    sync account and the device-registration / PKI service principals in filter_whfb;
    on-prem self-enrollment (Subject == object) needs a SIEM-side comparison this rule
    cannot express and is otherwise triaged by that equality.
level: high
