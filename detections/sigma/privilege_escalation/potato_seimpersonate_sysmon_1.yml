title: Potato privesc - service identity spawning an interactive shell (Sysmon 1)
id: 03e878f6-bbdc-41e1-afa6-68b2979938fe
status: experimental
description: |
  Detection posture: moderate. SeImpersonate abuse (PrintSpoofer/GodPotato/Juicy)
  uses a legitimate impersonation API, and process-creation alone cannot show the
  run-as-SYSTEM result. This flags the shape it can see - a service identity
  (app-pool / NETWORK|LOCAL SERVICE) spawning cmd/powershell.
  Confirm the SYSTEM outcome with spoolss_pipe_impersonation_sysmon_17.yml (id
  d5c5c185-a62f-415a-ab0f-2572f910b541), which detects the impersonation
  itself on Sysmon 17, and with Sysmon 1 linking the service parent to a SYSTEM
  child. On the Security channel, token_theft_process_target_subject_4688.yml (id
  1faa7a59-9fd5-4d14-9bf1-d94f82466acb) reads the stolen token directly off 4688's
  Target Subject block; there is no Sysmon equivalent of those fields, so that exact
  confirmation is not available to a host forwarding only Sysmon. The nearest one that is,
  and it is a close one, is token_theft_parent_child_mismatch_sysmon_1.yml (id
  b7f135f0-c066-4b0b-ac45-3f6bb433be38), which reads the same EventID 1 this rule does and
  fires when the child is SYSTEM and the creator is not - the outcome this rule can only
  point at. It carries no Image constraint, so it also covers the payloads the shell list
  below misses.
  Channel: Sysmon EventID 1 carries the CREATOR in ParentUser, and the rule keys on that.
  It used to key on User, which is the wrong field and was the defect
  dotgibson/dotfiles-Defense#239 found: User is the account of the NEW process, not of the
  account that created it. On an ordinary service-spawns-shell event the two agree, so the
  rule looked correct; on a successful potato they diverge - which is what the technique IS -
  and the rule went silent at the moment it was supposed to fire. That is measured, not
  reasoned: across six real potato captures on four hosts (RogueWinRM, NetworkServiceExploit,
  RottenPotato-from-webshell, EfsPotato, RoguePotato, PrintSpoofer) the child is
  NT AUTHORITY\SYSTEM every time, the creator stays LOCAL SERVICE / NETWORK SERVICE /
  IIS APPPOOL wherever the tool was run from a service context, and the User-keyed rule fired
  on none of the six. See docker/validation/labruns/2026-08-potato-sysmon1-user-semantics.md.
  The field semantics themselves are settled on a cross-channel join rather than on the potato
  captures alone: one sample carries both a Sysmon 1 and a Security 4688 for the same process
  creation, and there Sysmon's User matches 4688's TARGET (the new process) while its LogonId
  matches TargetLogonId rather than SubjectLogonId - a numeric identifier carried independently
  on both channels, so it cannot be read as a rendering difference.
  Why the parent is the right thing to key on, which was not obvious. CreateProcessWithTokenW
  needs only SeImpersonate - which is why this whole family exists - and it is serviced by the
  Secondary Logon service in svchost.exe, so had seclogon created the process rather than the
  tool, ParentUser would read NT AUTHORITY\SYSTEM and this rule would be inert. Measured across
  all six captures, the escalated process's parent is the tool itself, under the service
  identity, with no reparenting.
  ONE DERIVATION, STATED. ParentUser has never been observed on a real potato: every one of the
  six captures predates Sysmon 13, so the run record derives the value from the parent process's
  own captured User in the same log. That derivation is well grounded - the parent is the tool,
  and the tool's own identity is captured - but it is a derivation, and the first-party
  confirmation is tracked in docker/validation/labruns/runbook-potato-seimpersonate.md.
  This is the Sysmon half of a per-channel pair - its Security-4688 twin is
  potato_seimpersonate_4688.yml (id 9486ed6c-4c38-457f-a475-188a978eaa4a), whose
  SubjectUserName is the creator and so is ParentUser's exact counterpart, which is what makes
  the two a pair rather than two rules about one technique. The split is on purpose, though not for the
  reason this rule used to give. It claimed a single rule naming both fields would null under
  any single pipeline, the pipeline dropping the whole rule. Measured with the CI pins, that is
  false: such a rule compiles under both pipelines, the unresolvable field passed through
  unmapped, and an OR of the two field sets fires correctly on each channel. What actually
  makes one rule insufficient is that the logsource resolves to ONE EventID per pipeline -
  category: process_creation becomes EventID 1 under sysmon and 4688 under windows-audit,
  whichever of these two rules you compile - so a single rule compiled once covers a single
  channel no matter which fields it names, and you would deploy it twice regardless. Two
  rules, each naming only its own channel's field, is the same coverage with no dead predicate
  evaluated against every event, and each is honest about the telemetry it needs.
  Deploy both; whichever channel your hosts forward will match.
  Validate (purple): run PrintSpoofer/GodPotato from dotfiles-Offense (hacktheplanet
  "Windows privilege escalation" fold; htpx pair potato-seimpersonate).
references:
  - https://attack.mitre.org/techniques/T1134/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/potato-seimpersonate-4688.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-08-30
tags:
  # T1134.001 is dual-tactic in ATT&CK v19 — TA0004 and TA0005 (Stealth) — and only the
  # TA0004 half is claimed here. That is deliberate, not an oversight
  # (dotgibson/dotfiles-Defense#223, reaffirmed in #225).
  # What this rule selects is a service identity spawning a shell: the shape BEFORE the
  # token is stolen, keyed on the creator's un-masked ParentUser. Nothing in it observes the
  # impersonation itself, which is the part TA0005 is about — and the description above
  # already concedes the rule cannot see the run-as-SYSTEM result. Claiming the Stealth
  # half would add a COVERAGE.md row that THIS rule does not earn. The TA0005 half of
  # T1134.001 is claimed instead by spoolss_pipe_impersonation_sysmon_17.yml, which
  # observes the pipe the impersonation cannot avoid standing up - the evasion itself -
  # dotgibson/dotfiles-Defense#225 settled that it belongs there rather than here.
  # Deliberately NOT writing the tag string in this comment: gen-coverage.sh matches
  # tactic slugs over the whole file, so naming it here would tag the rule by accident.
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_svc_identity:
    ParentUser|contains:
      - 'APPPOOL'
      - 'NETWORK SERVICE'
      - 'LOCAL SERVICE'
  condition: selection_shell and selection_svc_identity
falsepositives:
  - Service accounts that legitimately shell out (scripts, monitoring) - baseline
    per host and allowlist the known parent/child pairs.
  - ParentUser requires Sysmon 13.00 or later. On an older build the field is absent entirely
    and the selection is silently unsatisfiable rather than noisy, so this rule's silence on
    such a host is not evidence of absence - verify against a real Sysmon 1 before trusting it.
    This is measured rather than assumed - of 147 Sysmon-1 records swept across the pinned
    EVTX corpus, only the one from a 2022 host carries ParentUser at all. The shipped
    detections/sysmon/sysmonconfig-detection-lab.xml is schemaversion 4.90 (Sysmon 15.x) and
    captures all ProcessCreate, so a lab endpoint emits it.
level: medium
