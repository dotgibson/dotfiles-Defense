title: Potato privesc - service identity spawning an interactive shell (Sysmon 1)
id: 03e878f6-bbdc-41e1-afa6-68b2979938fe
status: experimental
description: |
  Detection posture: moderate. SeImpersonate abuse (PrintSpoofer/GodPotato/Juicy)
  uses a legitimate impersonation API, and process-creation alone cannot show the
  run-as-SYSTEM result. This flags the shape it can see - a service identity
  (app-pool / machine account / NETWORK|LOCAL SERVICE) spawning cmd/powershell.
  Confirm the SYSTEM outcome with Sysmon 17/18 on the spoolss/DCOM named pipe and
  Sysmon 1 linking the service parent to a SYSTEM child.
  Channel: Sysmon EventID 1 carries the account in User. This is the Sysmon half of a
  per-channel pair - its Security-4688 twin (field SubjectUserName) is
  potato_seimpersonate_4688.yml (id 9486ed6c-4c38-457f-a475-188a978eaa4a). The two are
  split on purpose: a single rule naming both User and SubjectUserName nulls under any
  single pysigma pipeline (the pipeline that can't resolve one field drops the whole
  rule), so it silently never fires. Deploy both; whichever channel your hosts forward
  will match.
  Validate (purple): run PrintSpoofer/GodPotato from dotfiles-Offense (hacktheplanet
  "Windows privilege escalation" fold; htpx pair potato-seimpersonate).
references:
  - https://attack.mitre.org/techniques/T1134/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/potato-seimpersonate-4688.md
author: dotfiles-Defense
date: 2026-06-30
tags:
  # T1134.001 is dual-tactic in ATT&CK v19 — TA0004 and TA0005 (Stealth) — and only the
  # TA0004 half is claimed here. That is deliberate, not an oversight (dotgibson/dotfiles-Defense#223).
  # What this rule selects is a service identity spawning a shell: the shape BEFORE the
  # token is stolen, keyed on the un-masked User. Nothing in it observes the
  # impersonation itself, which is the part TA0005 is about — and the description above
  # already concedes the rule cannot see the run-as-SYSTEM result. Claiming the Stealth
  # half would add a COVERAGE.md row that no detection here earns, and TA0005 is exactly
  # the thin row /coverage-gap would otherwise rank. Deliberately NOT writing the tag
  # string in this comment: gen-coverage.sh matches tactic slugs over the whole file, so
  # naming it here would tag the rule by accident.
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_svc_identity:
    User|contains:
      - 'APPPOOL'
      - 'NETWORK SERVICE'
      - 'LOCAL SERVICE'
  condition: selection_shell and selection_svc_identity
falsepositives:
  - Service accounts that legitimately shell out (scripts, monitoring) - baseline
    per host and allowlist the known parent/child pairs.
level: medium
