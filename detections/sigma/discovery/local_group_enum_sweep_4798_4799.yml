title: Local SAM enumeration base - local group membership was enumerated
id: 4f5bc3d2-cbb2-4ff6-a6a8-4c0a1b443e2a
status: experimental
description: |
  Base event for the SAM-sweep correlation below: Windows recording that something
  enumerated local group membership. 4798 is a USER's local group membership
  (NetUserGetLocalGroups); 4799 is a security-enabled LOCAL GROUP's membership
  (NetLocalGroupGetMembers, the SAM-R call behind `net localgroup administrators` and
  SharpHound's LocalGroup/LocalAdmin collection). Not actionable alone - a logon, an
  inventory agent, or an admin checking one box all produce these.
  Why this rule exists next to host_recon_command_burst, which already matches
  `net ... localgroup` on the command line: this is the SAME attacker question asked
  through a DIFFERENT telemetry path. An operator enumerating local admins in-process
  over SAM-R - which is what SharpHound does by default - writes no process-creation
  event at all, so the command-line rule never sees it and this one does. That is also
  the point structurally: nine Discovery techniques used to rest on process creation
  alone, so a tuned-out 4688 policy or an EDR-blind host took the whole tactic with it.
  Ingestion: 4798 rides Audit User Account Management (already required by
  rogue_account_creation_4720 and account_access_removal_4725). 4799 additionally needs
  Audit Security Group Management (Success). That is a GPO subcategory toggle, not a
  volume decision.
references:
  - https://attack.mitre.org/techniques/T1087/001/
  - https://attack.mitre.org/techniques/T1069/001/
author: dotfiles-Defense
date: 2026-08-13
name: local_sam_enum
tags:
  - attack.discovery
  - attack.t1069.001
  - attack.t1087.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4798 # a user's local group membership was enumerated
      - 4799 # a security-enabled local group membership was enumerated
  filter_machine_subject:
    # Machine accounts enumerate their own local groups as routine housekeeping.
    SubjectUserName|endswith: '$'
  filter_system:
    # LocalSystem does this on every interactive logon.
    SubjectUserSid: 'S-1-5-18'
  filter_sweep_principals:
    # DEPLOY-REQUIRED: replace with the inventory, EDR, and vulnerability-scan principals
    # that enumerate local SAM across the estate by design - they are the only benign
    # source that produces the multi-host FAN-OUT the correlation below keys on, so this
    # list is what keeps the rule sharp rather than what keeps it quiet. Ordinary local
    # noise (an agent checking Administrators on its own box) cannot reach the threshold
    # no matter how loud it is, because the count is over distinct hosts. Run
    # detections/sigma/deploy-required.sh to find this.
    SubjectUserName:
      - 'svc_inventory' # example — replace with your asset-inventory principal
      - 'svc_scanner'   # example — replace with your vuln-scan principal
  condition: selection and not 1 of filter_*
falsepositives:
  - Any single local group check by a logon, an agent, or an administrator - defeated by
    the distinct-host count below.
level: informational
