title: Kerberos username enumeration - one source, many unknown principals (4768 0x6)
id: fb124d77-9e40-4f36-b1da-df45c138a5df
status: experimental
description: |
  Detects one client address requesting TGTs for many distinct names that do not exist
  (4768 status 0x6) - the kerbrute userenum / GetNPUsers-with-a-user-list sweep. This is the
  enumeration that asrep_roast_probing_4771.yml used to claim; 4771 0x18 is a wrong
  password and belongs to the spray. Ten unknown names from one source in ten minutes is
  not a typo.
  Validate (purple): run "kerbrute userenum" or GetNPUsers with a user list from
  dotfiles-Offense (hacktheplanet "Microsoft Windows Kerberos" fold; htpx pair
  asreproast-getnpusers).
references:
  - https://attack.mitre.org/techniques/T1087/002/
correlation:
  type: value_count
  rules:
    - kerb_tgt_unknown_principal_4768
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    gte: 10
    field: TargetUserName
falsepositives:
  - An application or SSO appliance misconfigured with a list of stale usernames (it
    repeats the same names; allowlist its address).
  - A shared NAT egress collapsing many users behind one address.
level: medium
