title: BloodHound / SharpHound directory enumeration sweep (4662)
id: 9c4e7d21-3a5b-42f0-8e6d-1b0a4f7c9e33
status: experimental
description: |
  Detects one principal accessing many distinct directory objects in a short
  window - the SharpHound/BloodHound collection fingerprint. Counting distinct
  objects per principal beats a raw 4662-rate threshold because the sweep is a
  broad fan-out over users, groups, computers, and ACLs rather than repeated hits
  on one object. Tune the threshold to your directory size and audit SACL scope;
  a small directory or a broad SACL both shift the normal baseline.
  Validate (purple): run SharpHound / bloodhound-python from dotfiles-Offense
  (hacktheplanet "Active Directory enumeration" fold; htpx pair bloodhound-collect).
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
correlation:
  type: value_count
  rules:
    - dir_object_access_4662
  group-by:
    - SubjectUserName
  timespan: 10m
  condition:
    gte: 100
    field: ObjectName
falsepositives:
  - Admin tooling that legitimately enumerates the directory (AD reporting, IAM
    reconciliation) - allowlist the principal or raise the threshold per host.
level: high
