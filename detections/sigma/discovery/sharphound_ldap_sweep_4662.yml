title: Directory object sweep base - 4662 access by a non-machine principal
id: 2f8b1c74-6d0a-4e2b-9a1c-7c3f9e5b21aa
status: experimental
description: |
  Base event for the SharpHound/BloodHound collection correlation below: a 4662
  directory-access event from an interactive (non-machine, non-SYSTEM) principal.
  One directory read is normal; a single principal touching hundreds of distinct
  objects in minutes is the enumeration sweep, expressed by the correlation rule.
  Machine accounts and SYSTEM are filtered out here - normal replication and
  service traffic are exactly the high-volume 4662 noise this base must exclude so
  the count reflects operator-driven collection.
  Requires the Directory Service Access audit subcategory + a SACL on the objects
  (or the domain head) granting read auditing; without it 4662 is not emitted.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/bloodhound-collect-4662.md
author: dotfiles-Defense
date: 2026-07-08
name: dir_object_access_4662
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1069.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
  filter_machine_accounts:
    SubjectUserName|endswith: '$'
  filter_system:
    SubjectUserSid: 'S-1-5-18'
  condition: selection and not 1 of filter_*
falsepositives:
  - Directory-sync / IAM service accounts run under a user identity (allowlist by SID).
level: informational
