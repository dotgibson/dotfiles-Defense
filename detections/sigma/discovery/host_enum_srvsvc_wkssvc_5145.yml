title: Host enumeration base - IPC$ access to the srvsvc / wkssvc pipes
id: 700bdb9b-d1d2-49d0-b6e9-2e2cbb7d5fbd
status: experimental
description: |
  Base event for the host-enumeration sweep below: a 5145 detailed-file-share check
  against the srvsvc or wkssvc named pipe over IPC$. Those two pipes are the RPC
  transport for the classic Windows enumeration calls - srvsvc carries NetShareEnum
  (shares) and NetSessionEnum (who is connected), wkssvc carries NetWkstaUserEnum (who
  is logged on). Not actionable alone: opening one file server's IPC$ is what happens
  when a user browses a share.
  Scope boundary vs the other 5145 rules in this corpus, stated so nobody "consolidates"
  them later: coercion_named_pipes_5145 keys on spoolss/efsrpc/lsarpc/netlogon/lsass
  (coercion, T1187) and dpapi_backupkey_5145 keys on protected_storage (T1555-
  adjacent credential theft). The pipe sets are DISJOINT - same event ID, different
  RPC interface, different technique. Splitting on the pipe is the whole point.
  Costs no new ingestion: Detailed File Share auditing (5145) is already a prerequisite
  of the two rules above, so this rides a feed the corpus already assumes.
references:
  - https://attack.mitre.org/techniques/T1135/
  - https://attack.mitre.org/techniques/T1049/
  - https://attack.mitre.org/techniques/T1033/
author: dotfiles-Defense
date: 2026-08-13
name: share_session_enum_5145
tags:
  - attack.discovery
  - attack.t1033
  - attack.t1049
  - attack.t1135
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains: 'IPC$'
    RelativeTargetName|contains:
      - 'srvsvc' # NetShareEnum (T1135), NetSessionEnum (T1049)
      - 'wkssvc' # NetWkstaUserEnum (T1033)
  filter_machine_subject:
    # Domain members bind these pipes to each other as routine business.
    SubjectUserName|endswith: '$'
  filter_sweep_principals:
    # DEPLOY-REQUIRED: replace with the backup, monitoring, and file-server-inventory
    # principals that enumerate shares and sessions estate-wide by design. As with the
    # local-SAM rule, only a multi-host sweeper can reach the threshold below, so this
    # list is aimed at exactly those. Run detections/sigma/deploy-required.sh to find it.
    SubjectUserName:
      - 'svc_backup'     # example — replace with your backup principal
      - 'svc_monitoring' # example — replace with your monitoring principal
  condition: selection and not 1 of filter_*
falsepositives:
  - A user or admin browsing one file server - defeated by the distinct-host count below.
level: informational
