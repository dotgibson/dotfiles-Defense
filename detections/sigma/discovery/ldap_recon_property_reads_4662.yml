title: Targeted LDAP recon - property reads across many objects (4662 fallback)
id: 319b4608-2e52-47b2-8b58-d669dcfbb087
status: experimental
description: |
  Fallback for ldap_recon_search_filter_1644.yml, for directories where 1644 is not
  collected: one principal reading servicePrincipalName / userAccountControl on many
  distinct objects in a short window. A Kerberoast or AS-REP-roast candidate search
  touches every user object's SPN or UAC property once, which is the fan-out this
  counts. It is deliberately labelled the noisier arm: it depends on a Directory
  Service Access SACL that many domains do not set, and it cannot tell a targeted
  filter from the same properties read as part of a broader sweep - so where both
  fire, sharphound_ldap_sweep_4662.yml already names the collection and this adds
  the "which properties" signal.
  The threshold is lower than the SharpHound sweep's (50 objects in 5m vs 100 in
  10m) because the selection is narrower - only these two properties - and a small
  domain's full user set is often under 100. Tune to directory size.
  It is a separate file from the 1644 rule on purpose: the Sentinel / Elastic deploy
  forms cannot express a Sigma correlation and mark the whole FILE unsupported, which
  would have taken the primary arm down with it.
  Validate (purple): the same targeted filters as the 1644 arm from dotfiles-Offense
  (hacktheplanet AD enumeration fold; htpx pair ldap-recon-4662), on a DC with the
  read SACL in place.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/ldap-recon-4662.md
correlation:
  type: value_count
  rules:
    - ldap_recon_property_read_4662
  group-by:
    - SubjectUserName
  timespan: 5m
  condition:
    gte: 50
    field: ObjectName
falsepositives:
  - Admin tooling that legitimately reads SPN / UAC across the directory (SPN
    management scripts, delegation audits, IAM reconciliation) - allowlist the
    principal or raise the threshold per directory size.
level: medium
