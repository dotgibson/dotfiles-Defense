title: Recon property read base - 4662 on servicePrincipalName / userAccountControl
id: 3c17c18b-048f-440f-966a-da9e1c4dd74e
status: experimental
description: |
  Base event for the 4662 fallback correlation below (the fallback arm of
  ldap_recon_search_filter_1644.yml): a non-machine, non-SYSTEM
  principal reading the servicePrincipalName or userAccountControl property of a
  directory object. These are the properties the targeted LDAP filters in the 1644 rule read
  one layer down, so where 1644 is not collected the same intent shows up as many
  distinct objects having exactly these properties read in a short window. One
  read is normal; the correlation counts distinct objects per principal.
  Machine accounts and SYSTEM are filtered so replication and DC service traffic do
  not dominate the count.
  Requires the Directory Service Access audit subcategory plus a SACL granting read
  auditing on user objects (or the domain head); without it 4662 is not emitted.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/ldap-recon-4662.md
author: dotfiles-Defense
date: 2026-09-09
name: ldap_recon_property_read_4662
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1069.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
      - '28630ebc-41d5-11d1-a9c1-0000f80367c1'   # servicePrincipalName
      - 'bf967a68-0de6-11d0-a285-00aa003049e2'   # userAccountControl
  filter_machine_accounts:
    SubjectUserName|endswith: '$'
  filter_system:
    SubjectUserSid: 'S-1-5-18'
  condition: selection and not 1 of filter_*
falsepositives:
  - Directory-sync / IAM service accounts run under a user identity (allowlist by SID).
level: informational
