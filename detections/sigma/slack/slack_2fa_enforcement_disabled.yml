title: Slack workspace 2FA enforcement setting changed
id: d5b947fd-ac5c-4d25-8d7e-5241c555aaf5
status: experimental
description: |
  Detects the workspace require-two-factor setting being changed in the Slack audit log
  (action=pref.two_factor_auth_changed). Enforced 2FA is what keeps a stolen password from
  being enough; disabling it drops every member to password-only and widens the blast radius
  of any credential the attacker holds or phishes next (T1562.001). The change is rare and
  high-impact, so any change warrants review - especially one paired with new logins or a
  fresh admin grant; a disable followed by anomalous sign-ins is the takeover-enabling shape.
  Fires on the CHANGE, not the direction, and that is a deliberate limitation rather than an
  oversight. Slack documents this action as carrying the previous and new values in a
  `details` object, but does not publish the key names inside it, so there is no field this
  rule can safely name to isolate the disable. It previously ANDed a flat top-level
  `two_factor_required: false`, which is not a shape the audit log emits - so the rule matched
  nothing at all while looking scoped and green (the failure mode #149 is about). Firing on
  both directions is the honest form: an enable is a low-volume, obviously-benign triage item,
  where the old form was silent on the disable it exists to catch.
  DEPLOY-REQUIRED: gate on the direction at the backend, once you can see a real event -
  pull the new value out of `details` in your Slack collector's mapping and suppress the
  enable. Same posture as entra_illicit_consent_grant, which likewise names the structured
  field it cannot express in Sigma and leaves the mapping to the SIEM.
  Validate (purple): turn off "Require two-factor authentication" from dotfiles-Offense (htpx pair
  slack-2fa-disable).
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/slack-2fa-audit.md
author: dotfiles-Defense
date: 2026-07-03
modified: 2026-08-21
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  product: slack
  service: audit
detection:
  selection:
    action: 'pref.two_factor_auth_changed'
  condition: selection
falsepositives:
  - The 2FA requirement being turned ON, which this rule cannot distinguish from a disable
    (see the description) - triage the `details` payload on the event itself; it is rare
    enough to read by hand until the backend mapping gates the direction.
  - A deliberate, ticketed policy change - manage the 2FA requirement as a locked org setting
    and alert on any downgrade, reconciling against the change record.
level: high
