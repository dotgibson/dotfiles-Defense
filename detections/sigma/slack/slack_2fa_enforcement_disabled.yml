title: Slack 2FA enforcement disabled (workspace auth weakened)
id: d5b947fd-ac5c-4d25-8d7e-5241c555aaf5
status: experimental
description: |
  Detects the workspace require-two-factor setting being turned off in the Slack audit log
  (action=pref.two_factor_auth_changed, two_factor_required=false). Enforced 2FA is what keeps
  a stolen password from being enough; disabling it drops every member to password-only and
  widens the blast radius of any credential the attacker holds or phishes next (T1562.001). The
  change is rare and high-impact, so any disable warrants review - especially one paired with
  new logins or a fresh admin grant; a disable followed by anomalous sign-ins is the
  takeover-enabling shape.
  Validate (purple): turn off "Require two-factor authentication" from dotfiles-Kali (htpx pair
  slack-2fa-disable).
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/slack-2fa-audit.md
author: dotfiles-Defense
date: 2026-07-03
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  product: slack
  service: audit
detection:
  selection:
    action: 'pref.two_factor_auth_changed'
    two_factor_required: false
  condition: selection
falsepositives:
  - A deliberate, ticketed policy change - manage the 2FA requirement as a locked org setting
    and alert on any downgrade, reconciling against the change record.
level: high
