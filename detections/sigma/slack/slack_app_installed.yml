title: Slack app installed (durable data-access foothold)
id: 6f66f0e6-7c7c-40ca-bf12-05ed5338066f
status: experimental
description: |
  Detects an app install in the Slack audit log (action=app_installed). An OAuth app with
  broad read scopes (channels:history, files:read, users:read.email) gives its bot/user token
  durable programmatic access to messages, files, and the member directory that survives the
  compromised admin's password reset (T1098). Apps should come from a reviewed, approved set,
  so one installed by an unexpected actor, requesting broad read scopes, or added during an
  incident is the persistence tell; an app_installed followed by bulk conversations.history
  reads is the collect shape.
  Validate (purple): authorize a broad-scope app from dotfiles-Offense (htpx pair
  slack-malicious-app).
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/slack-app-audit.md
author: dotfiles-Defense
date: 2026-07-03
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: slack
  service: audit
detection:
  selection:
    action: 'app_installed'
  condition: selection
falsepositives:
  - Installing a sanctioned integration - require admin approval for new apps, reconcile
    against the approved-app allowlist, and alert on broad read-scope grants or unexpected actors.
level: high
