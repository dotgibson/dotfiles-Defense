title: Slack Connect external shared channel (channel exfiltration)
id: 59446f62-cb86-4873-9733-7dfd51e3e138
status: experimental
description: |
  Detects a Slack Connect shared-channel invite in the Slack audit log
  (action=shared_channel_invite_sent or shared_channel_invite_accepted). Opening a channel to
  an outside workspace makes its entire history - past and future messages and files - readable
  from that org, a low-friction exfiltration path over a trusted SaaS feature that never
  touches an egress proxy (T1567). Shares are legitimate but bounded to known partners, so an
  invite naming an unknown external org, on a sensitive channel, or by an unexpected actor is
  the tell; an invite quickly followed by bulk file access is the drain shape.
  Validate (purple): invite an external org via conversations.inviteShared from dotfiles-Kali
  (htpx pair slack-external-share).
references:
  - https://attack.mitre.org/techniques/T1567/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/slack-external-share-audit.md
author: dotfiles-Defense
date: 2026-07-03
tags:
  - attack.exfiltration
  - attack.t1567
logsource:
  product: slack
  service: audit
detection:
  selection:
    action:
      - 'shared_channel_invite_sent'
      - 'shared_channel_invite_accepted'
  condition: selection
falsepositives:
  - Sanctioned Slack Connect with a known partner - allowlist approved external orgs/domains
    and alert on invites naming any other, especially on sensitive channels.
level: high
