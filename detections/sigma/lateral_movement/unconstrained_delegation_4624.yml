title: Unconstrained delegation abuse - DC machine account authenticating to a non-DC (4624)
id: b7f0439c-5d82-4e61-9c07-1a3e58d2b0f4
status: experimental
description: |
  Detects the capture half of unconstrained-delegation abuse: a domain controller's
  MACHINE account completing a Kerberos network logon (4624 type 3) onto a host that
  is not itself a domain controller.
  The invariant is direction. A DC has no reason to authenticate OUT to an ordinary
  member server - DC-to-DC traffic is replication, and inbound auth to a DC is the
  normal shape. When DC01$ shows up as the TargetUserName on some other machine's
  4624, something MADE it authenticate: the attacker sets unconstrained delegation on
  a host they control (or stands up a machine account with it), then coerces the DC
  to it with PrinterBug/PetitPotam/DFSCoerce. Because the destination is trusted for
  unconstrained delegation, the DC's own TGT is forwarded and cached in that host's
  LSASS, where Rubeus monitor lifts it - and a DC TGT is the domain.
  This is the second half of a two-rule chain: coercion_named_pipes_5145 catches the
  trigger on the wire (the spoolss/efsrpc/lsarpc pipe touch), this catches the
  coerced logon landing. Either alone is triage; both within a minute is the attack.
  Kerberos is required in the selection because the TGT forwarding this steals is a
  Kerberos mechanism - an NTLM-authenticated coercion is the relay case, covered by
  siem/{splunk/correlation_searches.conf,sentinel/ntlm_relay_4624.yaml}. Drop the
  AuthenticationPackageName term if you want both shapes in one alert.
  The durable control is configuration, not detection: mark privileged accounts
  "sensitive and cannot be delegated", put them in Protected Users, and audit for
  unconstrained delegation on anything that is not a DC (TRUSTED_FOR_DELEGATION on
  userAccountControl). This catches it when that isn't in place.
  Validate (purple): coerce a DC to a delegation-enabled host and monitor for the TGT
  from dotfiles-Offense (hacktheplanet "Poisoning & relay" fold; PURPLE-TEAM
  unconstrained-deleg-4624 row). Requires Logon auditing (success) on member servers,
  which is where this event is written - not on the DC.
references:
  - https://attack.mitre.org/techniques/T1187/
  - https://attack.mitre.org/techniques/T1558/
  - https://attack.mitre.org/techniques/T1550/003/
author: dotfiles-Defense
date: 2026-08-05
tags:
  # Three deliberately: unconstrained-delegation abuse has no single ATT&CK id and forcing
  # it into one would misstate the coverage. T1187 is the forced authentication that
  # produces the logon, T1558 is the TGT the attacker walks away with (this rule detects
  # the CAPTURE, which is theft), and T1550.003 is the pass-the-ticket use that follows.
  - attack.credential_access
  - attack.t1187
  - attack.t1558
  - attack.lateral_movement
  - attack.t1550.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: 'Kerberos'
    # DEPLOY-REQUIRED: replace with your domain-controller computer accounts (the
    # identities that must never authenticate outbound to a member server). Until
    # filled this matches only DC1$/DC2$, so a coerced logon from any other real DC
    # is missed entirely — this rule is inert until you substitute your inventory.
    # Run detections/sigma/deploy-required.sh to find this.
    TargetUserName:
      - 'DC1$' # example — replace with your real domain-controller computer accounts
      - 'DC2$'
  filter_dc_destinations:
    # DEPLOY-REQUIRED: replace with the hostnames of those same domain controllers, as
    # they appear in the Computer field of the host WRITING the event. DC-to-DC
    # authentication is normal replication and must not alert. Until filled, a real
    # DC-to-DC logon between anything other than DC1/DC2 would fire.
    Computer|startswith:
      - 'DC1' # example — replace with your real domain-controller hostnames
      - 'DC2'
  condition: selection and not filter_dc_destinations
falsepositives:
  - A DC reaching a member server for a sanctioned reason (backup agent, monitoring
    pull, a management tool running as the machine account) - allowlist that
    destination host once you have confirmed why the DC authenticates to it.
  - Read-only DCs and DCs mid-promotion, whose names may not yet be in the lists above.
level: high
