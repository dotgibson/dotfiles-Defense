title: WMI remote exec - shell spawned by WmiPrvSE
id: e367cca9-bbab-4a16-a15e-38839cb0849a
status: experimental
description: |
  Detects WMI-based remote execution (impacket-wmiexec, nxc --exec-method wmiexec):
  the payload runs as a child of WmiPrvSE.exe with no service install (7045) to
  catch. A process creation whose parent is WmiPrvSE.exe spawning cmd/powershell is
  the signal - especially with the "cmd.exe /Q /c <cmd> 1> <file> 2>&1" output-redirect
  shape both tools build. impacket writes to \\127.0.0.1\<share>\ (ADMIN$ by default,
  `-share` moves it); NetExec writes to \Windows\Temp\<6 chars>, or to
  \\<attacker-ip>\<share>\ in its fileless mode. Legit WMI providers spawn children too,
  so this pairs the parent-shell shape AND the redirect to keep the rule high-confidence. Redirect-less wmiexec variants
  (`-nooutput`, a custom --exec-method, or a hand-rolled client that skips the tee) fall
  to a separate, lower-confidence hunt on the WmiPrvSE-parent shape alone.
  Validate (purple): run impacket-wmiexec from dotfiles-Offense (hacktheplanet "Lateral
  movement & remote execution" fold; htpx pair wmiexec-impacket).
references:
  - https://attack.mitre.org/techniques/T1047/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/wmiexec-4688.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-28
tags:
  # This rule keys on WmiPrvSE spawning a child on the TARGET, which is the remote
  # half of wmiexec — lateral movement by construction. ATT&CK files T1047 under
  # Execution alone, so the lateral-movement tag is a deliberate addition.
  - attack.execution
  - attack.lateral-movement  # attack-tactic-deliberate
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\WmiPrvSE.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_redirect:
    # Keyed on the redirect SHAPE, not its destination. impacket examples/wmiexec.py builds
    # `cmd.exe /Q /c <cmd> 1> \\127.0.0.1\<share>\__<ts> 2>&1` (<share> from `-share`);
    # NetExec nxc/protocols/smb/wmiexec.py builds `... 1> \Windows\Temp\<6> 2>&1`, or
    # `... 1> \\<local_ip>\<share>\<6> 2>&1` fileless. Matching the loopback UNC caught only
    # impacket, so the destination is left free: quiet mode, /c, an explicit stdout redirect
    # and the stderr tee. `-nooutput` drops the redirect entirely and is NOT caught here: a
    # bare WmiPrvSE -> cmd /Q /c is too common in WMI-driven management to alert on at this
    # level.
    CommandLine|contains|all:
      - '/Q'
      - '/c'
      - ' 1> '
      - '2>&1'
  condition: selection and selection_redirect
falsepositives:
  - Management software that legitimately drives WMI to run scripts (baseline and
    allowlist the specific command lines).
level: high
