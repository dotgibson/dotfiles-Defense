title: RDP session hijack - tscon redirect to an RDP endpoint
id: b60118d5-1b56-4de9-a188-e69c1554d590
status: test
description: |
  Detects the command-line path of RDP session hijacking: a process creation carrying a
  "tscon ... /dest:rdp-tcp#" command line. Low false-positive on what it covers - admins
  almost never tscon to another session's RDP endpoint by hand - and it covers both the
  direct invocation and the SYSTEM-via-service variant, because "sc create ... binpath=
  ...tscon.../dest:rdp-tcp#..." embeds that same string in sc.exe's own command line and
  matches on it.
  Blind spot, stated rather than left to be discovered: tscon.exe is a thin wrapper over
  the Wtsapi32 WTSConnectSession / WTSDisconnectSession API, and a hijack that calls the
  API directly runs neither tscon.exe nor any "/dest:rdp-tcp#" argument, so this rule does
  not see it. This is not hypothetical - SharpRDPHijack is a public C# PoC that does
  exactly that (it operates on localhost and needs SYSTEM, or the target user's password,
  the same precondition the tscon path has). The API path leaves no process-creation
  artifact to key on at all, so closing it needs different telemetry - a 4624 Logon Type 7
  (session reconnect) whose Source Network Address is the console rather than a remote
  client, correlated against the session owner, is the direction, and it is a correlation
  this repo does not yet carry rather than a keyword this rule can add. Treat a hit here as
  high-confidence and the absence of one as not-clear.
  Validate (purple): run the tscon/sc-create hijack from dotfiles-Offense (hacktheplanet
  "Lateral movement & remote execution" fold; htpx pair rdp-hijack-tscon). The API-wrapper
  variant (SharpRDPHijack) is the case this rule is blind to - worth running to see the gap.
references:
  - https://attack.mitre.org/techniques/T1563/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/rdp-hijack-4688.md
  - https://github.com/bohops/SharpRDPHijack
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-28
tags:
  - attack.lateral-movement
  - attack.t1563.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '/dest:rdp-tcp#'
  tscon_image:
    Image|endswith: '\tscon.exe'
  as_system:
    # tscon run as SYSTEM connects ANY session without its password. With no /dest it
    # attaches the target to the CURRENT session - the classic interactive hijack from a
    # SYSTEM shell (`psexec -s cmd`, then `tscon 3`) - which /dest:rdp-tcp# never saw.
    # Sysmon 1 only: User is Sysmon's field, and the windows-audit pipeline passes it
    # through unmapped, so on native 4688 this arm has no field to read. A 4688-only
    # deployment substitutes `SubjectUserSid: 'S-1-5-18'` (the creator). Both cannot be
    # named here: a backend that queries a column the channel lacks fails the whole
    # search rather than the one branch. `SYSTEM` is the English rendering
    # (NT AUTHORITY\SYSTEM); a localized OS writes its own.
    User|contains: 'SYSTEM'
  condition: selection or (tscon_image and as_system)
falsepositives:
  - Rare helpdesk shadow/remote-control tooling that wraps tscon (allowlist it).
level: high
