title: Suspicious service installed (psexec-style remote exec)
id: fd22807d-bdb8-44b8-81f4-8d44c8be24b4
status: experimental
description: |
  Detects a new service install (7045) whose binary path is the psexec/remote-exec
  shape: a service whose "binary" is a shell or scripting interpreter, or one served
  straight off the admin share. psexec-class lateral movement leaves one of three shapes,
  and each is matched here: smbexec's %COMSPEC% command-line service (the path list),
  Sysinternals PsExec's PSEXESVC, and impacket-psexec's randomly named binary in
  %systemroot% (an 8-letter .exe behind a 4-letter service name). An earlier revision
  matched only the first while describing all three. Allowlist your known services.
  Scoped to the interpreter/ADMIN$ shapes on purpose: a drop-directory match (\Users\,
  \Temp\) catches the same intrusions but also every third-party installer and updater
  that registers a service from a temp path, and a rule that fires on routine software
  installs gets muted. If you want drop-directory coverage, add it as a separate lower-
  confidence rule gated on a service-name or signed-binary allowlist.
  Second plane, and only that. svcctl_atsvc_remote_pipe_sysmon_18.yml (id
  e9d70412-5340-436c-9917-b3664f5d77a7) sees the svcctl pipe bind that PRECEDES this
  service install, on Sysmon 18 rather than the System channel. It is corroboration, not
  coverage this rule lacks - but it survives an estate that never forwards 7045, and it
  fires earlier in the chain, on the request rather than the result.
  dotgibson/dotfiles-Defense#229.
  Validate (purple): run impacket-psexec from dotfiles-Offense (hacktheplanet "Lateral
  movement & remote execution" / "Active Directory" folds; pairs with pth-lateral-nxc).
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://github.com/dotgibson/dotfiles-Offense/blob/main/PURPLE-TEAM.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-27
tags:
  # PsExec's remote service creation IS the lateral-movement step — the service is
  # created on the TARGET by an operator who is already elsewhere. ATT&CK files
  # T1569.002 under Execution alone, so the lateral-movement tag is a deliberate
  # addition, not a mistag.
  - attack.lateral-movement  # attack-tactic-deliberate
  - attack.execution
  - attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
  suspicious_path:
    ImagePath|contains:
      # The interpreter-as-a-service shapes: a service whose "binary" is a shell or an
      # interpreter command line, or one served straight off the admin share. Bare
      # '\Users\' and '\Temp\' were deliberately REMOVED - third-party installers and
      # updaters legitimately register services from those paths at volume, and a path
      # match that common turns a medium-severity rule into a mute button. If you want
      # them back, gate them behind a service-name / signed-binary allowlist rather than
      # adding them here.
      - '\ADMIN$\'
      - '%COMSPEC%'
      - '\cmd.exe'
      - 'powershell.exe'
      - 'powershell -'
      - 'pwsh.exe'
      - 'cscript'
      - 'wscript'
      - 'rundll32'
      - 'mshta'
  sysinternals_psexec:
    # Sysinternals PsExec installs PSEXESVC from %SystemRoot%\PSEXESVC.exe. `-r` renames
    # the service and binary, so the default name is a floor, not the whole tool.
    - ServiceName: 'PSEXESVC'
    - ImagePath|endswith: '\PSEXESVC.exe'
  impacket_psexec_binary:
    # impacket-psexec (impacket/examples/serviceinstall.py) uploads an 8-random-letter .exe
    # and installs it as %systemroot%\<8 letters>.exe via ADMIN$, or \\host\share\<8
    # letters>.exe on another writable share. Neither contains \ADMIN$\ or an interpreter.
    # DEPLOY-REQUIRED (Elastic only): Lucene regexes match the whole term implicitly, have
    # no (?i) flag, and read ^ and $ as literals, so the generated Lucene form of this
    # branch never matches. Rewrite it in your Elastic rule as
    #   ImagePath:/%systemroot%\\[a-zA-Z]{8}\.exe/ AND ServiceName:/[a-zA-Z]{4}/
    # (impacket writes the lowercase %systemroot% literally). Splunk and Sentinel need
    # nothing: both take the anchored, case-insensitive pattern as written.
    ImagePath|re: '(?i)^(%systemroot%|\\\\[^\\]+\\[^\\]+)\\[a-z]{8}\.exe$'
  impacket_psexec_name:
    # ...paired with its 4-random-letter service name, so a legitimate 8-letter binary in
    # %SystemRoot% does not match on the path alone.
    ServiceName|re: '^[A-Za-z]{4}$'
  condition: selection and (suspicious_path or sysinternals_psexec or (impacket_psexec_binary and impacket_psexec_name))
falsepositives:
  - Legitimate management agents that install transient services (allowlist by
    service name and signed binary path).
level: medium
