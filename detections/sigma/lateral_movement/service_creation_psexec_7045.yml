title: Suspicious service installed (psexec-style remote exec)
id: fd22807d-bdb8-44b8-81f4-8d44c8be24b4
status: experimental
description: |
  Detects a new service install (7045) whose binary path is the psexec/remote-exec
  shape: a service whose "binary" is a shell or scripting interpreter, or one served
  straight off the admin share. psexec-class lateral movement (impacket-psexec, smbexec)
  leaves this even when the service name is randomized - detect on the binary path shape
  and allowlist your known services.
  Scoped to the interpreter/ADMIN$ shapes on purpose: a drop-directory match (\Users\,
  \Temp\) catches the same intrusions but also every third-party installer and updater
  that registers a service from a temp path, and a rule that fires on routine software
  installs gets muted. If you want drop-directory coverage, add it as a separate lower-
  confidence rule gated on a service-name or signed-binary allowlist.
  Validate (purple): run impacket-psexec from dotfiles-Offense (hacktheplanet "Lateral
  movement & remote execution" / "Active Directory" folds; pairs with pth-lateral-nxc).
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://github.com/dotgibson/dotfiles-Offense/blob/main/PURPLE-TEAM.md
author: dotfiles-Defense
date: 2026-06-30
tags:
  - attack.lateral-movement
  - attack.execution
  - attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
  suspicious_path:
    ImagePath|contains:
      # The interpreter-as-a-service shapes: a service whose "binary" is a shell or an
      # interpreter command line, or one served straight off the admin share. Bare
      # '\Users\' and '\Temp\' were deliberately REMOVED - third-party installers and
      # updaters legitimately register services from those paths at volume, and a path
      # match that common turns a medium-severity rule into a mute button. If you want
      # them back, gate them behind a service-name / signed-binary allowlist rather than
      # adding them here.
      - '\ADMIN$\'
      - '%COMSPEC%'
      - '\cmd.exe'
      - 'powershell.exe'
      - 'powershell -'
      - 'pwsh.exe'
      - 'cscript'
      - 'wscript'
      - 'rundll32'
      - 'mshta'
  condition: selection and suspicious_path
falsepositives:
  - Legitimate management agents that install transient services (allowlist by
    service name and signed binary path).
level: medium
