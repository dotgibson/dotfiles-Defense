title: S3 object-read base - a single GetObject on a bucket
id: 2b1fc5c4-ede9-45de-94bb-67ac57baa33d
status: experimental
description: |
  Base event for the bulk-exfil correlation below: one CloudTrail S3 GetObject. Not
  actionable alone - every application read looks exactly like this. The exfil shape is
  one principal reading many distinct object keys in a short window, expressed by the
  correlation rule.
  Requires S3 DATA-EVENT logging on the bucket. GetObject is a data event, not a
  management event, so a trail without data events selected for the bucket emits nothing
  here and both documents are inert - this is the S3 equivalent of the SACL requirement
  on the 4663 rules. Where data events are off, fall back to S3 server access logs or the
  CloudWatch BytesDownloaded metric; neither is Sigma-shaped, so they are triage inputs,
  not this rule.
references:
  - https://attack.mitre.org/techniques/T1530/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/aws-s3-exfil-cloudtrail.md
author: dotfiles-Defense
date: 2026-08-12
name: s3_object_read
tags:
  - attack.collection
  - attack.t1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 's3.amazonaws.com'
    eventName: 'GetObject'
  filter_bulk_readers:
    # DEPLOY-REQUIRED: replace with the backup, analytics, replication, and ETL roles that
    # read whole buckets by design. This filter matters as much as filter_indexers does on
    # the 4663 read rule and for the same reason: object reads are constant, so an unfilled
    # list means your nightly backup or Athena scan trips the correlation, someone mutes
    # it, and the mute is the blind spot. Identify the bulk readers from your own CloudTrail
    # before deploying. Run detections/sigma/deploy-required.sh to find this.
    userIdentity.arn|startswith:
      - 'arn:aws:sts::111122223333:assumed-role/backup-replication/'   # example — replace
  condition: selection and not filter_bulk_readers
falsepositives:
  - Any normal object read - defeated by the distinct-key count below.
level: informational
