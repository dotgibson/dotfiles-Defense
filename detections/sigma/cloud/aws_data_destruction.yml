title: AWS storage-delete base - one destructive call on a storage service
id: 42634a94-84dd-4071-bd07-b15bbfb96af2
status: experimental
description: |
  Base event for the destruction-burst correlation below: a single delete call against a
  storage or backup service (EC2/RDS snapshots, S3 buckets and objects, DynamoDB tables).
  Not actionable alone - one delete is housekeeping. The impact shape is a burst of them
  from one principal, expressed by the correlation rule.
  Mixed telemetry planes, which is worth knowing before you deploy: DeleteSnapshot,
  DeleteDBClusterSnapshot, DeleteDBSnapshot, DeleteBucket, and DeleteTable are MANAGEMENT
  events and are always in the trail. DeleteObject/DeleteObjects are S3 DATA events and
  appear only if data-event logging is enabled for the bucket - the same prerequisite the
  S3 exfil rule carries. The rule still works with data events off, just with the narrower
  management-event verb set.
references:
  - https://attack.mitre.org/techniques/T1485/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/cloud-destroy-cloudtrail.md
author: dotfiles-Defense
date: 2026-08-12
name: aws_storage_delete
tags:
  - attack.impact
  - attack.t1485
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    # Scoped by eventSource as well as verb, per the convention the other CloudTrail rules
    # follow. It matters more here than it looks: these verb names are not unique to one
    # service - DeleteTable is AWS Glue as well as DynamoDB, and DeleteSnapshot is
    # ElastiCache and FSx as well as EC2. This list IS the rule's scope boundary; add the
    # storage services your estate actually runs.
    eventSource:
      - 'ec2.amazonaws.com'          # EBS snapshots
      - 'rds.amazonaws.com'          # RDS / Aurora snapshots
      - 's3.amazonaws.com'           # buckets and objects
      - 'dynamodb.amazonaws.com'     # tables
      - 'elasticache.amazonaws.com'  # cache snapshots (also DeleteSnapshot)
      - 'fsx.amazonaws.com'          # FSx volume snapshots (also DeleteSnapshot)
    eventName:
      - 'DeleteSnapshot'
      - 'DeleteDBClusterSnapshot'
      - 'DeleteDBSnapshot'
      - 'DeleteBucket'
      - 'DeleteObject'
      - 'DeleteObjects'
      - 'DeleteTable'
  filter_iac:
    # DEPLOY-REQUIRED: replace with your IaC / automation principal(s). A `terraform
    # destroy` of an ephemeral environment and a scheduled snapshot-retention job are the
    # two largest benign sources of a delete burst, and both look exactly like the attack
    # from CloudTrail alone. Until filled this excludes only the example role. Run
    # detections/sigma/deploy-required.sh to find this.
    userIdentity.arn|startswith:
      - 'arn:aws:sts::111122223333:assumed-role/terraform-apply/'   # example — replace
  condition: selection and not filter_iac
falsepositives:
  - Any single routine delete - defeated by the burst count below.
level: informational
---
title: AWS cloud data destruction burst (control-plane wiper, T1485)
id: 9dadf25d-c752-453b-b37f-a3b8041aa4b8
status: experimental
description: |
  Detects Data Destruction (T1485) on the AWS control plane: one principal issuing a burst
  of delete calls across storage and backup services in a short window - snapshots, buckets,
  objects, and tables going away together. This is the cloud-native form of the extortion
  or wiper endgame, and the counterpart to the on-prem impact/data_destruction_wipe rule
  (cipher /w, sdelete, diskpart clean) which only ever sees an endpoint. Before this rule
  the corpus had no control-plane destruction coverage at all: T1485 was Windows-only.
  Volume is the invariant, not the verb. A single delete is housekeeping and a retention
  policy trims snapshots every night; what no maintenance workflow produces is a dense
  run of deletes from one identity inside five minutes. Deleting the backups is also the
  step that turns a ransomware incident into an unrecoverable one, so this is worth pairing
  with cloud/aws_iam_privesc_policy - privilege escalation followed by a destruction burst
  from the same principal is the whole chain.
  Two triage signals the correlation cannot express but the backend can: VARIETY (distinct
  eventName values - housekeeping deletes one kind of thing, a rampage deletes snapshots
  AND buckets AND tables) and ERRORS (an errorCode mix as the principal probes what it is
  allowed to destroy). Weight both when the alert lands.
  Structural defence beats detection here: S3 Object Lock, MFA-delete, and cross-account
  backup copies the compromised principal cannot reach.
  Validate (purple): run the snapshot/bucket destruction fold from dotfiles-Kali (htpx pair
  cloud-snapshot-destroy).
references:
  - https://attack.mitre.org/techniques/T1485/
correlation:
  type: event_count
  rules:
    - aws_storage_delete
  group-by:
    - userIdentity.arn
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - Snapshot-retention and lifecycle jobs trimming expired backups on a schedule - the
    reason filter_iac exists; suppress the automation principal there.
  - Teardown of an ephemeral environment (`terraform destroy`, a CI stack cleanup) - the
    same filter, and the same reason to identify your automation ARNs before deploying.
  - An administrator decommissioning a retired service by hand (expected, and in a change
    window - triage on whether the principal normally touches these services at all).
level: high
