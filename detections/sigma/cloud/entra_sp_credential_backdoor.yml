title: Entra service-principal credential added (app backdoor)
id: 73a70b60-05ed-4f99-a380-175d62df0b24
status: experimental
description: |
  Detects a credential (client secret or certificate) being added to an Entra app
  registration / service principal - the durable cloud backdoor: the attacker then
  authenticates as the app, non-interactive, no MFA, surviving user password resets.
  The credential-add audit event is the invariant; triage by who did it, which
  (privileged) app it targets, and whether it lines up with a normal app-lifecycle
  change. A credential added to a high-privilege app by an unexpected actor is the
  tell.
  Validate (purple): run "az ad app credential reset" / Add-MgApplicationPassword
  from dotfiles-Offense (htpx pair sp-cred-backdoor; companion-only, M365/Entra section).
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/sp-cred-auditlogs.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-23
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName:
      - 'Add service principal credentials'
      - 'Add application credentials'
      - 'Update application - Certificates and secrets management'
      - 'Update application – Certificates and secrets management'
  filter_app_automation:
    # DEPLOY-REQUIRED: replace with the OBJECT ID of each secret-rotation / CI/CD principal
    # that legitimately adds app credentials (a Key Vault rotation function's managed
    # identity, the pipeline's workload identity). Until filled this excludes only the
    # example, so every scheduled rotation alerts - the #1 false positive this rule names,
    # and the one that gets it muted. Run detections/sigma/deploy-required.sh to find this.
    #
    # Same shape as entra_directory_role_grant's filter_iga, for the same reasons (the full
    # argument is there): an object id, never the `Identity` display name, which is
    # mutable and fails open on a rename; `contains` against the whole `InitiatedBy`
    # column, because the id sits at InitiatedBy.user.id for a human and
    # InitiatedBy.app.servicePrincipalId for an app and Sigma cannot coalesce the two; and
    # never InitiatedBy.app.appId, which is the APPLICATION and would exempt every
    # principal using it. Resolve with `az ad sp show --id <appId> --query id`.
    #
    # Keep this list to rotation automation. The attacker's move is to add a credential
    # to an app they can already write to, so an allowlisted actor is one whose own
    # compromise this rule can no longer see - which is the right trade only for a
    # principal that does nothing else.
    InitiatedBy|contains:
      - '00000000-0000-0000-0000-000000000000'   # example — replace with an object id
  condition: selection and not filter_app_automation
falsepositives:
  - Routine secret/cert rotation by app owners or CI/CD automation - allowlist the
    automation's OBJECT ID in filter_app_automation; baseline the human owners, and
    alert on credentials added to privileged apps or by unexpected principals.
level: medium
