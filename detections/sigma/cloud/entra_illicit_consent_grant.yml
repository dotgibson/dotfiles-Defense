title: Entra consent grant to a third-party app (illicit-consent triage)
id: 06d00b40-680e-4f4b-a675-889c2a2dd0ed
status: experimental
description: |
  Detects an OAuth consent grant in Entra ID that hands a third-party app a high-value
  scope: a "Consent to application" / delegated-permission-grant audit event whose granted
  scopes include mail/file/directory reads (Mail.Read, offline_access, Files.Read.All,
  Directory.Read.All, ...). Scoping to the high-risk scope set is what separates this from
  the earlier bare "any consent" form - most consent is benign app onboarding, and firing
  on all of it is a mute-me alert; the abuse is the refresh token to a user's mail/files
  with no password and no MFA on reuse, surviving password resets. A sanctioned LOB app
  can legitimately hold these scopes, so allowlist its app ID in filter_known_apps
  (deploy-time); triage the rest by app, scope, and whether the app is newly registered/
  unverified. Restricting user consent to verified publishers turns this into prevention.
  Validate (purple): run an illicit-consent grant from dotfiles-Offense (htpx pair
  consent-grant; companion-only, M365/Entra section).
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/consent-grant-auditlogs.md
author: dotfiles-Defense
date: 2026-06-30
tags:
  - attack.credential-access
  - attack.t1528
logsource:
  product: azure
  service: auditlogs
detection:
  selection_consent:
    OperationName:
      - 'Consent to application'
      - 'Add delegated permission grant'
      - 'Add OAuth2PermissionGrant'
  selection_highrisk_scope:
    # The granted scope set. Compiled raw here (matches the scope string wherever it
    # lands in the event); on Sentinel map this to the granted-permissions field —
    # TargetResources.modifiedProperties has newValue = "DelegatedPermissionGrant.Scope".
    TargetResources|contains:
      - 'Mail.Read'
      - 'Mail.ReadWrite'
      - 'Mail.Send'
      - 'offline_access'
      - 'Files.Read.All'
      - 'Files.ReadWrite.All'
      - 'Sites.Read.All'
      - 'Directory.Read.All'
      - 'full_access_as_user'
  filter_known_apps:
    # DEPLOY-REQUIRED: replace with your sanctioned app (client) IDs so verified LOB apps
    # that legitimately hold these scopes don't alert. Until filled this excludes only the
    # example. Run detections/sigma/deploy-required.sh to find this.
    TargetResources|contains:
      - '00000000-0000-0000-0000-000000000000'   # example client id — replace
  condition: selection_consent and selection_highrisk_scope and not filter_known_apps
falsepositives:
  - Sanctioned line-of-business apps onboarded via user consent that legitimately need
    mail/file scopes - allowlist their app IDs in filter_known_apps, or restrict user
    consent to verified publishers (which turns this into prevention).
level: medium
