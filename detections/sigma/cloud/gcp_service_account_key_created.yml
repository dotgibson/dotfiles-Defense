title: GCP user-managed service-account key created
id: fa087bf0-f2fb-4e40-a676-c448718da9f7
status: experimental
description: |
  Detects a user-managed service-account key being added in GCP Cloud Audit Logs -
  google.iam.admin.v1.CreateServiceAccountKey (Google generates the pair and hands back
  the private key) or google.iam.admin.v1.UploadServiceAccountKey (the caller brings
  their own public key and keeps the private half). Both end the same way: a long-lived
  credential outside SSO/MFA bound to the service account, the classic GCP persistence
  backdoor. The upload verb is the one to remember - it never has the private key
  transit Google at all, which is exactly what an attacker wants, and it was the one
  call this rule did not select when first shipped. Google recommends disabling
  user-managed keys outright; alert on either verb for privileged service accounts, by
  unexpected actors, or anywhere org policy forbids them. The org-policy constraints
  iam.disableServiceAccountKeyCreation and iam.disableServiceAccountKeyUpload are the
  preventive controls, one per verb.
  Validate (purple): run "gcloud iam service-accounts keys create" from dotfiles-Offense
  (htpx pair gcp-sa-key), then "keys upload" with a locally generated public key.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/gcp-sa-key-audit.md
author: dotfiles-Defense
date: 2026-06-30
modified: 2026-09-02
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
      - 'google.iam.admin.v1.CreateServiceAccountKey'
      - 'google.iam.admin.v1.UploadServiceAccountKey'
  filter_iac:
    # DEPLOY-REQUIRED: replace with your IaC / secrets-automation principal(s) that
    # legitimately mint SA keys (the Terraform service account, a key-rotation job).
    # Until filled this excludes only the example. Run
    # detections/sigma/deploy-required.sh to find this.
    gcp.audit.principal_email:
      - 'iam-terraform@example.iam.gserviceaccount.com'   # example — replace
  condition: selection and not filter_iac
falsepositives:
  - CI/CD or Terraform provisioning that legitimately creates SA keys (allowlist the
    automation principals in filter_iac; prefer workload identity / short-lived creds
    and alert on the rest).
level: medium
