title: Azure Key Vault secret-read base - SecretGet in the AuditEvent log
id: 0ead5785-8bc1-40ac-812a-4f5582bdd007
status: experimental
description: |
  Base event for the bulk-secret-read correlation below: one SecretGet against a Key Vault,
  from the vault's AuditEvent diagnostic log. Not actionable alone - every application reads
  its own secret on boot, so a single SecretGet matches the overwhelming majority of normal
  traffic. The exfil shape is one identity reading many DISTINCT secrets in a short window,
  which the correlation expresses.
  SecretGet ONLY. SecretList and SecretListVersions return names and versions, not values -
  they are the enumeration step, and counting them into a breadth measure would let a single
  legitimate inventory call inflate the score. The List is still the corroborating pivot at
  triage: a SecretList immediately followed by a run of SecretGets from the same identity is
  the drain in its clearest form, and it is what the paired red does.
  NO RESULT FILTER, for the same reason the Azure Run Command rule carries no status arm. A
  burst of DENIED SecretGets across many distinct secrets is a principal sweeping a vault it
  has no permission on, which is a sharper finding than a successful read by an identity that
  was always allowed to read - filtering to ResultType Success would drop exactly that.
  Both arms are the same correlation; triage splits them on ResultType.
  Fields are the AzureDiagnostics (Azure-diagnostics mode) spelling. For a vault whose
  diagnostic setting uses RESOURCE-SPECIFIC mode the rows land in AZKVAuditLogs instead, and
  the mapping is not a rename: OperationName carries over, requestUri_s becomes RequestUri,
  and the identity columns collapse into a single dynamic `Identity`. That last one is a trap
  worth naming - the claims inside it are keyed by their full XML-schema URIs
  (`http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn`,
  `http://schemas.microsoft.com/identity/claims/objectidentifier`), NOT by the short names,
  so `Identity.claim.upn` silently resolves to nothing. Only `appid` is a short key in the
  raw event. AzureDiagnostics is the form this rule ships because it is what the paired htpx
  entry queries and because its identity claims are already flat columns, which a correlation
  can group by.
references:
  - https://attack.mitre.org/techniques/T1555/006/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/azure-keyvault-audit.md
author: dotfiles-Defense
date: 2026-09-07
name: azure_keyvault_secret_read
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: azure
  service: keyvault
detection:
  selection:
    ResourceType: 'VAULTS'
    Category: 'AuditEvent'
    OperationName: 'SecretGet'
  filter_secret_automation:
    # DEPLOY-REQUIRED: replace with the identities that legitimately read many secrets in one
    # window - the secrets-sync operator, a CI job that hydrates an environment, the config
    # service that reads the whole vault on deploy. These exist in most estates and each one
    # is a standing false positive at any threshold, because breadth is their normal shape.
    # Until filled this excludes only the example. Run detections/sigma/deploy-required.sh.
    #
    # The value is an object id (oid), NOT a name. identity_claim_oid_g is the objectidentifier
    # claim, which is the only caller field present for BOTH a human and a service principal -
    # identity_claim_upn_s is null for an SP, and identity_claim_appid_g is the APPLICATION,
    # so allowlisting by appid would exempt every principal using that app. The Azure CLI's
    # shared appid is the worst case: allowlist it and you have exempted every CLI user in the
    # tenant. Resolve the identity with `az ad sp show --id <appId> --query id` for a service
    # principal, or `az ad user show --id <upn> --query id` for a human.
    identity_claim_oid_g:
      - '00000000-0000-0000-0000-000000000000'   # example — replace with an oid
  condition: selection and not filter_secret_automation
falsepositives:
  - An application reading its own secret - the common case, and the reason breadth rather
    than volume is the signal. Filtered out by the distinct-secret count below.
level: informational
---
title: Azure Key Vault bulk secret read (cloud credential-store drain, T1555.006)
id: f85ea902-6fa9-42bd-bac0-140e170d3247
status: experimental
description: |
  Detects Credentials from Password Stores: Cloud Secrets Management Stores (T1555.006) -
  one identity reading many distinct secrets from a Key Vault in a short window. This is the
  cloud twin of vault_bulk_secret_read, and the same argument holds: a healthy application
  re-reads its own small set of secrets, while an attacker who has taken a token sweeps
  across unrelated ones. Breadth per identity is the invariant, not read RATE - a flat
  "more than N reads" is wrong in both directions at once, letting the automation principal
  that legitimately reads 200 secrets a run stay silent while a targeted grab of the ten
  highest-value secrets sails under the floor.
  BUCKET FIRST, THEN COUNT. The window is what makes this a rule rather than a statistic: an
  unbucketed distinct-count over a long search range aggregates a whole day's normal reads
  into one number, and a sweep spread across hours never trips it. 15 minutes is the paired
  entry's bin and is kept here.
  COUNTING requestUri_s IS AN APPROXIMATION, and it is worth knowing which way it errs. The
  entry's KQL recovers the secret NAME with `split(requestUri_s, "/")[4]`; Sigma has no such
  transform, so this counts distinct request URIs instead. Those differ when one caller reads
  the same secret at several explicit VERSIONS in one window, which inflates the count. The
  reason it is still sound is the group-by: within a single identity the client library and
  api-version are constant, and version-pinned re-reads of one secret are a rotation pattern,
  not an application pattern. The error is toward MORE sensitivity, never less - it can
  produce a false positive, it cannot hide a sweep.
  THRESHOLD. The paired entry's query uses a legible `> 10`; this ships at 20 to match
  vault_bulk_secret_read, the sibling rule for the same technique against a different store,
  so an analyst tuning one credential-store rule starts from the same number in the other.
  Both say the same thing about where it ends up: the real answer is a per-caller baseline,
  and the flat floor is the starting point, not the destination.
  Triage on an identity that has never read at this breadth before, a service principal
  rather than a human, a CallerIPAddress outside the expected egress set, and a SecretList
  in the same window - the enumeration that tells you the caller did not know what it was
  looking for.
  ON THE SENTINEL FORM. This is a Sigma correlation, so the kusto backend cannot express it
  and detections/siem/sentinel/rules.generated.kql carries it as UNSUPPORTED - the same as
  vault_bulk_secret_read and aws_s3_bulk_exfil, which is a property of the backend rather
  than of this rule. For an Azure rule that gap points somewhere useful rather than nowhere:
  the paired htpx entry linked from the base rule above IS the Sentinel implementation, a
  summarize over bin(TimeGenerated, 15m) that this correlation is the portable statement of.
  Deploy from there on Sentinel; the Splunk form generates and is in savedsearches.
  Validate (purple): bulk-read secrets from one vault under a single token from
  dotfiles-Offense (htpx pair azure-keyvault-secret-dump).
references:
  - https://attack.mitre.org/techniques/T1555/006/
correlation:
  type: value_count
  rules:
    - azure_keyvault_secret_read
  group-by:
    - identity_claim_oid_g
  timespan: 15m
  condition:
    gte: 20
    field: requestUri_s
falsepositives:
  - Secrets-sync operators, CI environment hydration, and config services that read a whole
    vault on deploy - allowlist the object id in filter_secret_automation on the base rule
    rather than raising this threshold, which would blunt the rule for every other identity.
  - A vault deliberately used as a small config store that an app reads wholesale on start.
    Baseline that caller and allowlist it; a vault holding twenty secrets that one identity
    always reads together is not the shape this rule is for.
level: high
