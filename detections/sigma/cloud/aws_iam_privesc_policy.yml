title: AWS IAM privilege escalation via policy attach/put (CloudTrail)
id: 8419ba47-7317-4eee-8928-110c2e8850df
status: experimental
description: |
  Detects the classic AWS IAM privilege-escalation primitive: granting a controlled
  principal more permission than it had, by attaching a managed policy, inlining a
  policy document, publishing a new default version of a customer-managed policy, or
  dropping the principal into a privileged group (T1098.003). This is the step that turns
  a limited foothold into an administrative one, and it is the gap between the two
  credential-minting rules already here - aws_iam_access_key_created (the key) and
  aws_login_profile_created (the console password) both give the attacker a way IN; this
  is how they make that way WORTH having.
  UpdateAssumeRolePolicy reaches the same outcome from the other end: instead of giving
  the principal more permission, it rewrites a privileged role's trust policy so the
  attacker's principal is allowed to assume it. No policy is attached and no group
  changes - the grant is in the role's trust document - so an attach-only view misses it
  as completely as it misses the policy-version path below.
  CreatePolicyVersion/SetDefaultPolicyVersion are the quiet ones: no policy is attached
  to anything, so an attach-only detection misses them entirely - the attacker edits a
  policy the target already holds. Triage on the granted policy (AdministratorAccess,
  iam:*, PassRole, or any wildcard action/resource), on the target principal, and on
  actor != target, the same actor-vs-target call the sibling IAM rules leave to the
  analyst.
  Validate (purple): run the Pacu iam__privesc_scan policy-attach path from dotfiles-Offense
  (htpx pair aws-iam-privesc-policy).
references:
  - https://attack.mitre.org/techniques/T1098/003/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/aws-iam-privesc-cloudtrail.md
author: dotfiles-Defense
date: 2026-08-05
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
      - 'AttachUserPolicy'
      - 'AttachRolePolicy'
      - 'AttachGroupPolicy'
      - 'PutUserPolicy'
      - 'PutRolePolicy'
      - 'PutGroupPolicy'
      - 'CreatePolicyVersion'
      - 'SetDefaultPolicyVersion'
      - 'AddUserToGroup'
      - 'UpdateAssumeRolePolicy'
  filter_iac:
    # DEPLOY-REQUIRED: replace with your IaC / access-management automation principal(s)
    # so pipeline-driven IAM changes - the busiest source of these events in any account
    # with Terraform or Control Tower - don't alert. Until filled this excludes only the
    # example role. Run detections/sigma/deploy-required.sh to find this.
    userIdentity.arn|startswith:
      - 'arn:aws:sts::111122223333:assumed-role/terraform-apply/'   # example — replace
  condition: selection and not filter_iac
falsepositives:
  - Terraform / IaC and identity-provisioning automation attaching policies (allowlist the
    automation principal in filter_iac and alert on interactive callers).
  - An IAM administrator granting permissions through the console during change control
    (expected - triage on the granted policy and the target principal).
level: medium
