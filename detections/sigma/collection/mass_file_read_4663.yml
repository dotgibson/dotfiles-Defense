title: File read handle base (4663)
id: 6d1a94c7-30fb-4e58-9c2a-8b7f05e3d146
status: experimental
description: |
  Base event for the local-collection correlation below: a 4663 object-access event
  where a process actually used READ access on a file (AccessMask 0x1, ReadData).
  Not actionable alone - opening a file to read it is what computers do. The
  collection shape is one process reading a large, diverse set of files in minutes,
  expressed by the correlation rule.
  This is the read-side twin of impact/mass_file_encryption_4663, which keys on the
  WRITE/DELETE masks (0x2/0x4/0x6/0x10000) from the same event and the same SACL. The
  masks are what separate "someone is copying the file share" from "someone is
  encrypting it"; the ingestion requirement is identical, so if you already turned on
  auditing for that rule you already have this one's data.
  Requires the Object Access > File System audit subcategory + a SACL on the
  directories you care about. Without it 4663 is not emitted at all, and the SACL's
  scope - not the rule - sets this detection's reach.
references:
  - https://attack.mitre.org/techniques/T1005/
author: dotfiles-Defense
date: 2026-08-05
name: file_read_handle_4663
tags:
  - attack.collection
  - attack.t1005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    ObjectType: 'File'
    AccessMask: '0x1' # ReadData — the single-bit read form
  filter_indexers:
    # DEPLOY-REQUIRED: replace with the backup, indexing, AV, and sync agents that read
    # your SACL'd trees continuously. This filter matters MORE than the equivalent on the
    # write-side rule: writes across a share are rare, reads are constant, so without
    # this list the correlation below fires on your backup window every night and gets
    # muted - which is the failure mode the methodology warns about. Identify the
    # sweepers from your own data before deploying. Run
    # detections/sigma/deploy-required.sh to find this.
    ProcessName|endswith:
      - '\SearchIndexer.exe'
      - '\MsMpEng.exe'
      - '\backup-agent.exe' # example — replace with your backup/sync agents
  condition: selection and not filter_indexers
falsepositives:
  - Any normal file read (defeated by the distinct-file count below).
level: informational
