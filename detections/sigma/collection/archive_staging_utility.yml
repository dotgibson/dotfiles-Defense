title: Collected data staged into an archive (T1560.001)
id: 9c0f5a83-4e21-4b7d-8a16-2f7e03c9b415
status: experimental
description: |
  Detects the packaging step between collection and exfiltration: a command-line
  archiver compressing data, either under a password or into a staging directory.
  The invariant is that bulk data leaves as a container, not as ten thousand
  individual reads. Exfiltration over almost any channel - HTTP PUT, a cloud sync
  client, a C2 upload, physical media - is preceded by "make it one file, make it
  small". That step runs a utility, and the utility takes arguments.
  Two shapes, both scoped to the archiver binaries so the argument matching stays
  meaningful:
  - PASSWORD. `rar a -hp<pass>` / `7z a -p<pass>` produces an encrypted archive.
    Almost nothing on an endpoint legitimately does this unattended, and `-hp` also
    encrypts the header so the file list can't be read - a defensive measure for the
    attacker, not the user. This is the near-zero-FP half.
  - STAGING PATH. Archiving into Temp, Public, or ProgramData. Users archive to their
    own Documents or Desktop; staging directories are chosen because they are
    world-writable and unremarkable, which is exactly what makes them remarkable here.
  Detection posture: the password half is high-confidence on its own. The staging
  half is a triage surface - software packaging and installer builds do it - so
  filter_backup_tooling exists to suppress the ones your build/backup estate runs.
  This is the "stage" half of a pair: collection_mass_file_read_4663 catches the
  READ sweep that fills the directory, this catches the archive it is packed into.
  Either alone is worth a look; both on one host within a window is the collection
  chain, and if egress follows, exfiltration is already in progress.
  Generic `category: process_creation` so it matches both Security-4688 and Sysmon-1
  (it names only Image and CommandLine, which both channels carry).
  Validate (purple): stage and archive a directory under a password from
  dotfiles-Kali (hacktheplanet collection/exfil fold; htpx pair archive-staging-rar).
  Requires the Process Creation audit subcategory (4688) or Sysmon EventID 1.
references:
  - https://attack.mitre.org/techniques/T1560/001/
  - https://attack.mitre.org/techniques/T1074/001/
author: dotfiles-Defense
date: 2026-08-05
tags:
  - attack.collection
  - attack.t1560.001
  - attack.t1074.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_password:
    Image|endswith:
      - '\rar.exe'
      - '\winrar.exe'
      - '\7z.exe'
      - '\7za.exe'
      - '\7zg.exe'
    CommandLine|contains:
      - ' -hp' # rar: encrypt data AND header (hides the file list)
      - ' -p' # 7z/rar: encrypt data
      - ' -mhe' # 7z: encrypt header
  selection_staging_archiver:
    Image|endswith:
      - '\rar.exe'
      - '\winrar.exe'
      - '\7z.exe'
      - '\7za.exe'
      - '\7zg.exe'
      - '\tar.exe'
      - '\makecab.exe'
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
  selection_staging_powershell:
    # Compress-Archive is common admin scripting, so it counts only when the
    # destination is a staging directory - the same test as the archiver half.
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains|all:
      - 'Compress-Archive'
      - '\Temp\'
  filter_backup_tooling:
    # DEPLOY-REQUIRED: replace with the backup, packaging, and build tooling that
    # legitimately archives into staging paths in YOUR estate (installer builds and
    # backup agents are the usual pair). Until filled this excludes only the example,
    # so a build server running 7z into %TEMP% on every job will alert steadily - that
    # is the noisy half of this rule and this list is how you quiet it without touching
    # the password half. Run detections/sigma/deploy-required.sh to find this.
    ParentImage|endswith:
      - '\backup-agent.exe' # example — replace with your backup/packaging tooling
  # The filter gates ONLY the staging half. Scoping matters: filter_backup_tooling is a
  # PARENT-process list, and a parent is a weak thing to trust - anything that can be
  # spawned by the backup agent would inherit its suppression. The staging-path branch is
  # noisy enough to need that trade; the password branch is not, and silencing an
  # encrypted archive because of who launched it would throw away the high-confidence
  # signal to quiet the low-confidence one. Both validated: see the two manifest rows.
  condition: selection_password or (1 of selection_staging_* and not filter_backup_tooling)
falsepositives:
  - Software packaging, installer builds, and CI jobs that archive into %TEMP% (suppress
    via filter_backup_tooling; the password-protected half is unaffected).
  - An administrator collecting logs into a password-protected archive for a vendor
    (triage on the account, the source paths, and whether egress follows).
level: high
