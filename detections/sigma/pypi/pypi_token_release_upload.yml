title: PyPI release uploaded via token, not trusted publishing (supply-chain implant)
id: c3b50e57-6fb4-426c-92c0-184304009593
status: experimental
description: |
  Detects a PyPI release published with a long-lived API token rather than OIDC trusted
  publishing: a project:release:add event whose additional.uploaded_via_trusted_publisher
  is false. The flag lives on the project security event, not the "new release" journal
  row - the journal records no publisher at all, so a journal-based filter on it can never
  suppress anything and every release alerts. Trusted
  publishing is the secure norm, so a token-based upload is the higher-signal case: it is how
  a stolen token ships a trojanized release whose code runs downstream when an sdist is built
  or the package is imported (T1195.002), and it bypasses the OIDC path entirely. Alert on
  token uploads to projects that normally publish via trusted publishing, and on any first-ever
  uploader of a widely depended-on package.
  Validate (purple): `twine upload -u __token__ -p <token> dist/*` from dotfiles-Offense (htpx
  pair pypi-malicious-publish).
references:
  - https://attack.mitre.org/techniques/T1195/002/
  - https://github.com/dotgibson/htpx/blob/main/entries/blue/pypi-publish-audit.md
author: dotfiles-Defense
date: 2026-07-03
modified: 2026-09-27
tags:
  - attack.initial-access
  - attack.t1195.002
logsource:
  product: pypi
  service: audit
detection:
  selection:
    tag: 'project:release:add'
  filter_trusted:
    additional.uploaded_via_trusted_publisher: true
  condition: selection and not filter_trusted
falsepositives:
  - Projects that legitimately still publish with API tokens - migrate them to trusted
    publishing, allowlist the known uploader, and alert on first-time or unexpected uploaders.
level: high
