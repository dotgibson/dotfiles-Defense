# pySigma validation config for `sigma check` (used by .github/workflows/sigma.yml).
#
# Removes only the two validators that require live MITRE downloads — the ATT&CK
# (`attacktag`) and D3FEND (`d3_fendtag`) tag dictionaries — so the structural lint
# runs HERMETICALLY (no network) and can't flake on a download. Tag *namespace and
# format* are still validated by the remaining validators; the "is this a real
# published technique ID" lookup is run separately as an advisory, non-blocking step
# in the workflow.
#
# Everything else stays on: condition/field/value sanity, duplicate ids/titles,
# detection-block correctness, status/level values, etc.
validators:
  - all
  - -attacktag
  - -d3_fendtag

# Per-RULE validator exclusions. Scoped to one rule id each, with a reason, so the
# validator keeps protecting every other rule in the corpus.
exclusions:
  # aws_snapshot_share_external — number_as_string cannot tell a digit-only IDENTIFIER
  # from a number. Its allowlist holds AWS account IDs, which CloudTrail emits as
  # strings (and nests as strings inside the `valuesToAdd` JSON array). Unquoting them
  # to satisfy the validator compiles a numeric literal into the Sentinel form
  # (`== 111122223333`) that never matches the string field, so the allowlist silently
  # stops suppressing — the exact class of defect fixture-provenance.tsv exists to
  # expose, since the rule's own TN fixture still passes through the Python evaluator.
  # The validator stays ON everywhere else, where a quoted EventID really is a mistake.
  660a05c0-75eb-487a-8263-cec5d2f2678b: number_as_string
