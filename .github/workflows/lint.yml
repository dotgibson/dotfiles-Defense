name: lint

# Thin caller for the reusable shell/actionlint gate authored in dotfiles-core
# (.github/workflows/lint-call.yml) — one definition for the whole fleet, replacing the
# ~200-line copy this file used to carry. The gate's internals (the SHA-256-verified
# pinned-tool bootstrap, the core/ exclude, shfmt-advisory) live there now. This repo has no
# extra excludes (only Offense does), so no `with:` is needed.
# NO paths-ignore, deliberately. A `paths-ignore`d workflow does not report a status at
# all on a PR it skips, and a REQUIRED check that never reports leaves that PR permanently
# pending — so a docs-only change could never merge. Since this gate is now required on
# main, it has to report on every PR. The cost is nil: with no shell files in the diff the
# reusable's steps hit their "no repo-owned .sh" early exit and the job is green in seconds.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: dotgibson/dotfiles-core/.github/workflows/lint-call.yml@v5
