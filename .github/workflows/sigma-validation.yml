name: sigma-validation

# ──────────────────────────────────────────────────────────────────────────────
# Detection-EFFICACY gate for the host plane: proves each Sigma rule actually FIRES on
# the event telemetry it claims to catch — the executable form of every "Validate
# (purple)" line. sigma.yml proves the rules parse + compile; this proves they *work*.
#
# The job replays a committed JSON-lines event fixture through the real shipped Sigma rule
# with zircolite (native Sigma via the pysigma windows-audit / sysmon pipeline) and asserts
# the rule's id lands in the detections. Deterministic (committed fixtures), hermetic (no
# EVTX capture, no live host). Mirror of network-validation.yml for the Sigma corpus.
#
# BOTH JOBS ARE REQUIRED CHECKS, so `pull_request` below is deliberately UNFILTERED, for
# the same reason sigma.yml's is. A path-filtered required check never reports on a PR
# that misses its paths, and GitHub then holds that PR forever — the deadlock #213 had to
# fix for `bootstraps on a bare ubuntu:24.04`. The ruleset on main already required
# `sigma validate + compile` but neither job here, so #354 merged with the host plane red
# and main stayed red for four days before anyone looked; a Renovate PR with auto-merge
# squashes the moment the compile gate is green, whatever this file says. Each job is
# pure CPU on a checkout and runs in a few minutes, so it simply runs everywhere; gating
# the steps instead would put a bug in that gating logic between the corpus and its
# efficacy gate. `push` stays filtered; post-merge runs on main gate nothing.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    paths:
      - "detections/sigma/**"
      - "docker/validation/sigma-manifest.tsv"
      - "docker/validation/sigma-cloud-manifest.tsv"
      - "docker/validation/sigma-fixtures/**"
      - "docker/validation/sigma_eval.py"
      - "docker/validation/run-sigma-validation.sh"
      - "docker/validation/run-cloud-validation.sh"
      - "docker/validation/zircolite-constraints.txt"
      - "detections/requirements.txt"
      - ".github/workflows/sigma-validation.yml"
  pull_request: # deliberately unfiltered — both jobs are required checks; see the header

concurrency:
  group: sigma-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: sigma rules fire on synthetic event logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out zircolite (pinned) — the Sigma-over-events engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wagga40/Zircolite
          ref: v3.7.6
          path: .zircolite

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install zircolite deps (pysigma + pipelines)
        # -c: zircolite's requirements.txt floats `pysigma>=0.10.10`, so the engine that
        # decides whether every host-plane rule FIRES was picking its Sigma parser at
        # install time. The constraints file pins that pair and says why (a pyparsing
        # release broke condition parsing for most of this corpus); everything else in
        # zircolite's requirements stays zircolite's call.
        run: pip install -c docker/validation/zircolite-constraints.txt -r .zircolite/requirements.txt

      - name: Validate sigma rules (attack events -> rule fires)
        run: ZIRCOLITE="$PWD/.zircolite/zircolite.py" bash docker/validation/run-sigma-validation.sh

  validate-cloud:
    name: cloud sigma rules fire on synthetic events (nested-field plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install pysigma + pyparsing (the evaluator's only deps, pinned for determinism)
        # sigma_eval.py walks pySigma's OWN parsed condition tree, so it breaks exactly
        # where the parser does. pyparsing was never pinned here and 1.4.0 predates the
        # fix, so most of these rows were erroring out — invisibly, because the path filter
        # above meant the job had not run since before the bad release landed. An evaluator
        # error is NOT counted as a passing true-negative (see run-cloud-validation.sh on
        # why that distinction is load-bearing), so this would have surfaced as a hard fail
        # the moment anyone touched detections/sigma/, on a PR that changed none of it.
        # See detections/requirements.txt for the full story and SigmaHQ/pySigma#548.
        #
        # -c, not -r: the versions come from the sigma gate's requirements file, so there
        # is one copy for Renovate to bump (#322), but only these two get installed — the
        # evaluator needs no CLI and no backends.
        run: pip install -c detections/requirements.txt pysigma pyparsing

      - name: Validate cloud sigma rules (TP fires + TN silent, nested fields preserved)
        run: bash docker/validation/run-cloud-validation.sh
