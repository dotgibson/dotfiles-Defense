name: sigma

# ──────────────────────────────────────────────────────────────────────────────
# Detection-content gate: the Sigma rules in detections/sigma/ ARE code, so they
# get a real CI check (the repo's lint.yml only covers shell). Two things are
# proven on every change:
#
#   1. STRUCTURAL LINT (hard gate, hermetic) — `sigma check` with a validation
#      config that drops only the two validators needing live MITRE downloads, so
#      the gate can't flake on a network hiccup. Catches bad YAML, broken
#      conditions, dangling field refs, duplicate ids/titles, bad status/level, …
#   2. COMPILE (hard gate) — every rule must compile to a real backend (Splunk) via
#      detections/sigma/convert.sh. A rule that can't be converted isn't deployable.
#
# ATT&CK-tag validity (is this a real published technique id) is a third, ADVISORY
# step — it needs to download the MITRE ATT&CK/D3FEND dictionaries, so it must never
# break the build on a transient download failure.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    paths:
      - "detections/sigma/**"
      - "detections/siem/**"
      - "detections/navigator/**"
      - "detections/sigma-validation-config.yml"
      - "detections/check-methodology.sh"
      - "DEFENSE-METHODOLOGY.md"
      - ".github/workflows/sigma.yml"
  pull_request:
    paths:
      - "detections/sigma/**"
      - "detections/siem/**"
      - "detections/navigator/**"
      - "detections/sigma-validation-config.yml"
      - "detections/check-methodology.sh"
      - "DEFENSE-METHODOLOGY.md"
      - ".github/workflows/sigma.yml"

concurrency:
  group: sigma-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sigma:
    name: sigma validate + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install sigma-cli + backends (pinned — this is a hard gate)
        # splunk drives the compile gate + savedsearches deploy form; elasticsearch (lucene)
        # and kusto (Sentinel KQL) drive the multi-SIEM deploy forms in gen-siem.sh.
        run: pip install "sigma-cli==3.0.2" "pysigma-backend-splunk==2.1.0" "pysigma-backend-elasticsearch==2.1.0" "pysigma-backend-kusto==1.0.1"

      - name: Structural lint (hard gate, hermetic)
        # --fail-on-issues: `sigma check` exits 0 on validator *issues* by default
        # (only parse/semantic errors fail it); the flag makes issues gate too.
        run: sigma check --fail-on-issues -c detections/sigma-validation-config.yml detections/sigma/

      - name: Compile every rule to Splunk (hard gate)
        run: ./detections/sigma/convert.sh splunk > /dev/null

      - name: SIEM deploy-form drift gate (hard gate)
        # The Splunk savedsearches deploy form is GENERATED from the Sigma tree; this
        # proves the committed detections/siem/splunk/savedsearches.generated.conf still
        # matches what gen-siem.sh produces, so the deploy artifact can't drift by hand.
        run: ./detections/siem/gen-siem.sh --check

      - name: ATT&CK Navigator layer drift gate (hard gate)
        # The coverage layer is GENERATED from the Sigma rules' attack.* tags; this proves
        # the committed detections/navigator/coverage-layer.json still matches, so the
        # coverage view can't drift from the rules.
        run: ./detections/navigator/gen-navigator.sh --check

      - name: ATT&CK coverage report drift gate (hard gate)
        # COVERAGE.md is the human-readable roll-up (by tactic / technique / logsource)
        # GENERATED from the same Sigma tags; this proves the committed
        # detections/navigator/COVERAGE.md still matches, so the report can't drift.
        run: ./detections/navigator/gen-coverage.sh --check

      - name: Methodology claims gate (hard gate)
        # DEFENSE-METHODOLOGY.md is the one hand-written map of the detection layer, so
        # unlike the generated artifacts above it can't be drift-gated by regenerating and
        # diffing — two of its table's columns are editorial judgement. This asserts the
        # subset that IS checkable: referenced paths exist, and every ATT&CK technique it
        # names is either covered by a rule or declared absent in its own marker. The
        # inverse case is the valuable one — a declared gap that quietly gets filled makes
        # the prose describing it wrong, and this catches that.
        run: ./detections/check-methodology.sh

      - name: Validation coverage gate (hard gate)
        # The other gates here prove a rule PARSES and COMPILES. Firing is proved by
        # run-sigma-validation.sh — but that iterates the MANIFESTS, not the corpus, so a
        # rule nobody listed is silently never run against a fixture: it compiles, it
        # ships, and nothing ever demonstrated it fires.
        #
        # This closes that loop, and the matching one for exclusions: a true positive shows
        # a rule CAN fire, and says nothing about whether a filter_* still excludes. An
        # exclusion that quietly stopped matching keeps every TP green while the rule
        # floods the analyst.
        #
        # Adopted while green — 94/94 rules covered, 35/35 filtered rules carrying a true
        # negative — so it enforces the standard already being met rather than imposing a
        # new one. Genuine exceptions go in no-fixture-allowlist.tsv, with a reason.
        run: ./docker/validation/check-rule-coverage.sh

      - name: Fixture provenance gate (hard gate)
        # The coverage gate above proves every rule HAS a fixture. It cannot prove the
        # fixture reflects the provider's schema — and where a fixture was hand-written
        # from the same belief that produced the rule, the test is circular: the rule
        # passes its true positive and its true negative while being inert in production
        # (#149). No gate can tell a plausible invented field from a real one.
        #
        # What this enforces is that the distinction is never lost: every fixture a
        # manifest references must declare where its schema came from, so a new fixture
        # cannot arrive without someone saying whether the field names are captured,
        # vendor-documented, or assumed.
        run: ./docker/validation/check-fixture-provenance.sh

      - name: README gate-list correspondence (hard gate)
        # The gate list above exists twice: as these steps, and as the numbered prose +
        # copy-pasteable block in detections/README.md that contributors run before
        # pushing. Nothing tied them together, so they drifted — the two gates added in
        # #145 and #150 went undocumented and the README kept saying "Six hard checks".
        #
        # That is the one drift with a direct cost: the local block's promise is "run
        # these and CI will agree", so a stale block sends someone green locally into a
        # red CI run on a gate they were never told about. Same class as the artifact
        # drift gates above — a second copy of the truth, now checked instead of trusted.
        run: ./detections/check-readme-gates.sh

      - name: Splunk precedence gate (hard gate)
        # pySigma's Splunk backend does not parenthesise a top-level OR against a
        # top-level NOT, so `(a) OR (b) NOT (filter)` is correct only under the search
        # command's documented precedence (parens, NOT, OR, AND). Read the other way it
        # is `(a) OR (b AND NOT filter)` — one branch escapes its filter entirely, and
        # eval/where DO evaluate AND before OR.
        #
        # Nothing above sees it: zircolite evaluates the Sigma condition, where the
        # parentheses are explicit, and the drift gate compares the generated file
        # byte-for-byte rather than semantically. So the rule lints, compiles, fires on
        # its TP and stays silent on its TN while the deployed form rests on a precedence
        # rule nobody wrote down.
        #
        # Adopted while green — both instances present today are correct and signed off
        # in splunk-precedence-allowlist.tsv — so it holds the line rather than raising
        # it. The value is the third one: a review conversation instead of a silent
        # behaviour change. See #166.
        run: ./detections/siem/check-splunk-precedence.sh

      - name: ATT&CK tag validity (advisory — needs live MITRE data)
        continue-on-error: true
        run: sigma check --fail-on-issues detections/sigma/
