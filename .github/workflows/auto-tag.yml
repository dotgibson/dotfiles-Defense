name: auto-tag

# Cut THIS repo's own next vX.Y.Z release tag when a Core fan-out lands new core/ on
# main. Delegates to the reusable workflow in dotfiles-core — one definition of the
# version math + tagging (scripts/auto-tag.sh): PATCH-bump by default, idempotent (a
# no-op when HEAD is already tagged vX.Y.Z), and it tags in CI so the second version
# line (this repo's own tag) stops drifting from the Core it vendors. SHA-pinned, not
# @v4 — see the note on the `uses:` below.
on:
  push:
    branches: [main]
    paths: ['core/**']

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    # SHA-PINNED, unlike this repo's other Core callers, and deliberately so. `@vN` is a
    # MOVING tag — RELEASE-STRATEGY.md has tag-release.sh force-advance `v4` to each new
    # v4.x — which is the right trade for the read-only gates (lint, core-integrity,
    # notify-web): one definition, fleet-wide, updating itself. This caller is the
    # exception because it is the one that runs with `contents: write`, so "whatever v4
    # points at today" decides what executes with push access to this repo. dotfiles-Windows
    # already pins this same caller for this same reason (RELEASE-STRATEGY.md, auto-tag row).
    # Renovate bumps the SHA; the trailing comment is the human-readable version.
    uses: dotgibson/dotfiles-core/.github/workflows/auto-tag-call.yml@99211b6b192bff482d616d02d2493290dcea58df # v6.0.1
