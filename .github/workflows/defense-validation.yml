name: defense-validation

# Functional gate for the two files this repo actually ships: defense/defense.zsh (the
# band-85 role layer) and bootstrap.sh (the installer). The shared lint gate covers
# shellcheck + `bash -n` + `zsh -n`, which is syntax only — nothing asserted that mkcase
# builds the case tree, that note refuses an empty entry, that case data lands OUTSIDE the
# repo, or that the host-tool probe tells "installed but off $PATH" apart from "missing".
#
# NO path filter, deliberately. A `paths:`-filtered workflow does not report a status on
# PRs that miss the filter, and a REQUIRED check that never reports leaves the PR
# permanently pending — which would wedge every docs-only PR, including one fixing this
# file. This suite is seconds long, so it runs on everything and is safe to mark required.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: defense-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  role-layer:
    name: role layer + installer (functional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zsh is not on the ubuntu-latest image by default, and defense.zsh is zsh —
      # it opens with `[[ $- == *i* ]] || return 0`, so the suite drives it through
      # `zsh -f -i`. Without the shell there is nothing to test.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh

      - name: tests/test-defense.sh
        run: ./tests/test-defense.sh

      # Belt and braces around the installer's most dangerous property: --dry-run must
      # not write. Runs against a DEDICATED empty HOME, not the runner's own: snapshotting
      # a populated $HOME races with everything else on the machine that touches it, which
      # made this step pass on a PR and fail on the very next push of the same commit. An
      # empty directory that is still empty afterwards is the deterministic form of the
      # same assertion. The suite asserts this too; keeping it here as an independent
      # check means a regression in the suite's own helper cannot hide it.
      - name: bootstrap --dry-run writes nothing
        run: |
          scratch="$(mktemp -d)"
          HOME="$scratch" ./bootstrap.sh --dry-run --no-check
          written="$(find "$scratch" -mindepth 1 2>/dev/null)"
          if [ -n "$written" ]; then
            echo "::error::bootstrap.sh --dry-run wrote into HOME:" >&2
            printf '%s\n' "$written" >&2
            exit 1
          fi
          echo "clean HOME untouched by --dry-run"

      # And that it still exits 0 against the runner's real, populated HOME — the code
      # paths differ when $dst already exists (blib_link takes its "would back up" branch),
      # so this covers ground the empty-HOME run cannot. Exit status only; no write
      # assertion, because that is what made this racy.
      - name: bootstrap --dry-run succeeds against a populated HOME
        run: ./bootstrap.sh --dry-run --no-check > /dev/null
