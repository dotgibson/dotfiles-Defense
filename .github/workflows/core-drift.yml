name: core-drift

# Is the vendored core/ subtree behind upstream, and by how much?
#
# WHY. core.lock records WHICH Core this repo carries (core_version / core_sha / core_tag),
# which is good provenance — but nothing ever compared it to upstream, so a stale subtree
# read exactly like a current one. That is not hypothetical: bug reports were raised from
# this repo against Core 4.9.3 describing two defects already fixed in 4.10.0 upstream, and
# nothing in the repo could have said so. Silent drift becomes visible drift.
#
# Report-only. It opens (or appends to) one issue and changes nothing else — syncing the
# subtree stays a deliberate human act, per CLAUDE.md's "fix upstream then sync".

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC — off the hour, so it isn't queued behind the fleet
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: core-drift
  cancel-in-progress: false

jobs:
  drift:
    name: vendored core vs upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare core.lock against the latest upstream release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          [ -f core.lock ] || { echo "::error::core.lock is missing — cannot determine the vendored Core"; exit 1; }

          local_ver="$(sed -n 's/^core_version=//p' core.lock | head -n1)"
          local_sha="$(sed -n 's/^core_sha=//p'     core.lock | head -n1)"
          [ -n "$local_ver" ] || { echo "::error::core.lock has no core_version line"; exit 1; }

          # Newest vX.Y.Z upstream. Deliberately NOT /releases/latest: Core tags every
          # release but does not always cut a GitHub Release, and a missing release would
          # read as "no drift" — the exact false-negative this job exists to prevent.
          upstream_ver="$(gh api repos/dotgibson/dotfiles-core/tags --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)"
          [ -n "$upstream_ver" ] || { echo "::error::found no vX.Y.Z tags upstream — refusing to guess"; exit 1; }

          echo "vendored=$local_ver  upstream=$upstream_ver"
          {
            echo "local_ver=$local_ver"
            echo "local_sha=$local_sha"
            echo "upstream_ver=$upstream_ver"
          } >>"$GITHUB_OUTPUT"

          # Behind only when upstream sorts strictly newer. Equal, or a local build somehow
          # AHEAD of upstream, are both "nothing to report" — this job never nags.
          newest="$(printf '%s\n%s\n' "$local_ver" "$upstream_ver" | sort -V | tail -n1)"
          if [ "$newest" = "$local_ver" ]; then
            echo "behind=false" >>"$GITHUB_OUTPUT"
            echo "vendored Core is current ($local_ver)"
          else
            echo "behind=true" >>"$GITHUB_OUTPUT"
            echo "::notice::vendored Core $local_ver is behind upstream $upstream_ver"
          fi

      - name: Write the drift report
        if: steps.compare.outputs.behind == 'true'
        env:
          LOCAL_VER: ${{ steps.compare.outputs.local_ver }}
          LOCAL_SHA: ${{ steps.compare.outputs.local_sha }}
          UPSTREAM_VER: ${{ steps.compare.outputs.upstream_ver }}
        run: |
          set -euo pipefail
          # Heredoc rather than printf formats: the backticks below are markdown code
          # spans that must reach GitHub literally, and single-quoted printf strings
          # containing them trip shellcheck's SC2016 under actionlint. Unquoted heredoc
          # with escaped \` keeps the backticks literal while $VARS still interpolate.
          cat >drift-report.md <<EOF
          The vendored \`core/\` subtree is **behind upstream**.

          | | version |
          | --- | --- |
          | vendored here (\`core.lock\`) | \`$LOCAL_VER\` |
          | latest \`dotgibson/dotfiles-core\` | \`$UPSTREAM_VER\` |

          Vendored commit: \`$LOCAL_SHA\`

          Why this matters beyond being out of date: work done *against* the vendored copy
          can be wrong about upstream. A bug reproduced in \`core/\` here may already be
          fixed on \`main\`, and a report written from it wastes a maintainer's time.
          Check upstream before filing anything about Core.

          To sync (a deliberate act — never edit \`core/\` in place):

          \`\`\`bash
          git subtree pull --prefix core https://github.com/dotgibson/dotfiles-core.git v$UPSTREAM_VER --squash
          make core-lock
          \`\`\`

          Changelog: https://github.com/dotgibson/dotfiles-core/blob/v$UPSTREAM_VER/CHANGELOG.md
          EOF
          cat drift-report.md

      - name: File or update the drift issue
        if: steps.compare.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Reuses the repo's existing dedup helper: it appends to the open issue of the same
        # title when one exists, so a weekly run cannot stack duplicates. The title is
        # intentionally version-free — a title carrying the version would open a NEW issue
        # on every upstream release instead of updating the standing one.
        run: bash .github/workflows/file-routine-issue.sh "core/ is behind upstream" drift-report.md
