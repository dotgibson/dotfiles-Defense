name: network-validation

# ──────────────────────────────────────────────────────────────────────────────
# Detection-EFFICACY gate for the network plane: proves each Zeek/Suricata detection
# actually FIRES on the traffic shape it claims to catch — the executable form of every
# "Validate (purple)" line. Complements sigma.yml (which proves the Sigma rules parse +
# compile): this proves the network detections *work*.
#
# One job per engine, each in that engine's image (zeek / suricata on PATH), running
# docker/validation/run-validation.sh <engine> — which synthesizes an attack-shaped PCAP
# per manifest row, replays it through the real shipped detection, and asserts the
# expected signal fired. Deterministic (seeded generators), hermetic (no live capture),
# so both are hard gates.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    paths:
      - "detections/network/**"
      - "docker/validation/**"
      - ".github/workflows/network-validation.yml"
  pull_request:
    paths:
      - "detections/network/**"
      - "docker/validation/**"
      - ".github/workflows/network-validation.yml"

concurrency:
  group: network-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zeek:
    name: zeek detections fire on synthetic PCAPs
    runs-on: ubuntu-latest
    container:
      image: zeek/zeek:lts@sha256:73e80e9cd23ff71fd28d158e9a9af5c7b2b0ef5d4036af61521827531347c0e3
    steps:
      # The engine image is minimal; git is needed for checkout, python+scapy for fixtures.
      # This step runs before checkout on purpose — it only needs the container, not the repo.
      - name: Install deps (git, python, scapy)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip
          pip3 install --break-system-packages scapy || pip3 install scapy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate zeek detections (attack PCAP -> detection fires)
        run: bash docker/validation/run-validation.sh zeek

  suricata:
    name: suricata detections fire on synthetic PCAPs
    runs-on: ubuntu-latest
    # Install Suricata from Ubuntu rather than a suricata image — the common images are
    # CentOS/yum-based and lack the git/python/scapy the harness needs; the runner has all
    # of it, so apt is simplest and most reliable here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install suricata + scapy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends suricata python3-pip
          pip3 install --break-system-packages scapy || pip3 install scapy
      - name: Validate suricata detections (attack PCAP -> alert fires)
        run: bash docker/validation/run-validation.sh suricata
